name: check-specs

on:
  push:
    paths:
      - 'specs/**'
      - 'AGENTS.adoc'
      - 'README.adoc'
      - 'script/check-specs.py'
      - 'script/ai-review.sh'
      - '.github/workflows/check-specs.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'AGENTS.adoc'
      - 'README.adoc'
      - 'script/check-specs.py'
      - 'script/ai-review.sh'
      - '.github/workflows/check-specs.yml'

jobs:
  # 1) 确定性规范检查（引用完整性、栈登记一致、私有约定误导入）
  #    发现问题即返回非 0 退出码，使 action 失败。
  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run deterministic spec checks
        run: python3 script/check-specs.py

  # 2) AsciiDoc 语法编译验证（官方推荐方式：setup-ruby + gem install asciidoctor）
  #    任一个文件编译失败即使 action 失败。
  asciidoctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install asciidoctor
        run: gem install asciidoctor --no-document
      - name: AsciiDoc syntax check (compile each .adoc)
        shell: bash
        run: |
          fail=0
          for f in AGENTS.adoc $(find specs -name '*.adoc' -type f | sort); do
            echo "== checking $f"
            if ! asciidoctor -o /dev/null --failure-level=ERROR --warnings "$f"; then fail=1; fi
          done
          if [ $fail -ne 0 ]; then
            echo "AsciiDoc 语法检查未通过"
            exit 1
          fi

  # 3) AI 语义审查（可选）
  #    说明：GitHub Models 已于 2026-07-30 全面退役，原 actions/ai-inference 不再可用。
  #    因此这里改用 curl 直接调用 OpenAI 兼容 API（可由任意支持 OpenAI 协议的
  #    服务提供：OpenAI、DeepSeek、Taotoken 聚合、本地 vLLM 等）。
  #    需在仓库 Settings → Secrets 配置 AI_API_KEY 才启用；未配置时自动跳过（不报错）。
  #    输出格式约定：发现问题时最后一行必须为 ISSUES_FOUND，未发现为 NO_ISSUES_FOUND。
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: ${{ secrets.AI_API_BASE }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    outputs:
      findings: ${{ steps.assess.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
      - name: Call AI for spec consistency review
        id: review
        if: env.AI_API_KEY != ''
        shell: bash
        continue-on-error: true
        run: bash script/ai-review.sh AGENTS.adoc specs
      # 未配置 AI_API_KEY 时生成占位输出，避免后续 step 报错
      - name: Ensure findings file exists
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/ai-findings.txt ]; then
            echo "AI_API_KEY 未配置，AI 审查已跳过。" > /tmp/ai-findings.txt
            echo "NO_ISSUES_FOUND" >> /tmp/ai-findings.txt
          fi
      - name: Assess findings & write artifact
        id: assess
        shell: bash
        run: |
          if grep -q "NO_ISSUES_FOUND" /tmp/ai-findings.txt; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
            echo "AI 审查未发现问题。"
          else
            echo "findings=true" >> "$GITHUB_OUTPUT"
            echo "AI 审查发现问题。"
          fi
      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-findings
          path: /tmp/ai-findings.txt
          if-no-files-found: ignore

  # 4) AI 发现问题时使 action 失败（"怎么知道有问题"）
  fail-on-issues:
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.findings == 'true'
    steps:
      - name: Fail because AI found spec issues
        shell: bash
        run: |
          echo "AI 审查在规范中发现一致性问题，action 判定为失败。"
          echo "问题清单见 'ai-findings' artifact，或查看已自动创建的纠正 PR。"
          exit 1

  # 5) 自动创建纠正 PR（"创建 pull 纠正失败的内容"）
  auto-fix-pr:
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.findings == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          name: ai-findings
          path: /tmp/
      - name: Compose PR body from findings
        id: compose
        shell: bash
        run: |
          findings=$(cat /tmp/ai-findings.txt)
          echo "PR_TITLE=[auto] 规范检查发现问题，请修正" >> "$GITHUB_ENV"
          {
            echo "## AI 规范审查发现的问题及建议"
            echo ""
            echo '```'
            echo "$findings"
            echo '```'
            echo ""
            echo "请根据上述清单修正规范后合并。"
          } > /tmp/pr-body.md
          # 避免重复：若已存在同名开放 PR 则跳过
          existing=$(gh pr list --search '"[auto] 规范检查发现问题，请修正" in:title' --state open --json number --jq 'length' 2>/dev/null || echo 0)
          echo "EXISTING=$existing" >> "$GITHUB_ENV"
      - name: Open pull request
        if: env.EXISTING == '0'
        shell: bash
        run: |
          gh pr create \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md
