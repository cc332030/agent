name: check-specs

on:
  push:
    paths:
      - 'specs/**'
      - 'AGENTS_COMMON.adoc'
      - 'AGENTS.adoc'
      - 'INSTALL.adoc'
      - 'README.adoc'
      - 'script/check_specs.py'
      - 'script/ai-review.sh'
      - '.github/workflows/check-specs.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'AGENTS_COMMON.adoc'
      - 'AGENTS.adoc'
      - 'INSTALL.adoc'
      - 'README.adoc'
      - 'script/check_specs.py'
      - 'script/ai-review.sh'
      - '.github/workflows/check-specs.yml'

jobs:
  # 1) 确定性规范检查（引用完整性、栈登记一致、私有约定误导入 + AsciiDoc 语法编译）
  #    安装 asciidoctor 使语法验证真正执行（不再跳过）；发现问题即返回非 0，action 失败。
  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install asciidoctor
        run: gem install asciidoctor --no-document
      - name: Run deterministic spec checks (incl. asciidoctor syntax)
        run: python3 script/check_specs.py
      - name: Run spec-check unit tests
        run: python3 -m unittest discover -s script -p '*_test.py' -v

  # 2) AI 语义审查（可选）
  #    说明：GitHub Models 已于 2026-07-30 全面退役，原 actions/ai-inference 不再可用。
  #    因此这里改用 curl 直接调用 OpenAI 兼容 API（可由任意支持 OpenAI 协议的
  #    服务提供：OpenAI、DeepSeek、Taotoken 聚合、本地 vLLM 等）。
  #    需在仓库 Settings → Secrets 配置 AI_API_KEY 与 AI_MODEL 才启用；未配置时自动跳过（不报错）。
  #    模型名不写死，通过 AI_MODEL secret 自由接入任意 OpenAI 兼容模型
  #    （如 gpt-4o-mini、deepseek-chat、qwen-max 或本地 vLLM 模型等），
  #    配合 AI_API_BASE 指定对应服务地址。
  #    输出格式约定：发现问题时最后一行必须为 ISSUES_FOUND，未发现为 NO_ISSUES_FOUND。
  #    AI 校验并调整：加 --apply 后，发现问题时还会让 AI 直接产出每个文件的修正版内容
  #    并落盘（见 ai-review.sh），auto-fix-pr 把修正内容提交到分支开 PR，而非仅报问题清单。
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: ${{ secrets.AI_API_BASE }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    outputs:
      findings: ${{ steps.assess.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
      - name: Call AI for spec review & adjust
        id: review
        if: env.AI_API_KEY != ''
        shell: bash
        continue-on-error: true
        # --per-file：先逐个解析每个 .adoc，再整体拼接解析；
        # --apply：发现问题后让 AI 直接产出每个文件的修正版并落盘（AI 校验并调整）。
        # 逐文件结果写入 /tmp/ai-per-file，整体结果写入 /tmp/ai-findings.txt
        run: bash script/ai-review.sh --per-file --apply AGENTS_COMMON.adoc specs
      # 未配置 AI_API_KEY 时生成占位输出，避免后续 step 报错
      - name: Ensure findings file exists
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/ai-findings.txt ]; then
            echo "AI_API_KEY 未配置，AI 审查已跳过。" > /tmp/ai-findings.txt
            echo "NO_ISSUES_FOUND" >> /tmp/ai-findings.txt
          fi
      - name: Assess findings & write artifact
        id: assess
        shell: bash
        run: |
          if grep -q "NO_ISSUES_FOUND" /tmp/ai-findings.txt; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
            echo "AI 审查未发现问题。"
          else
            echo "findings=true" >> "$GITHUB_OUTPUT"
            echo "AI 审查发现问题。"
          fi
      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-findings
          path: |
            /tmp/ai-findings.txt
            /tmp/ai-per-file/*.md
          if-no-files-found: ignore

  # 3) AI 发现问题时使 action 失败（"怎么知道有问题"）
  fail-on-issues:
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.findings == 'true'
    steps:
      - name: Fail because AI found spec issues
        shell: bash
        run: |
          echo "AI 审查在规范中发现一致性问题，action 判定为失败。"
          echo "问题清单见 'ai-findings' artifact，AI 已自动产出修正版并提交到纠正 PR。"
          exit 1

  # 4) 提交 AI 修正并自动创建纠正 PR（"创建 pull 纠正失败的内容"）
  #    与 3) 分离：AI 校验并调整后，把已落盘的修正内容提交到分支并开 PR，
  #    PR 里包含实际改动（而非仅问题清单）。
  auto-fix-pr:
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.findings == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-run AI adjust to materialize fixes in this job's workspace
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        if: env.AI_API_KEY != ''
        shell: bash
        continue-on-error: true
        # 重新执行 AI 校验并调整，使工作区落到修正后的内容（ai-review job 的工作区不跨 job 保留）
        run: bash script/ai-review.sh --per-file --apply AGENTS_COMMON.adoc specs
      - name: Check for adjusted changes
        id: diff
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create fix branch and commit
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto/ai-spec-fix
          git add -A
          git commit -m "[auto] AI 校验并调整规范（修正 AI 审查发现的问题）" || true
      - name: Push & open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git push origin auto/ai-spec-fix
          findings=$(cat /tmp/ai-findings.txt 2>/dev/null || echo "AI 审查发现问题，已自动修正。")
          {
            echo "## AI 规范审查发现的问题及建议"
            echo ""
            echo '```'
            echo "$findings"
            echo '```'
            echo ""
            echo "本 PR 已由 AI 校验并调整：根据上述清单直接产出修正版内容并落盘提交，请人工复核后合并。"
          } > /tmp/pr-body.md
          # 避免重复：若已存在同名开放 PR 则跳过
          existing=$(gh pr list --search '"[auto] AI 校验并调整规范" in:title' --state open --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$existing" = "0" ]; then
            gh pr create \
              --title "[auto] AI 校验并调整规范" \
              --body-file /tmp/pr-body.md \
              --base main --head auto/ai-spec-fix
          fi
