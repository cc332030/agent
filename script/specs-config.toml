# = 规范集合的运行期配置（**取值的唯一一处定义**）
#
# 定位：本文件是「这东西放在哪、按什么取值」的**唯一一处**定义。脚本读它、机械判据也核它；
# 文档只**引一句**（写"取值见 `script/specs-config.toml`"），不再各抄一份。
#
# 为什么要有这个文件（用户口径）：『系统里配置、日志等涉及到的路径信息，应该是唯一真源，
# 不能每个地方写一份』『类似这样的信息应该放配置里，然后配置的路径可以再定义』『我说的不单单
# 是那几个脚本，而是**以后所有的开发**』——故这件事立为通用判据（`specs/general/coding.adoc`
# 「取值的唯一来源」），本文件是那条判据在**本仓库**的落点：本仓库所有"会被两处用到的取值"
# 都在这里，一处定义、两侧都来取、文档只引一句。
#
# 本文件自己的判据：`script/check_specs.py` 的 `check_paths_single_source_guard`——它核**四件事**：
# ① 本文件在、必填键齐；② 执行侧与判据侧都从这一处取值（代码里不再出现第二份字面值）；
# ③ 文档、注释、规则数据与维护方台账**不复述**取值（复述即第二份来源，只许一句回指）；
# ④ 本文件随分发物一起走时，读取层就近找得到它。
#
# 谁读它：`script/check_specs.py`（判据侧）与 `script/fetch-specs.py`（执行侧）都经
# `script/pathconfig.py` 读——**读取只有这一份实现**（执行侧按文件路径就地加载它，因为从
# 落点跑时没有 `script/` 那一层、也不在 `sys.path` 上）。故 `pathconfig.py` 与薄壳、逻辑代码
# 一起进 `[scripts].all`：落点里缺了读取层，执行脚本一启动就 `ModuleNotFoundError`。
# **取值只有这一处**，"代码里不写第二份字面量"由上面那道判据核住。

[landing]
# 取回的规范副本落在**用户家目录**下的哪一处，以及取规范脚本自己落在哪一处（落点根下）。
# `home_dir` 是家目录下的第一层，`app_dir` 是第二层，两者拼起来就是文档里说的那个落点
# ——**只有这一个**，不按平台另取一套（用户口径：不管什么系统、什么环境都是这一个路径；
# 理由见 `script/fetch-specs.py` 头部「落点」：换落点等于让"副本在哪"变成环境相关的事实）。
home_dir = ".cache"
app_dir = "agent-specs"

[source]
# 规范来源的默认地址（有对应的参数与环境变量可改，见 `script/fetch-specs.py` 头部）。
# 换过来源时副本按来源地址分槽（不同来源的副本互不覆盖，见该脚本的 `cache_slot_dir`）。
base_url = "https://agent.c332030.com"

[prompts]
# 提示词的**口令入口**：取下来之后，用口令点名跑哪一份提示词。

# 为什么要它（用户口径：『我要是能复制，我为什么还要下载下来』）：提示词取到本地了，若还得
# 打开文件、把人肉把那一整段贴进会话，那"取下来"这件事没换来任何东西——用户要的是**点名就能跑**。
# 一段文本要被"点名"领走，得先变成一个**可寻的命令入口**：agent 平台只认自己目录下的命令，
# 故由取规范脚本在落点根下**按本段登记现生成**这些入口（不在脚本里写死一个动作名与一份清单）。

# 每个入口的文件名主干（不含后缀）：入口名、agent 平台的命令位、点名的写法都由它拼出来，
# 三处因此不会各自漂移（`specs/general/script.adoc`「跨环境脚本」）。
name = "use-prompt"

# 口令的写形：`<name> <提示词登记名>`——登记名取提示词登记处表格里那一列的文件名主干
# （`prompts/review.adoc` → `review`）。登记处自己列着有哪些提示词，此处**不再列一份清单**。
usage = "{name} <提示词名>"

# 落到哪些 agent 平台的命令位：`{home}` 是**本轮现取到的家目录**，`{name}` 是上面的主干。
# 与取规范脚本自己的落点同一条口径——家目录每轮现取、不写死、不缓存。
agent_command_dirs = [
    "{home}/.claude/commands",
    "{home}/.codebuddy/commands",
]

[manifest]
# 取文件清单的**来源文件**：入口文档的加载调度器唯一登记了全部公共规范，清单从它解析。
entry = "AGENTS_COMMON.adoc"
# 有则取（仓库未放该文件时不算失败）
optional = ["README.adoc"]

[scripts]
# 与本脚本同处 `script/` 的安装脚本：一并取到落点**根下**（不在来源槽里）——跨来源共用
# 一份，下次重装直接跑落点里的入口。`entry` 是其中**给人直接敲**的那几个（取回的字节不带
# 文件模式，故取完给它们补可执行位）；逻辑代码不在内，落点里唯一的入口是入口脚本
# （见 `specs/general/script.adoc`「跨平台脚本」）。
# `pathconfig.py` 也在名单里：执行侧（以及被分发出去的判据侧）要先 import 它才能读本文件，
# 只取执行脚本+壳时落点里没有读取层，`fetch-specs.py` 一启动就 `ModuleNotFoundError`。
all = ["script/fetch-specs.py", "script/fetch-specs.sh", "script/fetch-specs.bat",
       "script/pathconfig.py"]
entry = ["script/fetch-specs.sh", "script/fetch-specs.bat"]
# 本文件的仓库内路径（**由本文件自己声明**：读取层据此认出"配置是哪一份"，
# 判据侧据此核对"文档引的那一句指向的还是它"）。
config = "script/specs-config.toml"

[network]
# 单次请求超时（秒）与并发请求数（并发数取小值，不把对端打满）
timeout_seconds = 30
workers = 4

[source-management]
# 本项目取哪一档**源码管理方法**——两档规则本体都在 `specs/general/coding-source.adoc`「源码管理方法」：
#   `"conventional"`：常规档（默认档）。单线顺序开发、或由单一执行者按序改动即可照用——
#                    落点按职责与体量排布，不按份铺开；冲突现场逐处解；派生件允许人工维护
#                    （但须有可核对的判据）；不要求 `merge=union`、不要求生成器。
#   `"concurrent"`：并发档。多个未完工分支并存、都要合入同一目标分支时取用——落点按份切、
#                    逐行登记面只留身份、派生件由生成器产出、只增不改的落点声明合并策略、
#                    短命文件先声明再落地。执行细则见同文件「文件的角色」一节。
#
# **取值只有这一处**：这两档是**并列的两套完整规则集**（别处引它们时按档取，不复述条文），
# 一个项目只取一档、整档生效，**不得跨档拼装**（两档的差别不在严与松，而在对同一个失效给
# 的是两个不同的解；混用等于两个解各用一半、两个失效面都还在）。
#
# **本仓库取 `concurrent`**：本仓库并发任务多、合入频繁，常规档下每一轮都在同一片区域插行。
# 换成 `conventional` 只需把下面那一行改成 `"conventional"`，其余一个字节都不用动——
# 两档的规则本体都留在规范里，谁想照哪一档做都有完整的规则可读（规则可以不用，取值不能不存在）。
#
# 判据：`script/check_specs.py` 的 `source_management_mode()` 是唯一判别式——
# `concurrent` 时按 `script/specs-rules/collab-hotspot.toml` 的锚点逐项核并**要求**本仓库
# 真的分份／配 `merge=union`／上生成器；`conventional` 时只核"那一档的取值还在不在"
# （判据本体不许连取值一起删）。开关本身**须有判据**：缺 `[source-management].mode`
# 或取值不是这两档之一即报错、不补默认值（见 `specs/general/coding-runtime.adoc`「取值的唯一来源」）。
mode = "concurrent"

[temporary]
# 临时产物的根目录名（工作目录下）：临时产物一律落这里，不进落点、不进项目其他位置。
# 目录布局与命名判据见 `specs/core/execution.adoc`「临时产物」。
dir = "tmp"
# 更新自身时新版本脚本的文件名后缀（与本轮真身同名不同后缀）与"待换标记"的文件名后缀
self_update_suffix = ".update"
self_handoff_suffix = ".handoff"
