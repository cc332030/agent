        "缺则技术栈层变成第二处真源：判据在两处各自漂移，先报红的那道未必是权威",
    ],
]
[[guards.check_bundle_size_guard]]
file = "specs/stack/web.adoc"
section = "分包与按需加载（载体）"
kind = "section_groups"
groups = [
    [
        "路由层按需加载（载体＝路由定义处）",
