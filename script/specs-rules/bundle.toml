# ④ 加载门：调度器须登记该栈文件与独立识别特征——缺则打包告警时永不触发加载。
[[guards.check_bundle_size_guard]]
file = "AGENTS_COMMON.adoc"
kind = "file_tokens"
tokens = [
    "**Web 前端打包产物**",
    "`specs/stack/web.adoc`",
    "**打包告警**",
]
message = "『分发产物的体积与按需加载』防线被破坏：{file} 缺失要点 {missing}——技术栈层须登记前端打包产物文件与它的独立识别特征（打包告警/构建配置），缺则执行者看到体积告警时永不加载该栈文件，判据存在却走不到"

