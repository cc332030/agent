# 『分发产物的体积与按需加载』防线规则数据。
#
# 判据本体在 `specs/general/coding.adoc`——**公共内容**（对任何做过分发产物的项目成立）。
# 前端载体在 `specs/stack/web.adoc`（技术栈层），它**只给载体、不另立判据**。
#
# 本条防的失效：构建工具报「某产物超过体积上限」时，**把上限调高**（或关掉告警）就收工——
# 产物一个字节没少、首屏加载量照旧，而日志从此"干净"；下一次再超了再调一次。
# 用户口径：**去根治，不要掩耳盗铃，有必要可扩到所有语言**。

# ① 跨语言那一条（体积上限只是「质量哨兵」的一种）：落在通用层「警告与弃用」这一节的
# 那一条 bullet 里。**不按条目核、按整节核**：该 bullet 的正文里另嵌了两段（去路/边界），
# 而引擎的 `bullet` 取法只认单行 `* **` 条目；措辞被抽走时按整节核同样报红（本组的锚点
# 全是该条独有的长句，相邻条目的字样兜不住——见 `specs-project-maintainer/guards.adoc`
# 「锚点一律取只出现一次的措辞」）。
[[guards.check_bundle_size_guard]]
file = "specs/general/coding.adoc"
section = "警告与弃用"
kind = "section_groups"
token_list = "BUNDLE_SIZE_ANCHORS"
message = "『分发产物的体积与按需加载』防线被破坏：{file}「警告与弃用」缺失要点 {missing}——{desc}；该条对应用户点名要求（打包告警须去根治、不得调高上限掩耳盗铃），不得删除、不得降级"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错（"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_bundle_size_guard]]
file = "specs/general/coding.adoc"
section = "警告与弃用"
kind = "anchor_count"
token_list = "BUNDLE_SIZE_ANCHORS"
min = 7

# ② 判据本体：通用层「分发产物的体积与按需加载」整节（含前端载体小节与依据行）。
[[guards.check_bundle_size_guard]]
file = "specs/general/coding.adoc"
section = "分发产物的体积与按需加载"
kind = "section_groups"
token_list = "BUNDLE_SECTION_ANCHORS"
message = "『分发产物的体积与按需加载』防线被破坏：{file}「分发产物的体积与按需加载」缺失要点 {missing}——{desc}；该条对应用户点名要求（打包告警须去根治、不得调高上限掩耳盗铃），不得删除、不得降级"

# 与上面那步成对：核该清单自己的条数（删锚点须与调 `min` 一并发生）。
[[guards.check_bundle_size_guard]]
file = "specs/general/coding.adoc"
section = "分发产物的体积与按需加载"
kind = "anchor_count"
token_list = "BUNDLE_SECTION_ANCHORS"
min = 28

# 同一条 bullet 按**条目级**再核一遍：「警告与弃用」整节的密钥锚点里有「质量哨兵」「取值定错」
# 一类同节多条共用的措辞，别的条目能兜住本条被抽走的部分；本条只取这一条 bullet 内**只出现
# 一次**的措辞，另含整节清单兜不住的那句「不得**整类关闭**」——它是本条的防反用面。
[[guards.check_bundle_size_guard]]
file = "specs/general/coding.adoc"
section = "警告与弃用"
kind = "bullet_tokens"
bullet = "不得调高阈值或关掉规则来消灭告警（L1，任何语言）"
anchor = "**去路（L1）**"
min = 6
tokens = [
    "**只有一种情形可以调**",
    "取值定错",
    "改取值须有可核对的依据",
    "**判据是\"成因变没变\"**",
    "**边界（防反用）**",
    "**不得**整类关闭",
]
message = "『分发产物的体积与按需加载』防线被破坏：{file} 的那条 bullet 缺失要点 {missing}——去路（唯一可调的情形＝取值定错，且须给出可核对的依据）与边界（不得整类关闭规则）是该条的出口与防反用面，抽掉后它会被读成「要么永远不调、要么整类关掉」"

# ③ 前端载体：技术栈层只给载体、不另立判据（第二真源由本组反向钉住）。
