# 『压缩前须先并入目标分支的最新改动（基线同步防线）』规则数据。
#
# 本条防的失效（用户提出，Issue #198，P0 最高优先级）：
#   分支**停在旧基点上、从未同步过目标分支**时，相对目标分支的差异里**混着"目标分支后来
#   新加的东西"**——压缩一次即把它们删一次（PR `cc332030/ctool4j#101` 实证：一个"只加一个
#   注解"的 PR 压缩后带走了目标分支上刚合入的两批改动，22 文件、+615/−1447）。
#
# **为什么既有判据全绿**：分支没同步过目标分支时，两个提交的**共同祖先恰好就是目标分支本身**
#   （即"分叉点落在目标分支自己身上"）——于是"目标分支是本分支的祖先"**为真**，
#   `check_base_ancestor_guard` 与「压缩后的合并关系核对」都判不出问题。
#   既有条文的前提写的是"**若本分支此前已并过目标分支（或本就基于目标分支的最新提交）**"，
#   把这一形态**恰好排除在外**——"没同步过"被读成了"无需同步"。
#
# 判据本体落在通用层（工具无关：用户口称"版本管理"、未点名 git/CNB），
# git 侧只给取值形态、平台层只补「本平台能观测到的后果」，三处互不替代。
#
# **核的是判据本体（条目正文），不是"这一节在不在"**——见
# `specs-project-maintainer/guards.adoc`「机械防线的核对对象是判据本体，不是轴名」。
# 同一道防线的多处落点写成 `[[guards.check_baseline_sync_guard]]` 追加表。

[[guards.check_baseline_sync_guard]]
kind = "exists"
files = [
    "specs/general/version-control.adoc",
    "specs/general/git.adoc",
    "specs/platform/cnb.adoc",
]
message = "缺少文件 {file}——『压缩前先并入目标分支』的规则本体/取值形态/平台侧后果无处承载"

