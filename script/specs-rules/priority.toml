[[guards.check_criteria_not_axis_guard]]
file = "specs-project-maintainer/priority.adoc"
groups = [
    [
        "机械防线须钉**判据本体**",
        [
            "机械防线须钉**判据本体**",
            "判定标准里能拿去核对的那句话",
        ],
        "须写明核对对象是判据本体（判定标准里能拿去核对的那句话），不是轴名",
    ],
    [
        "轴名/条目标题",
        [
            "轴名/条目标题",
            "防线空转",
        ],
        "须点名『只核轴名/条目标题＝防线空转』这一失效形态（否则读者会把『轴名齐』当成『判据在』）",
    ],
    [
        "判定标准（逐条可核对，任一命中即未做到）",
        [
            "判定标准（逐条可核对，任一命中即未做到）",
            "③",
        ],
        "须给逐条可核对的判定标准（只写一句原则、无判定标准则本条自身也是口号）",
    ],
    [
        "轴名齐全",
        [
            "轴名齐全",
            "判据被抽走",
            "必须报红",
        ],
        "须写明必配反例用例：『轴名齐全、判据被抽走』的改造下防线必须报红（没有这条反例，防线的实际效力无从证明）",
    ],
    [
        "机械核对边界",
        [
            "机械核对边界",
            "运行时事实",
            "语义判断",
        ],
        "须写明**机械核对覆盖不到的两类**（运行时事实 / 语义判断）——即『机械只核文本与文件形态，越出这两类的结论不得由机械判定』这一条边界声明。缺它则每道防线只能各写一句『某次是否真的……交人复核』：同一句话重复 90 遍，边界随各条措辞漂移，且防线作者无从知道『哪些不该由机械判』（本轮实测：该句式在 check_specs.py 出现 91 处、在台账中出现 114 处）",
    ],
]
kind = "regex_section"
label = "机械防线的核对对象是"
message = "『判据本体而非轴名』防线被破坏：{file} 的「{CRITERIA_NOT_AXIS_SECTION}」缺失 {missing}——{desc}（本轮实测教训：轴名齐全、判据被抽走时防线全绿；该通则不得被删、不得降级、不得只留在脚本注释里）"
pattern = "^=== 机械防线的核对对象是.*?(?=\\n=== |\\n== |\\Z)"

[[guards.check_priority_guard]]
file = "specs-project-maintainer/priority.adoc"
groups = [
    [
        "不得点名外部 Agent",
        [
            "不得点名外部 Agent",
            "同 Agent 身份",
            "降级",
        ],
        "P6 须与公共侧同口径写『强制同 Agent、不得点名外部 NPC、不可用时降级为本人串行或如实标悬置而不换外部来源』",
    ],
    [
        "要求（L1，最高",
        [
            "要求（L1，最高",
            "依据",
        ],
        "P6 的级别与依据行仍须保留（级别不得被静默改动、依据不得整段删除）",
    ],
]
kind = "regex_section"
label = "P6."
message = "规范优先级防线被破坏：{file} 的 P6（协作执行者选择）缺失 {missing}——{desc}"
pattern = "^===\\s*P6\\..*?(?=\\n=== |\\Z)"
