# 失效形态：部分 agent 预设了"按步骤提示"，执行者在步骤中途收尾、把"要不要继续"交回用户，
# 而任务本身既没被阻塞、也没做完——这与「用户要求是第一优先级」不是同一条（那条管
# "做不到就问"，本条管"做得到却没做完"），故须单列一道防线。
#   * `kind = "section_groups"` 是**表级**字段（表内第一步用）——两步同表、只声明一次；
#     两条 `kind` 各在表内的**第一个** `[[guards.…]]` 里给出（上一步给 `section_groups`、本步给 `split_block`）。

