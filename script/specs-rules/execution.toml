# 提示词公共片段侧（会被复制到未知项目执行）：`baseline-and-compat` 片段须带同口径一条——
# 片段里只写"规划落盘"时，"落在哪个目录、怎么排布"在复制出去的那份里落不到任何一条。
# 判据本体给的是"怎么分"，目录形态给不出时执行者仍要每轮现编一个目录名（编一次漂一次），
# 故这一段一并核**目录树形态**。`kind` 用 `file_tokens`（不切块）：
# 任何切分串都会把这段判据自己写进被切掉的那一侧（本仓库实证：锚点自身的字样在正文里命中、
# 切出来的段从下一处起，判据当场空转）。
#   * 形态块以 `----` 定界写；`PLAN.md` / `progress.md` 是最简两件套（规划与进度分家）；
#   * **副本与产出的两级目录名拆成两枚锚点**：整串当锚点时，锚点自身也会在这段注释里命中，
#     核对面形同自证（本仓库实证过的假绿形态）。
[[guards.check_tmp_layout_guard]]
file = "prompts/_common.txt"
kind = "file_tokens"
tokens = [
    "规划与进度落在 `tmp/`、按用途排布（L1）",
    "一级按用途分",
    "规划文档与进度记录分开放",
    "新发现的待办即时补进规划",
    "源码副本与我们的分析产出分开放",
    "specs/core/execution.adoc",
    "PLAN.md",
    "progress.md",
    "vendor/",
    "analysis/",
]
message = "提示词公共片段缺失 `tmp/` 布局那一条或其目录形态 {missing}——片段会被未知项目复制执行，漏了这层则复制出去的那份只在判据本体里有、执行者读不到；形态块缺项则目录名每轮现编、编一次漂一次"

# 『完成＝按任务要求走到最后一步、并逐条核对每一步』（用户点名：不得做一部分就再问用户
