# 『每一步执行都有可判定的时限』——**任务频繁中断**里最常见、也最可修的一种是"某一步永远
# 不返回"：没有进度输出、工具层也不给失败信号，于是整轮停在那里直到人工介入。本条用户提出，
# 判据本体落在 `specs/general/collab.adoc`「操作超时与超时后的处置」与
# `specs/general/ci-cd.adoc`「超时与资源」，抓手是随规范分发的 `script/guard/`。
# 核的是**取值状态**：两处条文是否仍在、抓手是否真随规范分发且被本仓库 CI 实跑
# （"声明了抓手却没接进任何地方跑"正是本条要防的失效形态）；"某次操作实际有没有设时限、
# 超时后有没有真去排查"属运行时行为，交人/子 agent 复核。
[[guards.check_operation_timeout_guard]]
file = "specs/general/collab.adoc"
