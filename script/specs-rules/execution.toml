# 实时更新、新任务即时补进去；**tmp/ 下的文件也要走规划、避免乱丢乱放**；单次小任务/新项目/
# 大规模重构流程不同，问"怎么兼容"；要下载其他多个项目源码、分析其他项目时，源码与分析产出
# 又放哪、参照业界规范。
# 落点选在 `specs/core/execution.adoc`「临时产物」的**子节**里（新增一份文件会给常驻层再加一份
# 无条件成本，而这件事本就是那一条的取值细化）；分档**不自立第二套**——档位与各档取值回指
