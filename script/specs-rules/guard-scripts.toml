# 判据写在脚本里的那些防线的**哨兵**——只为让"一道防线一份行正文"对两种形态都成立。
#
# 一份防线的判据若写在规则数据里，它自己就是一份 `<防线名>.toml`；而本仓库多数防线的判据
# 就是 `script/check_specs.py` 里的函数（`run_rule_guard` 只是接线），它们没有规则文件。
# 于是它们的行正文搁在这里、与这份清单同层：`<防线名>.adoc` 就在本文件旁边——**同层 +
# 同名**这条约定让"这道防线有没有一份行正文"不必登记（目录里看得见），也让它跟着防线走
# （删防线时一并删掉，留下就是"不对应任何防线"的尸块，当场报红）。
#
# 值一律是空数组：本文件**不承载判据**，只回答"行正文挨着谁"。新增一道脚本侧防线时，在
# 这里加一个名字（与写自己那一份 `.adoc` 是同一个动作的两半）。

