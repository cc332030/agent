# 『防线清单与删除记账』（`check_guard_manifest`）的规则数据：只收**覆盖面清单**这一类。
#
# 本条防的失效（本仓库实证过多次）：**清单有两个载体**——`check_specs.py` 里一份常量、
# 规则数据里一份 `files`。新增一个 `.adoc` 时只进得去其中一处，另一处**静默漏扫**：
# 「回指不复述取值」「同一段不得两处各写一份」两道检查对新文件整段空转，而脚本照样报绿、
# 读者以为已覆盖。修法不是"记得两处都改"——那正是失效的来源（靠人记得，就一定会漏）；
# 而是**清单只留一个载体**、由规则核这件事本身。
#
# 判据是两步、缺一不可：① **清单与实际收集结果逐项相等**（多一项＝列了不存在的文件，
# 少一项＝新文件永远不被扫）；② **别处不得再列一份**——某份规则数据仍在 `files` 里就地
# 列着同名清单时，清单就有了第二个载体，两份必然各自漂移，那正是本条要治的形态。
#
# 清单内容与收集规则**都不在本文件**：清单在 `script/check_specs.py` 的
# `GUARD_MANIFEST_FILES`（唯一一处），收集规则是 `collect_adoc_files`（唯一实现）——
# 规则数据里再列一遍就是第二个来源。

# ① 清单与实际收集结果**逐项相等**（多一项＝列了不存在的文件，少一项＝新文件永远不被扫）。
[[guards.check_guard_manifest]]
kind = "corpus_ownership"
corpus = "adoc"
# 历史留痕按定义不参与覆盖面核对（它的职责就是逐字保留历史产物，见
# `specs/general/changelog.adoc`）。
# 本表须与 `script/specs-rules/_tokens.toml` 的 `HISTORICAL_FILES` 逐项相等：
# 清单取值端（`_pointer_scan_files`）把 `HISTORICAL_FILES` 整体剔除，故这里的 exclude
# 少一项或多一项都会被本防线自己报红——两处各司其职，漂移由核对兜住。
exclude = [
    "CHANGELOG.adoc",
    "specs-project-maintainer/ledger/rounds-before-sharding.adoc",
    "specs-project-maintainer/ledger/sharding-rolled-back.adoc",
    "specs-project-maintainer/ledger/concurrent-hotspots-2026-11.adoc",
    "specs-project-maintainer/ledger/conflict-by-shape.adoc",
    "specs-project-maintainer/ledger/guard-test-floor-sharding.adoc",
    "specs-project-maintainer/ledger/powershell-cross-version.adoc",
    "specs-project-maintainer/ledger/review-compact-form-sizing.adoc",
]
# 清单名 → [脚本侧取值函数, 登记该清单的那一行]，第二段只作报错时的落点提示——它指的是
# “哪些文件算维护范围”这件事在哪里被写进防线清单，不是清单内容的另一份落点。
[guards.check_guard_manifest.manifest]
POINTER_SCAN_FILES = ["_pointer_scan_files",
                       "script/specs-rules/guards.toml"]
message = "覆盖面清单 `{name}`（声明于 {where}）与实际收集结果不一致：多出 {stale}、缺少 {missing}——清单少一项即那份文件永远不被扫（防线静默少扫一层、读者以为已覆盖），多一项即指向不存在的文件；清单只允许一处（`script/check_specs.py` 的 `GUARD_MANIFEST_FILES`），收集规则用 `collect_adoc_files`，新增文件应当自动进清单"

# ② 同一份清单**不得在别处再列一遍**（`kind="exists"` 一类步骤自列 `files` 的形态）：
# 两处各维护一份时，新增文件只进得去一处、另一处静默漏扫，且两份清单必然漂移。
[[guards.check_guard_manifest]]
kind = "manifest_single_owner"
guards_files = [
    "script/specs-rules/duplicate/guards/check_pointer_no_verbatim_guard.toml",
]
message = "清单 `{name}` 在 {where} 被再列了一遍：覆盖面清单只允许一处（`script/check_specs.py` 的 `GUARD_MANIFEST_FILES`），这里只该按名引用——两处各列一份时，新增文件只进得去一处、另一处静默漏扫"

# ③ 覆盖面清单的**写法口径**：本条要治的形态是"清单有两个载体"，故解法是**清单只有一个载体 +
# 单靠现算就够**，而不是留一句"两个载体都得改"的提醒——后者把解法写成了动作清单，下一轮照样只改
# 一处，等于把失效来源原样留着（`specs/general/coding-runtime.adoc`「取值的唯一来源」的判定标准②：
# 同一份清单形成两个载体即违规）。
#
# 这两组同时管两件事：**应然**（清单只允许一处、取值由收集规则现算）与**不得**（不许把解法
# 写回"提醒人两处都改"、也不许把清单说成"登记在规则数据里"）。后者此前确有其事：清单声明表
# 把第二段当成"登记该清单的规则数据"，读者照它去规则数据里找清单——而规则数据早已不列清单。
# 核的就是**这一份**（本文件即 `check_guard_manifest` 那一份行正文的落点：口径句与判据同在
# 一处，读者按防线名翻到这里，读到的就是这道防线在核什么）。
[[guards.check_guard_manifest]]
kind = "file_groups"
file = "script/specs-rules/guards.toml"
message = "防线清单缺「覆盖面清单只有一个载体」的写法口径：{missing}——缺则读者会以为清单仍有两处要维护，下一轮照样只改一处，而那正是本条要治的失效形态"
groups = [
    ["清单只允许一处", [
        "覆盖面清单只允许一处",
        "`GUARD_MANIFEST_FILES`",
        "取值由收集规则现算",
    ], "缺则「清单只有一个载体」这一层没有落点，读者默认它仍是一串手写字面量"],
    ["不得写成提醒", [
        "清单有两个载体",
        "单靠现算就够",
    ], "缺则解法被写成一句提醒——靠人记得改另一处，正是失效的来源"],
]

[[guards.check_guard_manifest]]
kind = "file_forbidden"
# 核的是**口径句与判据所在的那一份落点**（本文件）：解法只有一处、也只有一个陈述处——
# 把禁令词列在这里会把它们自己变成命中项，故禁令按语义在评审面核（`GUARD_CHECK_LIMITS`），
# 此处只留一条能被机械判定的形态：解法那句必须与它上一段同时成立（"只允许一处" + "现算"）。
file = "script/specs-rules/guards.toml"
# 禁令**不写汉字字面**：把禁令原句列在这里，它自己就成了命中项（本仓库刚踩过两次：
# 三个字面禁令写在文件里，判据先把定义它们的这一行报了）。禁令的形态用它的**结构**认——
# 分工式提醒必然是"某个动作 + 指代另一处的词序"，这里按 `cjk` 序列走 Unicode 转义，
# 文件里不出现那串字，判据读到的仍是那串字。
forbidden = [
    "\u4e00\u4fa7\u6539\u4e86\u53e6\u4e00\u8fb9",
    "\u6539\u5b8c\u4e00\u4fa7",
    "\u4e24\u8fb9\u5404\u6539",
]
message = "防线清单把覆盖面清单的解法写回了「{hit}」式的提醒：那正是本条要治的失效来源——靠人不漏改另一处是不成立的，解法须写成「清单只有一个载体 + 单靠现算就够」"

# ③ 防线清单表的**登记面**：哪些防线在表里占一行，以及这一行的正文落在哪。
#
# 为什么需要这一步：这张表是 `CHECKS` 序列的投影，而它的行原先由人手工维护——序号人工写
# （插一道防线，其后每行的数字与位置一起变），行正文挤在同一段。两者都是并行热点。改成
# 「一行一份」之后，行数多到碎片化（那也不成立，见上一轮的回滚记账）。**第三条路是生成**：
# 行正文按防线名分份（文件名即防线名，正文只有一格「用途」），序号与「谁在用」由判据现算。
# 于是新增一道防线时改动方只写自己那一份——不碰任何别人的行、不碰任何数字。
#
# 这里的 `registry_owner` 是**声明**：登记面在哪、行正文跟着谁走。表头不在这里写——它是
# 判据拼给人看的那一行，不是取值（`script/check_specs.py` 的 `MANIFEST_TABLE_HEAD`）。
[[guards.check_guard_manifest]]
kind = "registry_owner"
registry_owner = true
# 行正文那一格**跟着规则数据走**：`<防线名>.adoc` 与 `<防线名>.toml` 放在同一层目录
# （`script/specs-rules/<主题>/guards/`）。于是"一道防线的全部内容"在一处：判据在 `.toml`、
# 它钉住什么在旁边的 `.adoc`——两边靠**目录即约定**互相看见，谁都不必维护一张对照表。
#
# **`.adoc` 是零字节的标记文件**：正文已经在 `.toml` 的注释里（判据、例外、边界各一段），
# 再抄进 `.adoc` 就是同一段话的第二处写法。这个文件的存在只回答一个问题——**这道防线
# 有没有一份行正文**（删防线时它一并消失，留着就是"不对应任何防线"的尸块，当场报红）。
body_sibling = true
message = "防线清单表那一行的正文跟着规则数据走：`<防线名>.adoc` 与 `<防线名>.toml` 同层（`script/specs-rules/<主题>/guards/`）——一份只装一道防线的「钉住什么」；次序由它在表里的位置表达（不写号），话在 `.toml` 的注释里、不抄第二份"
