# ③ 测试规范：界面是否要性能测试是**按特征判**（不默认加、也不默认不加）。
[[guards.check_ui_performance_guard]]
file = "specs/general/testing.adoc"
section = "性能测试"
kind = "line_tokens"
anchor = ["何时需要（L1）"]
message = "『界面的性能』防线被破坏：「性能测试」的「何时需要」一行缺 {missing}——界面那一档从触发特征里消失时，界面性能要么一律加（噪声用例）、要么永远不加（数据长起来才发现卡）"
tokens = [
    "界面的首屏与常用交互",
    "界面不默认加、也不默认不加",
    "现在数据没那么多",
    "连续交互（拖动、缩放、滚动、输入）的帧内耗时",
]

# ④ 加载门两处：调度器「任何代码活动」与前端栈条——缺则执行者写界面时永不加载该节。
[[guards.check_ui_performance_guard]]
file = "AGENTS_COMMON.adoc"
section = "通用层（涉及对应活动时加载）"
kind = "line_tokens"
anchor = ["任何代码活动"]
message = "『界面的性能』防线被破坏：调度器「任何代码活动」条目缺 {missing}——缺该识别特征时，写界面的人不会加载该节，判据存在而走不到它"
tokens = [
    "会随数据长起来的界面",
    "渲染循环里各取一次",
    "首屏外的重区块",
    "切走后仍在轮询或监听",
    "跟着操作连续变化的交互",
    "自己会动的东西",
]

[[guards.check_ui_performance_guard]]
file = "AGENTS_COMMON.adoc"
section = "技术栈层（检测到即加载，不得遗漏）"
kind = "line_tokens"
anchor = ["Web 前端打包产物"]
message = "『界面的性能』防线被破坏：调度器前端栈条目缺 {missing}——改表格与列表取数的人不知道该读哪一节"
tokens = [
    "界面的性能",
    "全量类操作",
    "界面在数据多时会不会卡",
]

# ⑤ README 目录说明同步（公共内容的目录说明是读者的入口清单，缺则「这一节存在」没人知道）。
[[guards.check_ui_performance_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "界面的性能（任何语言、任何端",
    "判据取形态不取当前数据量与当前机器",
]
message = "『界面的性能』防线被破坏：{file} 的目录说明缺 {missing}——README 是读者找这一节的入口清单，不同步等于「这一节加了也没人知道」"
