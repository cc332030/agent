# 『界面的性能』防线规则数据。
#
# 判据本体在 `specs/general/coding.adoc`「界面的性能」——**公共内容**（对任何产出界面的
# 项目成立，不限语言与端）。前端载体在 `specs/stack/web.adoc`（技术栈层），它**只给载体、
# 判据本体的措辞不复述、也不另立一套**。
#
# 本条防的失效：界面"能用"与"好用"是两件事，而开发期看不出来——刚开始数据不多时界面并不卡，
# 与后端接口一样，**只有数据量大了才知道哪一处卡**。用户口径（原话要点）：『能用和好用是
# 不一样的，界面设计的时候要考虑性能，前端页面是否要默认加性能测试？还是根据实际情况、
# 场景加？包括但不限于 web 端、java、python 等端画的界面』——故判据取**形态**、**不取当前
# 数据量与当前机器**；「要不要做性能结论」交回测试规范的触发特征判（界面不默认加、也不默认不加）。
#
# **第二轮（同一条，不新开防线）**：用户拿「一万行的表格拖动调整大小」当**举例**问「界面的
# 性能有没有规范」，而本条当时只覆盖**规模**一档——他真正要的是**面**（界面的性能），并追问
# 一个方法论：怎么避免"只看举例、抓不住重点"。故本节扩成**六档维度**（规模／交互与绘制／
# 常驻成本／起步／时效／降级），新增形态五至十；方法论落 `specs/general/planning.adoc`
# 「举例不是面」，本防线一并钉住它（面被抽走后，下一处同类形态又只能等用户再提一遍）。

# ① 判据本体：通用层整节（四处形态 + 判定标准 + 存量边界 + 依据行）。每组按序核锚点，
# 最后一项是最短的那个、失去它即该组不再成立。
[[guards.check_ui_performance_guard]]
file = "specs/general/coding.adoc"
kind = "subsection_groups"
subsection = "界面的性能"
token_list = "UI_PERFORMANCE_ANCHORS"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错。删清单须与调 `min` 一并发生。
[[guards.check_ui_performance_guard]]
file = "specs/general/coding.adoc"
subsection = "界面的性能"
kind = "anchor_count"
token_list = "UI_PERFORMANCE_ANCHORS"
min = 42

