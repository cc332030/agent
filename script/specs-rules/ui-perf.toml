# 『界面的规模与性能』防线规则数据。
#
# 判据本体在 `specs/general/coding.adoc`「界面的规模与性能」——**公共内容**（对任何产出界面的
# 项目成立，不限语言与端）。前端载体在 `specs/stack/web.adoc`（技术栈层），它**只给载体、
# 判据本体的措辞不复述、也不另立一套**。
#
# 本条防的失效：界面"能用"与"好用"是两件事，而开发期看不出来——刚开始数据不多时界面并不卡，
# 与后端接口一样，**只有数据量大了才知道哪一处卡**。用户口径（原话要点）：『能用和好用是
# 不一样的，界面设计的时候要考虑性能，前端页面是否要默认加性能测试？还是根据实际情况、
# 场景加？包括但不限于 web 端、java、python 等端画的界面』——故判据取**形态**（取数边界、
# 同一次展示不逐项各取一次、重区块按需加载），**不取当前数据量**；「要不要做性能结论」
# 交回测试规范的触发特征判（界面不默认加、也不默认不加）。

# ① 判据本体：通用层整节（四处形态 + 判定标准 + 存量边界 + 依据行）。每组按序核锚点，
# 最后一项是最短的那个、失去它即该组不再成立。
[[guards.check_ui_performance_guard]]
file = "specs/general/coding.adoc"
kind = "subsection_groups"
subsection = "界面的规模与性能"
token_list = "UI_PERFORMANCE_ANCHORS"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错。删清单须与调 `min` 一并发生。
[[guards.check_ui_performance_guard]]
file = "specs/general/coding.adoc"
subsection = "界面的规模与性能"
kind = "anchor_count"
token_list = "UI_PERFORMANCE_ANCHORS"
min = 21

# ② 前端载体：技术栈层只给载体、判据本体的措辞不复述、也不另立一套（第二真源由本组反向钉住）。
[[guards.check_ui_performance_guard]]
file = "specs/stack/web.adoc"
section = "界面的规模与性能（载体）"
kind = "section_groups"
groups = [
    [
        "判据本体回指通用层（判据措辞不复述、也不另立一套）",
        [
            "`specs/general/coding.adoc`「界面的规模与性能」",
            "也不另立一套",
        ],
        "载体节不回指唯一真源时，栈层就成了第二处真源",
    ],
    [
        "列表与表格的取数边界载体",
        [
            "虚拟滚动或分页",
            "既无虚拟滚动也无分页即违规",
        ],
        "取数边界在栈层没有落地位置时，判据只剩一句原则",
    ],
    [
        "同一次展示一次取回的载体",
        [
            "渲染循环里出现取数调用",
            "一次批量取",
        ],
        "关联数据一次取回在栈层没有载体，N+1 取数无处可判",
    ],
    [
        "重区块与性能结论的载体",
        [
            "重区块的按需加载",
            "性能结论的载体",
        ],
        "重区块引入点与前端计时口径没有落点时，两处都只能靠自由发挥",
    ],
    [
        "全量类操作的生效范围载体",
        [
            "全量类操作的生效范围",
            "前端逐页拉取凑全量",
            "界面声称已全选即违规",
        ],
        "全量类操作在栈层没有载体时，虚拟列表一上就没有地方落地：只能前端扫全表，或悄悄只对已加载范围生效",
    ],
]

# ③ 测试规范：界面是否要性能测试是**按特征判**（不默认加、也不默认不加）。
[[guards.check_ui_performance_guard]]
file = "specs/general/testing.adoc"
section = "性能测试"
kind = "line_tokens"
anchor = ["何时需要（L1）"]
message = "『界面的规模与性能』防线被破坏：「性能测试」的「何时需要」一行缺 {missing}——界面那一档从触发特征里消失时，界面性能要么一律加（噪声用例）、要么永远不加（数据长起来才发现卡）"
tokens = [
    "界面的首屏与常用交互",
    "界面不默认加、也不默认不加",
    "现在数据没那么多",

]

# ④ 加载门两处：调度器「任何代码活动」与前端栈条——缺则执行者写界面时永不加载该节。
[[guards.check_ui_performance_guard]]
file = "AGENTS_COMMON.adoc"
section = "通用层（涉及对应活动时加载）"
kind = "line_tokens"
anchor = ["任何代码活动"]
message = "『界面的规模与性能』防线被破坏：调度器「任何代码活动」条目缺 {missing}——缺该识别特征时，写界面的人不会加载该节，判据存在而走不到它"
tokens = [
    "会随数据长起来的界面",
    "现在数据不多所以看不出卡",

]

[[guards.check_ui_performance_guard]]
file = "AGENTS_COMMON.adoc"
section = "技术栈层（检测到即加载，不得遗漏）"
kind = "line_tokens"
anchor = ["Web 前端打包产物"]
message = "『界面的规模与性能』防线被破坏：调度器前端栈条目缺 {missing}——改表格与列表取数的人不知道该读哪一节"
tokens = [
    "界面的规模",
    "全量类操作",
    "界面在数据多时会不会卡",
]

# ⑤ README 目录说明同步（公共内容的目录说明是读者的入口清单，缺则「这一节存在」没人知道）。
[[guards.check_ui_performance_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "界面的规模与性能（任何语言、任何端",
    "判据取形态不取当前数据量",
]
message = "『界面的规模与性能』防线被破坏：{file} 的目录说明缺 {missing}——README 是读者找这一节的入口清单，不同步等于「这一节加了也没人知道」"
