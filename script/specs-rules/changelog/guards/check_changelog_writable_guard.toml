[[guards.check_changelog_writable_guard]]
file = "specs/general/changelog.adoc"
groups = [
    [
        "日志只被",
        [
            "日志只被「人改」，不被「追加」",
            "重写型文件",
        ],
        "须写明变更日志是**重写型文件**（读入整份、就地增删改、写回），不得以**追加**方式落盘（`>>`、`tee -a`、`os.O_APPEND`、`append` 模式）——缺则日志回到「谁都能往里塞一行」的追加区，同一版本被记成多条、越堆越多（用户口径：解决 changelog 频繁被加内容的问题）",
    ],
    [
        "就地并入",
        [
            "就地并入",
        ],
        "须给出可判定的并入规则：**同一版、同一变更点**时**就地并入**、不另起一条——否则每条新观察都要新开一行，追加仍不可免",
    ],
    [
        "脚本与流水线同样受此约束",
        [
            "脚本与流水线同样受此约束",
        ],
        "须把约束扩到**脚本与流水线**（除人主动声明、当次手写外，任何自动化步骤不得写 `CHANGELOG.*`）——否则自动追加换个执行者照样发生",
    ],
]
kind = "file_groups"
message = "变更日志写入形态防线被破坏：specs/general/changelog.adoc 缺失要点 {missing}——{desc}"
[[guards.check_changelog_writable_guard]]
