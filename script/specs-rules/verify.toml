[[guards.check_checklist_guard]]
file = "specs-project-maintainer/verify.adoc"
groups = [
    [
        "三态台账",
        [
            "三态台账",
            "悬置",
            "未发现问题",
            "不得合并",
        ],
        "留证须按三态台账（通过/未发现问题/悬置）分列、不得合并",
    ],
    [
        "**通过**",
        [
            "**通过**",
            "**悬置**",
            # 维护方侧**不重列**逐态取值（判据本体在通用层，抄回来即第二真源）——
            # 故本组放宽为"态名 + 指向通用层判据本体"的落点说明：留证退化成散文结论
            # （"查不出"与"没做"无法分辨）仍被拦住，而"把通用层的条文抄进维护方文件"
            # 不再被当成正确写法（本 PR 立项理由）。
            "specs/general/verify.adoc",
        ],
        "维护方侧须点出三态并指向通用层的判据本体（逐态取值不在本文件重列）",
    ],
]
kind = "file_groups"
message = "{file} 缺失三态台账要素 {missing}——{desc}，留证会退化成散文结论（\"查不出\"与\"没做\"无法分辨）"

[[guards.check_checklist_guard]]
file = "specs/general/collab.adoc"
