# 执行类操作口径属「操作超时与超时后的处置」。按整份文件核（`file_groups`）挡不住
# "条目被挪出本节/标题被改写"——实测那两种形态下全文锚点仍全绿。
section = "资源限制与感知"
kind = "section_groups"
groups = [
    [
        "硬超时",
        [
            "硬超时",
            "到点即视为失联",
            "不得无限等待",
        ],
        "派发子 agent 须自带可判定的时限，到点视为失联（防任务永久挂起）",
    ],
    [
        "超时的处置",
        [
            "超时的处置",
            "放弃该子 agent",
            "如实",
        ],
        "超时后须放弃 + 如实标悬置，不得无限等待、不得写成已通过",
    ],
    [
        "时限取值须有判据",
        [
            "时限取值须有判据",
            "一次性、边界明确、可超时",
        ],
        "时限取值须有判据、优先选可超时的一次性派发形式",
    ],
]
message = "{file} 在「资源限制与感知」节缺失要素 {missing}——{desc}；语义复核会再次卡死且无人负责"

[[guards.check_checklist_guard]]
file = "specs/general/collab.adoc"
section = "操作超时与超时后的处置"
kind = "section_groups"
groups = [
