        "顺序与交付形态：须写明有冲突时先解冲突、再压缩、最终只有一个提交（缺则'还有冲突'或'要压缩'任一都能当另一个的挡箭牌，交付形态少一半）",
    ],
    [
        "拿\"还有冲突\"当不做压缩的理由",
