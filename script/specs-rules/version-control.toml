    ],
    [
        "对冲突只字未提",
        [
            "对冲突只字未提",
            "以\"用户没提解决冲突/没被要求\"为由只压不解决",
            "照抄目标分支的文件内容后另起一个单亲提交",
            "并非本分支的祖先",
        ],
        "判定标准四态：须可逐条核对——①报『已压缩提交』却对冲突只字未提；②以『用户没提/没被要求』为由只压不解决、或把冲突留到压缩之后再议；③用『照抄目标分支内容 + 单亲提交』冒充已解决（工作副本一致但目标分支不是祖先）；④拿『要求里只写了压缩』当挡箭牌——缺则只剩一句口号、无从判定",
    ],
    [
        "解决冲突后须核查是否丢失内容",
        [
            "解决冲突后须核查是否丢失内容",
        ],
        "核查要求：须有『解决冲突后须核查是否丢失内容』这一条 L1",
    ],
    [
        "整体取一侧",
        [
            "整体取一侧",
        ],
        "失效形态：须点名'整体取一侧收尾、不做逐处对照'这一失效（版本管理工具只会报哪里对不上、报不出哪些行再也回不来）",
    ],
    [
        "核查判据",
        [
            "核查判据",
            "改名",
            "逐条核对两侧条目的并集",
        ],
        "核查判据随对象定：须给出文本类（两侧改动逐处对照）、改名/移动/删除与文件数（按版本管理工具对移动的识别口径强制核对）、版本文档类（依赖清单与锁文件逐条核对两侧条目并集）三档判据，否则'核查'退化成'没有冲突标记就算完'",
    ],
]
