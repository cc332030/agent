        ],
        "反向判据：须写明'拿还有冲突当不做压缩的理由'与'拿要压缩当不解冲突的理由'**两句都在**（本项两个关键词按 AND 判，任一缺失即缺要点）——只写正面顺序、或只写其中一句时，执行者仍可二选一交差",
    ],
    [
        "\"只被要求压缩、没被要求解决冲突\"也要先解冲突",
