# 『卡住时先自证』防线（用户点名的失效：缺组件不装、有问题不排、能查到答案却回问人）。
# 缺它时的失效：执行者卡在缺件或一处猜测上，把问题原样交回发起人——而**答案本来就取得到**
# （用户原话：客户反问一句就有方案，说明这一步本该自己做）。
# 判据本体在 `specs/general/planning.adoc`「卡住时先自证」；本文件只给"要点在不在"。
# 按**该节自己的正文**核，不按整份文件核：同文件的「换一条路时的收尾与穷尽」含"换源/换参数"
# 一类同样字样，按整份文件核时把本节抽空也报不出来。
[[guards.check_self_serve_guard]]
file = "specs/general/planning.adoc"
section = "卡住时先自证：缺什么自己找、有问题自己排、有疑问自己查"
kind = "section_groups"
groups = [
    [
        "缺组件先自取",
        ["**缺组件先自取，不在缺件处停下（L1）**", "**第一动作是去把它取到**", "**一次取用动作都没有**"],
        "缺这条时『环境里没有』直接成了收尾理由（本仓库实证：缺 AsciiDoc 处理器即停、不装）",
    ],
    [
        "有问题先自排",
        ["**有问题先自排，把排查做到取到证据（L1）**", "**不得**把第一层猜测当结论交回人"],
        "缺这条时把第一层猜测当结论交回人（用户点名：有问题要自己排查）",
    ],
    [
        "有疑问先自查",
        ["**有疑问先自查，能查清的不问（L1）**", "**查了哪几处、换过哪些手段、为什么它们都定不下来**"],
        "缺这条时把可查证的事实当成『要问人的问题』，交回人时给不出已查范围（用户点名：客户反问一句就有方案即属偷懒）",
    ],
    [
        "与猜到的行为先报的分界",
        ['**可自行消除的不确定性属"做法"，不受「猜到的行为先报」约束（L1，边界）**',
         "**两条的分界是\"取事实\"还是\"做取舍\"**"],
        "缺这条时本节会被读成『可以替用户做决定』，与「猜到的行为先报」正面冲突",
    ],
    [
        "降级式表述同罪（反向形态）",
        ["**降级式表述与本节同罪（L1，反向形态）**",
         '**未取到只能写成"缺什么、试过哪几条、卡在哪"，不得写成交付**',
         "**本可自行取到证据**"],
        "缺这条时『跳过 + 未确证』『环境不支持，已记录』照样能当交付——措辞完整、结论与事实对不上，正是本道要治的失效的另一半",
    ],
    [
        "交回人的唯一形态",
        ["**交回人的唯一形态（L1）**", "**卡在哪、已试过什么、要谁定什么**"],
        "缺这条时交回人的问题不成形：没有『试过什么』，发起人只能替你重做一遍排查",
    ],
    [
        "可以先按推荐做（L1，方向性事项）",
        ["**可以先按推荐做，做完再纠正（L1，方向性事项）**",
         "**只要选哪个都可以**",
         "**按该方向的业界规范/同类产品的通行做法取一个**",
         "**直接做完并在输出里说明取了哪个、依据是什么**",
         "**示例，本条适用于这一类事项的全部形态、不以其为限**",
         "**举反例同样只是示例、不以其为限**"],
        "缺这条时本该自行取一个通行做法的方向性事项（如默认头像的底色与字色）会被当成与「猜到的行为先报」同类的问题而中断去问人——这类选择无论选哪个都不改变任务能否完成，问一次只是把决策成本转嫁给发起人；示例句本身不带『不以此为限』时，执行者会把它读成封闭清单、只在这几件事上不中断",
    ],
    [
        "方向性事项与「要求读不准」的分工",
        ["**方向性事项与「要求读不准」的分工**",
         "**方向性事项：不给选项、按推荐做完**",
         "**要求读不准/做不到：仍然停下问**"],
        "缺这条时本节会被读成『所有问题都可以自行决定』——与「歧义先问、不自行假设」正面冲突（要求本身读不准时自选一个方向开工，比回问一次代价大得多）",
    ],
]
message = "『卡住时先自证』防线被破坏：{file} 的「卡住时先自证」节缺失要点 {missing}——{desc}；本条对应用户报告的真实失效（缺组件不装、有问题不排、能查到答案却回问人），不得删除、不得降级为建议"

# 平台无关的承接面：执行类操作的超时处置须点明"缺件该去取、不是该问人"。
[[guards.check_self_serve_guard]]
file = "specs/general/collab.adoc"
section = "操作超时与超时后的处置"
kind = "section_groups"
groups = [
    [
        "缺失的组件是该去取的",
        ["**缺失的组件是\"该去取的\"，不是\"该问人的\"（L1）**", "specs/general/planning.adoc"],
        "缺这条时『操作失败/缺件』与『该问人』在超时一节里连不起来，执行者按旧习惯回问",
    ],
]
message = "『卡住时先自证』防线被破坏：{file} 的「操作超时与超时后的处置」缺失要点 {missing}——{desc}"

# 复制面：提示词公共片段（会被未知项目执行）须带上同口径，否则复制出去的题面里
# 只有"记录即可开工"、没有"先自己取"。
[[guards.check_self_serve_guard]]
file = "prompts/_common.txt"
kind = "file_groups"
groups = [
    [
        "timeout 片段",
        ["卡住时先自取、先自排、先自查", "specs/general/planning.adoc",
         "降级式表述与本节同罪",
         "**选哪个都可以的方向性事项：按推荐做完，不中断（L1）**",
         "示例数据的数量只是示例、不以此为限",
         "举反例同样只是示例、不以此为限"],
        "缺这条时提示词复制到未知项目后只剩『如实记录即可开工』，缺件照样回问；方向性事项也重新被拆成选项交回人。示例清单若不带『不以此为限』，复制出去的那份只在举的这几件事上不中断、别处照旧回问",
    ],
    [
        "baseline-and-compat 片段",
        ["先按「缺什么自己取、有问题自己排、有疑问自己查」把它取到/排清"],
        "缺这条时『环境跑不起来不是不动手的理由』仍被读成『记录一下就行』",
    ],
]
message = "『卡住时先自证』防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 复制面的另一处：`prompts/review.adoc` 的读入说明要求"取不到公共片段就按地址再取"——
# 缺这一句时，题面的第一步就把"缺件"当成要回问的事，与本节正相反。
[[guards.check_self_serve_guard]]
file = "prompts/review.adoc"
kind = "file_tokens"
tokens = ["取不到 `prompts/_common.txt` 时按它自己的地址再取一次",
          "地址写在该文件顶部的「查看与复制方式」里", "specs/general/planning.adoc"]
message = "『卡住时先自证』防线被破坏：{file} 的读入说明缺失要点 {missing}——缺件时该按地址再取，不是把『这边没有这份片段』交回人"
