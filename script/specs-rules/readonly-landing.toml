# 落点只读防线（本 PR 新增，用户口径）——规则数据（纯数据 TOML），引擎在 script/rules_engine.py。
#
# 一类规则一个文件（本防线按"被测落点"切分，不与其他防线堆在一起）；加载侧按目录自动扫描。
#
# 用户口径（原文）："~/.cache/agent-specs 里的内容应该设置为只读，不仅仅是规范里定义，
# 文件本身下载后要变成只读，并严禁项目修改此文件夹内容"。
#
# **本条的重点是"不止是规范里写一条"**：规则文本（`AGENTS_COMMON.adoc`）之外，脚本还要真的
# 把落点收紧成只读（本机文件系统强制）。故本防线核**两处**、互不替代：
#   ① 脚本侧：真的算权限位、真的调 chmod（只核"规范里写了只读"会空转——那正是用户点名的
#      "不仅仅是规范里定义"那一半）；
#   ② 规范侧：`AGENTS_COMMON.adoc`「取规范到本地副本」须写明"落点只读"与"严禁项目改动它"。
#
# **平台边界也核**（本轮补，PR 返工）：`os.chmod` 在 Windows 上只切只读属性——文件那一半成立、
# 目录的增删改名拦不住。故"目录去掉写位＝不能在其中增删改名"这句**必须带平台限定**，
# 脚本侧（头部「已知限制」+ `_make_read_only` 的 docstring）与规范侧都要写；
# 无平台限定的断言会让 Windows 读者以为落点真被强制（实际靠规范约束）。

[[guards.check_readonly_landing_guard]]
file = "script/fetch-specs.py"
kind = "file_groups"
groups = [
    [
        "文件只读位的取值",
        [
            "_READ_ONLY_FILE_MODE = ",
        ],
        "脚本须定义**文件只读位**的取值（文件只留读位）——缺则「只读」只剩一句注释，落点的实际权限仍是下载时的默认位（本机侧无从拦截项目改动）",
    ],
    [
        "目录只读位的取值（去掉写位即不能在其中增删改名）",
        [
            "_READ_ONLY_DIR_MODE = ",
        ],
        "脚本须定义**目录只读位**的取值——目录没有写位才**不能在落点里增删改名**（这是「项目改不了落点」的主要一半：改文件要目录写位），只收紧文件位时项目仍能删掉或换掉规范副本",
    ],
    [
        "收紧为只读的执行体（真的调 chmod）",
        [
            "def _make_read_only",
            "os.chmod",
        ],
        "须有**真的调 chmod 的执行体**把落点收紧（只写常量不算执行）——用户口径的重点正是「不仅仅是规范里定义，文件本身下载后要变成只读」：只核规范文本时，落点仍是可写、项目照旧能就地改规范副本",
    ],
    [
        "落盘前恢复写位、写完收紧（只读不挡更新）",
        [
            "_ensure_writable",
        ],
        "须在落盘前**只恢复本脚本所需的最小写位**（否则「默认以远程为准」这条要求会被只读挡住：远端改了却写不进去，用户重跑安装拿不到最新规范）——本脚本的写位按需临时恢复、写完由 _make_read_only 收紧回去",
    ],
    [
        "Windows 上的效力边界（不得写成全平台成立）",
        [
            "已知限制",
            "Windows",
            "FILE_ATTRIBUTE_READONLY",
        ],
        "须在头部「已知限制」里写明**Windows 上的效力边界**：`os.chmod` 在 Windows 上只切只读属性，**文件**因此可置只读，但**目录的增删改名拦不住**（删除权来自父目录的 `DELETE_CHILD`，与目标目录自己的属性无关）——缺则「目录去掉写位＝不能在其中增删改名」这句会被当成全平台成立，Windows 读者据此以为落点真被强制（实际靠规范约束），是把效力边界写成了没有边界的断言",
    ],
    [
        "平台限定写在执行体那一处（不只头部）",
        [
            "Windows",
            "不能在其中增删改名",
            "全平台",
        ],
        "**平台限定须写在执行体 `_make_read_only` 的 docstring 里**（不止脚本头部）：失效形态是「头部写了 Windows 边界、正文那句断言照旧无平台限定」——读执行体的人多半不看头部「已知限制」，而「没有写位就不能在其中增删改名」这句正是在这个函数里对权限位下断言的",
    ],
    [
        "入口保留执行位（只读的例外）",
        [
            "保留执行位",
        ],
        "须写明**只读的例外是执行位**（落点里的入口也要能直接跑，见 specs/general/script.adoc「入口脚本须能直接执行」）——缺则收紧把入口的可执行位一并抹掉，「下次重装直接跑落点里的入口」随之失效",
    ],
    [
        "`--keep` 下同样收紧（只读状态与「要不要更新」无关）",
        [
            "--keep",
        ],
        "须写明**`--keep` 下同样收紧**——收紧的是**只读状态**、与「这批文件要不要更新」无关：只写「下载完收紧」时，最需要它的一路（有人放开过权限、又加 `--keep` 跑一次）恰恰被读成不必收紧，而『不动本地那份』**不等于**『它还是只读的』",
    ],
    [
        "收紧失败不得静默（没有只读就不说只读）",
        [
            "没能收紧",
        ],
        "须有**收紧失败不得静默**的下限：`_make_read_only` 返回没改成只读的节点数、`main` 按它出警告（只读挂载/Windows/非属主时权限位改不动）——只写「落点已设为只读」时，这些环境下调用方与人都以为落点已只读，而用户口径要的正是「文件本身下载后要变成只读」",
    ],
    [
        "网络层异常归一成 OSError（不许掀掉整批）",
        [
            "HTTPException",
            "IncompleteRead",
            "的子类",
        ],
        "须把 `http.client` 的 `HTTPException` 家族（`IncompleteRead`/`BadStatusLine`）**归一成 `OSError`**——`HTTPException` 家族不是 `OSError` 的子类，而 `download_one` 只 `except OSError`，于是会穿过它逃逸到 `fut.result()` 把 `main` 掀掉：调用方拿到 traceback（不是约定的 0/1/2 退出码），后面那条『整棵树收紧成只读』的收尾**一次都不跑**，落点留在 `755`/`644` 的**可写**态且毫无提示——一次网络抖动就让本防线的收益归零（本仓库实证：截断响应下 `stat` 出落点根 `755`、stderr 是 traceback）",
    ],
    [
        "收尾不得被任何异常跳过",
        [
            "单个文件任何异常都不得掀掉整批",
        ],
        "取文件那一段须有**兜底**（单个文件任何异常都不得掀掉整批）——兜底之后**照旧往下走去收紧落点**：收尾被跳过时落点会留在可写态而无人察觉，那正是本条在最需要它的一轮里失效的形态",
    ],
    [
        "收紧动作落在汇总之前（贯穿全部取到的文件）",
        [
            "unhardened = _make_read_only(install_scripts_dir(), is_dir=True)",
        ],
        "收紧动作须**一次覆盖整个落点根**（规范副本的来源槽 + 安装脚本），落在结果汇总之前、且**取返回值**——只收紧一部分时另一半仍是可写的，而「落点是只读的」这句话对读者无法核对；不取返回值时『没改成只读』就无人处置（见下一组）",
    ],
]
message = "落点只读防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_readonly_landing_guard]]
file = "AGENTS_COMMON.adoc"
section = "取规范到本地副本"
kind = "section_groups"
groups = [
