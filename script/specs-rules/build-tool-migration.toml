# 『构建工具迁移』防线规则数据。
#
# 判据本体在 `specs/stack/build-tool-migration.adoc`——**公共内容**（对任一构建工具组合成立），
# 故落技术栈层、不进维护方自查层。
#
# 本条防的失效（用户指出）：迁移被做成"把旧构建工具的形态翻译成新工具能跑的等价写法"——
# 目标工具里多出一层只为对应源工具而存在的结构，而它不承担任何构建职责；
# 从此项目同时有两个构建模型，改一处必漏另一处（Maven 父子关系迁到 Gradle 即此形态）。
#
# 同一条规则的**目标工具侧展开**在 `specs/stack/gradle.adoc`，两道防线各核一份、不互相替代。
[[guards.check_build_tool_migration_guard]]

