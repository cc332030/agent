        "声明落点须写明取项目**已有声明**、不得另立第二真源（多一份必然漂移，且会出现两个互相冲突的版本来源）",
    ],
    [
        "降级路径",
        [
            "降级路径",
            "未声明",
            "未确证",
            "不得记为通过",
        ],
        "须写明降级路径（未声明先确认 / 声明环境不可得时如实说明并把结论标未确证、不得记为通过 / 临时诊断结论须回声明环境复核）——缺则本条会把引用方卡死在装不出声明环境的场景上，或让「用别的版本跑绿」被记成通过",
    ],
    [
        "依据",
        [
            "依据",
