kind = "regex_section"
label = "运行环境"
message = "运行环境防线被破坏：{file} 的「{RUNTIME_ENV_SECTION}」缺失要点 {missing}——{desc}；本条是用户明确提出的硬性要求（L1），不得删除、不得降级"
pattern = "^== 运行环境.*?(?=\\n== |\\Z)"

[[guards.check_runtime_env_guard]]
file = "AGENTS_COMMON.adoc"
groups = [
    # 只核**触发特征**（何时命中本条）：`运行环境须与项目声明一致`/`换个版本也能跑通`/
    # `java.version` 一族都是 `ci-cd.adoc` 的条目本体取值或节名，抄进调度器即第二真源
    # （`terminology.adoc`「数据字典」的反膨胀）。调度器只需让人判得出「现在该加载它」。
    [
        "识别特征",
        [
            "识别特征",
            "运行环境",
        ],
        "加载调度器须有本条的加载项与识别特征（如项目有声明运行环境的落点、要跑构建/测试/脚本）——缺则该条永远不会被加载，规则实际失效",
    ],
    [
        "换个版本也能跑通",
        [
            "换个版本",
        ],
        "调度器条目须保留「换个版本」这一触发面（否则执行者不会想到运行环境还有一条）",
    ],
]
kind = "file_groups"
message = "运行环境防线被破坏：AGENTS_COMMON.adoc 缺失 {missing}——{desc}"

