# ---- 口令入口须**跑得起来**、且**在哪儿都跑得起来**（与上面几组同属这一道防线，故并在同一个文件） ----
#
# 上面几组核的是"入口在不在、正文抄没抄、吐出来的是不是整段"；这一组核另一件事：把入口交到
# 别人手上之后**敲得响吗**。三条都是实测踩到的形态——
#   ① 生成时把 `sys.executable` 的**绝对路径**烘进文件：落点在家的目录下跨来源共用、可被整个
#      搬去另一台机器的（换机器、换 venv、解释器改名），那一行当场 `no such file`；
#   ② 文件名主干是 `use-prompt`，落点根下生成的却是 `use-prompt.sh`——`.sh` 不在 PATH 上，
#      `.md` 里让人敲 `<口令> <名>` 时得到的是 `command not found`，而 `.md` 只是指令、
#      不会自己去试，读者就卡在这一步；
#   ③ 内容一致的那一轮跳过落盘，于是执行位被清缓存/解压工具吃掉之后没人补回来。

[[guards.check_prompts_fetch_guard]]
file = "script/fetch-specs.py"
kind = "file_groups"
groups = [
    [
        "解释器现场试跑、不烘生成时的绝对路径",
        [
            "PROMPT_SHELL_INTERPRETERS",
            "PROMPT_WINDOWS_INTERPRETERS",
            "--probe",
        ],
        "口令入口里**不得**写死生成那一刻的解释器路径（`sys.executable`）：落点跨来源共用且可被搬走，绝对路径换台机器就失效；须与取规范入口同一条口径——留候选次序、运行时 `--probe` 试跑、认第一个跑得起来的",
    ],
    [
        "命令位取值填好、遇占位符就不生成",
        [
            "def resolve_prompt_command_dirs(",
            "resolve_prompt_command_dirs()",
        ],
        "配置里的 `{home}`/`{name}` 须在生成前**真的填好**（家目录本轮现取）；仍留着占位符的那一项**整个不生成**——把 `{home}/...` 当目录建出来时，入口落到一个没人会去的路径，而「已生成」那句话照旧打了出来",
    ],
    [
        "内容一致的那一轮也补执行位",
        [
            "def _prompt_entry_mode(",
            "执行位",
        ],
        "口令入口**每一轮都要补执行位**（哪怕内容一致被跳过落盘）：执行位是「能不能被点名」的全部，而它会被清缓存、解压、同步工具吃掉——口令成了 `Permission denied` 时输出里一个字都没说它跑不了",
    ],
]
message = "提示词口令入口防线被破坏：{file} 缺失要点 {missing}——{desc}"
