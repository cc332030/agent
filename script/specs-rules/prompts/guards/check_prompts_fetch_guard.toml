# 提示词随规范一并取到本地（用户口径：『我希望一键使用』）。
#
# 用户原话：「那三个提示词属于skill吗？我希望一键使用，那就要进 agent_common.adoc吧，
# 要怎么使用比较好呢，所以下载规范的脚本也需要下载提示词相关」。
#
# 失效形态：只把规范取到本地、提示词还得回站点一份份点——"一键使用"就不成立；而提示词与
# 规范、索引页**互不引用**，少取一份不会有任何东西报错（"看着取全了、其实少了几份"）。
# 故判据落在两处、缺一即那条账收不回来：
#   ① **清单从登记处解析**（入口指向提示词登记处那一行 → 登记处自己列着有哪些提示词），
#      不按目录扫（扫会把草稿、素材与"只对本项目生效"的命令一并取给调用方）；
#   ② **取全要核得出来**（收尾按清单逐个核、缺的报出名字并按失败计），且**公共片段**
#      随附随件走（它不是提示词，但缺了它提示词读不全）。

[[guards.check_prompts_fetch_guard]]
file = "script/fetch-specs.py"
kind = "file_groups"
groups = [
    [
        "清单从登记处解析（不是按目录扫）",
        [
            "def prompt_targets(",
            "PROMPT_DOC_RE",
            "登记处",
        ],
        "提示词清单须从**登记处**（入口指向的那个文件）解析——按目录扫会把草稿、素材与本仓库私有的命令一并取给调用方，而登记表本来就是「有哪些提示词」的唯一落点",
    ],
    [
        "登记处在入口里可解析",
        [
            "def prompt_index_target(",
            "PROMPTS_INDEX_RE",
        ],
        "须从**入口自身**认出提示词登记处（解析不到只跳过、不报错：镜像来源可能没有提示词那一层）——靠人另配一个参数时，「一键」就要求调用方先知道该填什么",
    ],
    [
        "公共片段随附随件走",
        [
            "COMMON_PROMPT_REL",
            "FOLLOWUP_FILES = (",
        ],
        "公共片段须随**附随件**取（它不是任务提示词、却在清单之外被提示词 `include`）——缺它时取到的提示词按未装配形态读不全公共步骤",
    ],
    [
        "取全要核得出来（缺的报名字、计失败）",
        [
            "def prompts_missing(",
            "def report_prompts_missing(",
            "_PROMPTS_TAKEN",
        ],
        "收尾须按清单**逐个核一遍**并**报出缺的名字**：提示词与规范互不引用，少一份不会有任何东西报错，而「我说取全了」这句话的全部分量就在这里",
    ],
    [
        "核不了不等于取全了",
        [
            "不当成取全了",
        ],
        "登记处本身取不到时须**如实说核不到**（返回「核不了」这一档、并计作没取全）——把「没核到」写成「取全了」正是本条要防的形态",
    ],
]
message = "提示词一并取到本地防线被破坏：{file} 缺失要点 {missing}——{desc}"

