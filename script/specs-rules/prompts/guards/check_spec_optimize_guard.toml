# 『信息密度』扫描面的**称谓唯一**：两类惯犯各自只叫一个名字。
# 本仓库实证的写法是「不存在的反面对照」被换成同义的散文（"编不出来的反例""没有意义的强调"）
# 或与⑥ 混称——名字本身是**被逐字回指的判据名**（`doc.adoc` 判定标准⑦、`prompts/spec-refine.adoc`
# 的扫描面清单都按这个名字回指），换名即回指断链、读者对不上号。
[[guards.check_spec_optimize_guard]]
kind = "file_forbidden"
file = "prompts/spec-refine.adoc"
forbidden = [
    "编不出来的反例",
    "没有意义的强调",
]
message = "「信息密度」扫描面出现非规范称谓 {hit}——两类惯犯的名字须逐字用 `specs/general/doc.adoc`「信息密度（每句须承载）」判定标准⑥⑦ 的名字（反向兜底 / 不存在的反面对照），换名即与真源的回指断链"
