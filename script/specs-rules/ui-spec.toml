# 『界面与交互（跨端形状、尺度、颜色与交互）』防线规则数据。
#
# 判据本体在 `specs/general/ui.adoc`——**公共内容**（对任何产出界面的项目成立，不限语言与端）。
# 四份**模板文件**与它同层、只给取值：`specs/general/ui-tokens.adoc`（令牌取值：色阶、字号
# 尺度、间距、控件高度、分端下限）、`specs/general/ui-targets.adoc`（各端框架与参照应用的
# 选择口径）、`specs/general/ui-styles.adoc`（风格族清单与必写项）、`specs/general/ui-voice.adoc`
# （动作名与文案词表）。
#
# **新增 .adoc 须同源登记三处**：本道只核「模板是否回指判据本体」，不核「模板是否被扫描面
# 收录」——扫描面（`check_specs.py` 的 `POINTER_SCAN_FILES` 与 `duplicate.toml` 的 `files`）
# 漏登记时本道全绿、那两份文件却永不参与回指与重复检查（本仓库实证：`ui-styles.adoc` 与
# `ui-voice.adoc` 首版即漏登记，由 `test_scan_files_cover_all_adoc` 报出）。
#
# 本条防的失效：**外观与交互没有可执行的测试**——同一产品各端各写一套，颜色按色相命名、
# 层级靠透明度、字号逐页微调、触摸端拿桌面端的控件高度直接套、关键入口只在悬停时出现；
# 这些跑什么都不报错，只有人看得出来，等看出来时已经散在几十个文件里。
#
# **与既有三道界面的分工**（不得被判成重复而合并）：
#   * `check_ui_style_guard`（`specs/general/coding.adoc`「界面与样式」）管**取哪套现成方案、
#     同一形态放哪一处、`!important` 的次序**——本条管**取什么颜色/字号/间距/高度**；
#   * `check_ui_performance_guard` 管**数据长起来会不会卡**——本条管**看得清不清、点得动点不动**；
#   * `check_same_thing_one_source_guard` 管**两处算不算同一件事**——本条在视觉层的形态是
#     「同一令牌只有一个取值、同一组件只有一个外观来源」。

# ① 判据本体：通用层 `specs/general/ui.adoc`，**逐节核**（每节一组锚点清单）。
# 逐节而不是一次核全文：锚点清单按节分开，某节的要点被整段抽走时该节自己报红，
# 报错正文直接给出"哪一节缺了什么"。
[[guards.check_ui_spec_guard]]
file = "specs/general/ui.adoc"
kind = "section_groups"
section = "本文件的字典（本文件使用的名称，定义写在本文开头）"
token_list = "UI_SPEC_TERMS_ANCHORS"

[[guards.check_ui_spec_guard]]
