# ③ 加载门：调度器「任何代码活动」——缺则写缓存的人不会加载该节，判据存在而走不到它。
[[guards.check_cache_guard]]
file = "AGENTS_COMMON.adoc"
section = "通用层（涉及对应活动时加载）"
kind = "line_tokens"
anchor = ["任何代码活动"]
message = "『缓存（统一管理、先缓存后在线）』防线被破坏：调度器「任何代码活动」条目缺 {missing}——缺该识别特征时，写缓存的人不会加载该节"
tokens = [
    "要**用到缓存**",
    "localStorage",
    "Cache-Control",
    "先显示缓存再更新",
]

# ④ README 目录说明同步（公共内容的目录说明是读者的入口清单，缺则「这一节存在」没人知道）。
[[guards.check_cache_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "缓存（统一管理：一份数据一处缓存入口",
    "后端接口只给确定的一份",
    "先给缓存再换在线",
    "各标来源与多久前",
]
message = "『缓存（统一管理、先缓存后在线）』防线被破坏：{file} 的目录说明缺 {missing}——README 是读者找这一节的入口清单，不同步等于「这一节加了也没人知道」"
