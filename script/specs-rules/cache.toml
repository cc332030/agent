# 『缓存（统一管理、先缓存后在线）』防线规则数据。
#
# 判据本体在 `specs/general/coding.adoc`「缓存（统一管理、先缓存后在线）」——**公共内容**
# （对任何产出界面或取数代码的项目成立，不限语言与端）；前端载体在 `specs/stack/web.adoc`
# 「缓存（载体）」，它**只给载体、判据本体的措辞不复述、也不另立一套**。
#
# 用户口径（原话要点）：『当需要用到缓存时，统一缓存管理，避免一份数据管理多份；如果有实时
# 查看的需求时，先加载缓存数据，异步加载在线数据，有变动时才更新，避免页面空白及闪动；
# 如果有需要可以加标识是缓存数据（以及多久前的数据）还是在线数据（以及什么时候刷新的数据）』，
# **并补一句适用面**：『先给缓存再换在线，这个只适用于界面、网页，不适用于后端接口；后端接口
# 一般要确定的数据，确定是缓存还是在线，且只会给一次，需要区分后端 api 的缓存还是界面的缓存』。
# 故判据取四件可核对的事：一处缓存入口、**后端接口只给确定的一份（两处缓存分开判）**、
# **界面才**先缓存后在线、有变动才更新、来源与时间可辨识（后两件只在界面侧成立）。
#
# **本条与既有条目的分工**（不得被判成重复而合并）：
#   * 「同一件事只有一个来源」管**功能/工具方法/契约**的重复实现，本条管**数据的缓存副本**
#     ——同一份数据被页面各存一份，代码上看起来是不同变量、不同存储区，业务上却是同一份数据；
#   * 「代码复用」的『缓存前先判断对象生命周期』管**该不该缓存**（一次性对象不入缓存、
#     避免内存泄露），本条管**已经要缓存时怎么组织**；
#   * 「界面的规模与性能」管**取多少、怎么画**（分页/虚拟滚动/重区块），本条管**取回来的那份
#     怎么先给画面**——两者在"全量类操作的生效范围"处接上（缓存只覆盖已取回的那一份）；
#   * **本条内部**：后端接口缓存与界面缓存是**两处缓存、两套判据**——接口给确定的一份（一个
#     响应一个结果），界面才"先给缓存再换在线"；两者**各自成立、不得互免**。

# ① 判据本体：通用层整节（四条判据 + 边界 + 存量边界 + 依据行）。每组按序核锚点，
# 最后一项是最短的那个、失去它即该组不再成立。
[[guards.check_cache_guard]]
file = "specs/general/coding.adoc"
kind = "section_groups"
section = "缓存（统一管理、先缓存后在线）"
token_list = "CACHE_ANCHORS"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错。删清单须与调 `min` 一并发生。
[[guards.check_cache_guard]]
file = "specs/general/coding.adoc"
section = "缓存（统一管理、先缓存后在线）"
kind = "anchor_count"
token_list = "CACHE_ANCHORS"
min = 29

# ② 前端载体：技术栈层只给载体、判据本体的措辞不复述、也不另立一套（第二真源由本组反向钉住）；
