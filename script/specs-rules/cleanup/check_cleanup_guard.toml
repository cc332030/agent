#
# 判据本体就在 `specs/general/cleanup.adoc`（本文件只核要点仍在，不重述判据）——
# "某次到底该不该清、某目录属哪一类、某份临时文件还有没有保留价值"属运行时事实与语义判断，交人/子 agent 复核。

