message = "长方法的反复调用点防线被破坏：{file} 的「任何代码活动」登记缺失 {missing}——缺该识别特征时，在一处重复写长调用不会触发加载该条"
tokens = [
    "要**在一处多次调用同一个参数很多的（很长的）方法**",
]

