[[guards.check_repeat_call_passthrough_guard]]
bullet = "长方法的反复调用点"
file = "specs/general/coding.adoc"
section = "代码复用"
kind = "bullet_tokens"
message = "长方法的反复调用点防线被破坏：{file} 的「长方法的反复调用点」条**本条自己的正文**缺失 {missing}——该条对应用户要求（同一处多次调用很长的被调方法时在本类加透传；跨类重复时才上公共落点），不得删除、不得降级、不得把去向压成一句「自己判断」；三个子段须以**列表续行**（`+` 单独一行）接在本条上，退回「空行 + 两空格缩进」会被渲染成 literal block（`**` 与反引号露出字面量）"
min = 16
tokens = [
    # 条文（靶心）
    "长方法的反复调用点：在本类（或本处已依赖的落点）加透传、不把调用点散到各处（L1，任何语言）",
    "不得**把这段很长的调用原样抄在每个调用点",
    "透传的**数量**由本处调用点决定",
    # 三条去向（用户问的那一层：换方法名 / 加公共透传）
    "**多处都要加同一份透传时的三条去向（按序判，取最先成立的一条）**",
    "让调用点**本来就短**",
    "才在**公共落点**",
    # 判定标准
    "**判定标准（任一命中即违规）**",
    "而未加透传",
    "把**短**调用也加上只做转发的透传",
    # 例外与边界（末句的指代名与「代码质量」节一致——那里的判据叫「职责单一、结构清晰」等）
    "**例外与边界（L2）**",
    "不擅自改它的签名",
    "「代码质量」节的**职责单一、结构清晰**",
    # 存量边界
    "**不预先把同类透传给全项目补齐**",
    # 三个子段须走**列表续行**（`+` 单独一行），不是"空行 + 两空格缩进"：后者经 `asciidoc`
    # 渲染实测变成 **literal block**（`<pre><code>`）——`**` 与反引号全部露出字面量、
    # 子段还被移出本条的 `<li>`。核的是续行标记本身（缺了它，上面那些子段的锚点仍一字不少）
    "\n+\n**多处都要加同一份透传时的三条去向（按序判，取最先成立的一条）**",
    "\n+\n**例外与边界（L2）**",
    "\n+\n**存量边界（L1）**",
]

# 依据行**不是**以 `**` 起头的条目（`bullet_tokens` 的取法只认 `* **<前缀>`，取它一律落空、
# 会把"条目不存在"报成红），故按**整行**核（`line_tokens`）。**`* ` 是 AsciiDoc 的列表标记**：
# 缺了它，整条依据会并进前一条的正文（渲染实测：依据段落落进「存量边界」那条的 `<li>` 里，
# 且在正文里留下裸 `**`），故锚点带上列表标记本身，不核"那句语句还在不在"。
[[guards.check_repeat_call_passthrough_guard]]
anchor = ["* 依据（标准名/编号）：ISO/IEC 25010（可维护性）、ISO/IEC/IEEE 29148"]
file = "specs/general/coding.adoc"
kind = "line_tokens"
message = "长方法的反复调用点防线被破坏：{file} 里该条的依据行缺失 {missing}——依据行须是**独立条目**（`* ` 列表标记不可省：缺了它整条依据并进上一条的正文），取舍声明（哪半句是本集合自己定的）不得被抽走"
tokens = [
    "* 依据（标准名/编号）：ISO/IEC 25010（可维护性）、ISO/IEC/IEEE 29148（判定须单一、无歧义、可验证）、Martin Fowler《Refactoring》",
    "是本集合的判据化取舍**",
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_repeat_call_passthrough_guard]]
bullet = "长方法的反复调用点"
file = "specs/general/coding.adoc"
kind = "anchor_count"
section = "代码复用"
min = 16

