    '要**手动创建/初始化对象**',
    '**对象初始化**（要手动创建对象：出现 `new X(...)` 带参数、builder 链、链式 setter 或逐条 `set` 的字样时）',
]
message = '对象初始化防线被破坏：{file} 缺失要点 {missing}——调度器须给两处识别特征（通用层「任何代码活动」条按「要手动创建对象」触发加载、Java 技术栈登记按同形字样加载）；缺则该条在引用方的实际加载路径上失效'
[[guards.check_object_init_guard]]
file = 'README.adoc'
kind = 'file_tokens'
tokens = [
    '**对象初始化（手动创建对象时链式优先：链式初始化 > 逐条 `set`，严禁有参构造初始化）**',
    '**对象初始化一律链式（builder > 链式 setter > set，严禁有参构造初始化）**',
]
message = '对象初始化防线被破坏：{file} 缺失要点 {missing}——README 的目录说明须同步登记该条（通用层与 Java 栈两处），否则读者按 README 学习时无从知道有这条规则'

# 图书馆侧**按那一行核**（`line_tokens`）：三个锚点在 `library/adoption.adoc` 的别条目里
# 反复出现，按整份文件核时把本条整条掏空成一句空话也报不出来。
[[guards.check_object_init_guard]]
anchor = ['手动创建对象时优先链式初始化', '本集合自己的判据化取舍']
file = 'library/adoption.adoc'
kind = 'line_tokens'
tokens = [
    '没有任何材料规定**"手动创建对象一律必须走链式初始化"',
    'Java 内再分档：builder > 链式 setter',
    '严禁 `new X(a, b, …)` 手动创建',
    '唯一例外是对象内的构造方法调用构造方法',
    '框架驱动的创建不算"手动初始化"',
    '只减不消',
    '加字段/调顺序时**调用点无一报错**',
    '**本项目实证**：用户原文口径为"**对象手动初始化时，优先使用链式初始化（java 下 builder > set chain），适用于所有语言，没有链式再用 set，严禁有参构造方法初始化（对象内构造方法调用构造方法除外）**"',
]
message = '对象初始化防线被破坏：{file} 的该条登记行缺失 {missing}——本集合的取值须如实标注外部材料**未**规定该层（防读者把它读成 Effective Java 的规定），并须给出理由与实证'
# 『取兼容性更好的那一个』防线（**用户提出**：同一能力两个及以上等价入口并存时取兼容性更好的那一个，
# **适用所有语言、不限编程**——原话给的是 Spring `@Validated` vs `javax` `@Valid` 这一例）。
# 判据按**本条 bullet 自己的正文**核（`bullet_tokens`）：「警告与弃用」节相邻条目含
# `@Deprecated`、`弃用`、`替代者`、`依赖面`、`随动迁移` 等字样，按整节核会把抽走的要点兜住。
# 防的四个失效形态：① 条文被降级成"注意兼容性"（只剩方向、没有取值）；② 取值的优先次序被抽走
# （"兼容性更好"退回各自理解）；③ 例外只留一半（标准组织的既有形态被读成"必须换掉"，
# 或"效果有差异"这一半丢了、变成可以拿更兼容的形态替掉效果不同的那个）；
# ④ 把"取兼容性更好的"读成"凡是新的就取"（新形态尚未被当前依赖面支持时取了即引编译/运行问题）。
