min = 6
tokens = [
    '对象初始化一律链式：builder > 链式 setter > set，严禁有参构造（L1，本文件是 Java 落点）',
    '优先 builder（`@SuperBuilder`，优先于 `@Builder`、支持继承）',
    '没有 builder 才用链式 setter',
    '**严禁**以 `@AllArgsConstructor` 生成的全参构造或手写的位置参数构造**手动创建**（`new X(参数...)`）',
    '唯一例外是对象内的构造方法调用构造方法',
    '调用点出现 `new X(...)` 带参数即违规（对象内构造转发除外）',
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——删除清单里的项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_object_init_guard]]
