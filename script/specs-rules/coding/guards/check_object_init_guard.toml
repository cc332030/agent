# 模板侧：新建数据对象时**真正被读的那一份**里须给出创建写法（新建时才能照抄到），
# 且只给照抄口径、判据回指本体（模板文件自称"不重复那些判据"）。
[[guards.check_object_init_guard]]
file = 'specs/stack/java-object.adoc'
kind = 'file_groups'
groups = [
    [
        '模板侧照抄约定（创建写法 + 分档 + 禁止面 + 回指判据本体）',
        [
            '手动创建时用链式、不用有参构造',
            # 分档与禁止面是这一行的靶心：抽掉后新建对象时回调回逐条 `set` / `new Xxx(a,b,c)`
            '**有 builder 就用 builder**，没有 builder 才用链式 setter',
            '两者都不可得才逐条 `set`',
            '**严禁**用 `@AllArgsConstructor` 生成的全参构造或手写的位置参数构造去**手动创建**',
            '唯一例外是对象内的构造方法调用构造方法',
            '模板不重述',
        ],
        '模板：整段照抄的那份清单里须给出创建写法约定（有 builder 用 builder、没有才链式 setter、都不可得才 set）、点名唯一例外并回指判据本体——缺则新建对象时丢掉该约定（模板是新建对象时真正被读的那一份）',
    ],
]
message = '对象初始化（模板）防线被破坏：{file} 缺失要点 {missing}——{desc}'

# 调度器两处：通用层「任何代码活动」条须带识别特征（要手动创建对象时即加载该条），
