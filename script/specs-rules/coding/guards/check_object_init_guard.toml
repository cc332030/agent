[[guards.check_object_init_guard]]
bullet = '对象初始化：链式初始化优先'
file = 'specs/general/coding.adoc'
kind = 'bullet_tokens'
section = '对象初始化'
message = '对象初始化防线被破坏：{file} 的「对象初始化」条**本条自己的正文**缺失 {missing}——该条对应用户要求（手动创建对象时链式初始化优先：链式 > 逐条 `set`；Java 内 builder > 链式 setter；严禁有参构造初始化，唯一例外是对象内构造方法调用构造方法），不得删除、不得降级、不得只留「优先链式」而把禁止面抽掉'
min = 27
tokens = [
    # 条文：链式优先 + 标 L1
    '链式初始化优先、无链式才用 `set`、严禁有参构造初始化（L1）',
    '手动创建对象一律用链式初始化',
    '链式初始化 > 逐条 `set`',
    '没有链式形态',
    # Java 内分档（用户点名：builder > set chain）
    'Java 内部再分档：builder 优先于链式 setter（L1）',
    '**优先用 builder 链**',
    '没有 builder 时才退回链式 setter',
    '**只减不消**',
    # 禁止面（本条的靶心）
    '严禁**以"参数带着字段一起传"的**有参构造方法',
    '参数位置的语义**交给调用点',
    '字段增删或重排时调用点无一报错',
    '**静默失效**',
    # 唯一例外（用户点名）+ 不得被读宽的误用形态
    '对象内的构造方法调用构造方法',
    '构造链式转发',
    '误用形态',
    # 框架驱动的创建不属手动初始化
    '框架按声明创建对象',
    # 判定标准（逐条可核对）
    '**判定标准（任一命中即违规）**',
    '出现**两处及以上**逐条 `set`',
    '却改用链式 setter 或逐条 `set`',
    '手动创建对象时出现**有参构造调用**',
    # 边界（防反用：不管对象内部、不管框架创建、不管次序）
    '不归本条管',
    # 存量边界
    '不发动全库改写',
    # 例外清单的其余四项（**本条的防扩大面**：整条被抽走时，逐条 `set` / 具名参数两种写法
    # 与"这类构造不属手动初始化"这三处依据一并失效——本行只锚其中三项，第 1 项（对象内
    # 构造转发）在上面的"唯一例外"组里已锚）
    '**语言或框架根本没有链式形态**',
    '**目标对象是第三方类型、不可改**',
    '**语言惯用的具名构造即该语言的链式形态**',
    '这类构造的书写仍按各自规则',
    # 依据行（标准名/编号 + 本集合取舍声明）
    '**「优先链式初始化（Java 内 builder > 链式 setter）、没有链式才用 `set`、严禁有参构造初始化」是本集合的判据化取舍**',
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_object_init_guard]]
file = 'specs/general/coding.adoc'
kind = 'anchor_count'
bullet = '对象初始化：链式初始化优先'
section = '对象初始化'
min = 27

# Java 落点侧同样**按条目自己的正文核**：「编码」一节里相邻条目含同样的框架专名
