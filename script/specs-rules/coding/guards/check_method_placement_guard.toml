[[guards.check_method_placement_guard]]
bullet = "成员与方法次序"
file = "specs/general/coding.adoc"
kind = "bullet_tokens"
message = "成员与方法次序防线被破坏：{file} 的「成员与方法次序」条**本条自己的正文**缺失 {missing}——该条对应用户提出的要求（新增成员按业务流程先后落点、允许加在已有成员的前面或中间、重载紧邻、先初始化的在前、被依赖者在前、数据转换方法写在查询接口之后、只对新增成员生效），不得删除、不得降级、不得被读成「一律追加到末尾」。每条锚点须在**本条 bullet 内唯一**"
section = "命名与代码质量"
min = 25
tokens = [
    # 条文：新增成员按流程次序落点、标 L1（防被降级成建议）
    "**成员与方法次序（L1，任何语言）**",
    "**新增**成员/方法/函数时",
    "其**位置**按「**流程次序**」定",
    # 允许插前面/中间（用户点名的原话，也是与 Google「不得追加到末尾」的接口）
    "允许把新增的方法加在**已有成员的前面（含最前面）或中间**",
    "**不得**为「不动已有顺序」而一律追加到类/文件末尾",
    # 重载相邻
    "**重载成员**（同名不同参数）**一律紧邻已有同名成员**",
    "**重载之间的次序同样按流程次序**",
    # 例外：转换跟随查询
    "**例外（L2）**",
    "**数据转换方法**",
    "**默认写在查询它的那个接口/方法之后**",
    "先把查询写出来、再写转换",
    # 理由（位置即次序信息、追加序不报错）
    "位置本身表达「谁先谁后」",
    "多套互相无关的次序",
    "只是次序无声漂移",
    # 判定标准（逐条可核对）
    "**判定标准（任一命中即违规）**",
    "而按其流程次序本可在其他成员**之前或之间**",
    "把 `RestTemplate` 写在其依赖的 `ObjectMapper` 之前",
    "与已有同名成员**不相邻**",
    "数据转换方法排在其**查询接口之前**",
    # 边界（防反用：只管新增落点、不重排既有）
    "本条**只管新增成员的落点位置**",
    "**不要求**为满足本条而**重排**既有成员",
    # 存量边界：只对新增生效；review 不提出问题已升为全局口径（review.adoc），此处只留回指
    "本条**只对新增成员生效**",
    "review 时对既有成员的位置不提出问题",
    # 依据行（标准名/编号 + 本集合取舍声明）
    "**「按流程次序、可插前面或中间 + 重载相邻 + 转换跟随查询」是本集合的判据化取值**",
    "Google 只禁止「追加在末尾」这一形态",
]
# Java 落点侧同样**按条目自己的正文核**：「编码」一节里相邻条目含同样的字样
# （「成员与注解排序」含实体类字段与注解次序、「数据对象模板」含 builder 链），
# 整节核时把本条的载体名抽走也报不出来。锚点取**Java 侧的载体**——判据本体与
# 判定标准由通用层那条核，本侧只须证明「回指通用层 + 给到 Java 载体」还在。

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_method_placement_guard]]
file = "specs/general/coding.adoc"
kind = "anchor_count"
bullet = "成员与方法次序"
section = "命名与代码质量"
min = 25
[[guards.check_method_placement_guard]]
bullet = "成员与方法次序（L1，本文件是 Java 落点）"
file = "specs/stack/java.adoc"
kind = "bullet_tokens"
message = "成员与方法次序（Java 落点）防线被破坏：{file} 的「成员与方法次序（L1，本文件是 Java 落点）」条**本条自己的正文**缺失 {missing}——Java 执行者按栈文件学时仍会一律追加到类末尾、重载散落、转换方法跑到查询之前"
section = "编码"
min = 8
tokens = [
    "按 `specs/general/coding.adoc`",
    "判据本体、判定标准、例外与存量口径见该处",
    "此处**不复述**",
    "**只给 Java 侧的载体**",
    "**成员**＝字段、方法、重载方法",
    "写在依赖它的 `RestTemplate` 之前",
    "**数据库实体与返回模型的互转方法**",
    "**静态初始化块与字段初始化顺序**",
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_method_placement_guard]]
file = "specs/stack/java.adoc"
kind = "anchor_count"
bullet = "成员与方法次序（L1，本文件是 Java 落点）"
section = "编码"
min = 8
[[guards.check_method_placement_guard]]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
anchor = ["任何代码活动"]
tokens = ["要**新增字段/方法/函数**", "数据转换"]
message = "成员与方法次序防线被破坏：{file} 的「任何代码活动」条目缺失 {missing}——缺该识别特征时，新增方法不会触发加载该条"
[[guards.check_method_placement_guard]]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
anchor = ["Java 项目"]
tokens = ["**成员与方法次序**"]
message = "成员与方法次序防线被破坏：{file} 的 Java 技术栈登记缺失 {missing}——缺该识别特征时 Java 项目按栈登记加载看不到这条"
[[guards.check_method_placement_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = ["**成员与方法次序**"]
message = "成员与方法次序防线被破坏：{file} 缺失要点 {missing}——README 目录说明不同步时，读者按 README 学习时无从知道有这条规则"
[[guards.check_method_placement_guard]]
file = "library/adoption.adoc"
kind = "line_tokens"
anchor = ["成员与方法次序", "本集合自己的判据化取舍"]
tokens = [
    "**没有任何材料规定**\"新增成员按流程次序落点",
    "**也**没有规定\"重载成员须相邻",
    "**只对新增成员生效**",
    "**review 时对既有成员的位置不提出问题**",
    "而\"只能往末尾加\"这条常见做法正是 Google 点名禁止的形态",
    "**本项目实证**：用户原文口径为",
]
message = "成员与方法次序防线被破坏：{file} 的该条登记行缺失 {missing}——本集合的取值须如实标注外部材料**未**规定该层（防读者把它读成标准规定），并须给出理由与实证"

# 『参数载体（不得以键值容器承载方法参数）』（用户从存量项目规范引入：严禁在任何方法形参中用
# `Map` 传递数据、必须使用具名对象；仅调用方主动声明时才允许）。
# 要治的失效：键值容器只有键名、没有成员声明——字段名/字段类型/必填性都没有落点，两端靠字面键
# 约定，**键名改一处即静默失效**，且键集合无法在编译期核对。
# 判据按**条目自己的正文**核（`bullet_tokens`，不是整节）：「数据契约的载体」一节里相邻条目同样
# 含「载体/契约/存量边界/依据」一类字样，按整节核时它们会把从本条抽走的要点**兜住**。
