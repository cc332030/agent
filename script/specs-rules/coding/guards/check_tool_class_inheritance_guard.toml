# Java 落点（`java-syntax.adoc`「工具类定义」）：给载体——认类看命名与用法、
# `@UtilityClass` 自带私有构造器故不可被继承、公共部分去向是组合与静态导入；
# 并回指 `java.adoc`「命名」把 JDK 扩展类/补齐类排除在工具类之外。

