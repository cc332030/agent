# 『对象初始化（手动创建对象时的写法）防线』（**用户提出**）：用户原文口径为「对象手动初始化时，
# 优先使用链式初始化（java 下 builder > set chain），适用于所有语言，没有链式再用 set，
# 严禁有参构造方法初始化（对象内构造方法调用构造方法除外）」。
# 失效形态：① 条文被删或降级成"建议"（于是"有参构造就一行""这样更直观"重新成立）；
# ② **有参构造**那一半被抽掉（只剩"优先链式"这句口径、禁止面没了）；③ **唯一例外**被删或
# 被扩大（写成"类内写构造都合规"）；④ Java 内的**分档**被反向或抹平（builder 与链式 setter
# 同级、或 builder 反而在后）；⑤ 存量边界被抽（等于要求立刻批量改写既有创建语句）；
# ⑥ 依据行被抽（读者把本站取舍当成 Effective Java 的规定）。
# 核对对象一律是**条目自己的正文**（`bullet_tokens`，不是整节）：本条与「命名与代码质量」
# 「对象转换」等节相邻条目共用大量字样（"链式""setter""字段顺序"），按整节核时相邻条目会把
# 抽走的要点**兜住**。锚点一律取**本条 bullet 内只出现一次**的词。
