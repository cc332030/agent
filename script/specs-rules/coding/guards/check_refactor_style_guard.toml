# 『重构时也不许用三段式』（**用户提出**）：用户口径是「重构时也不允许三段式，我记得规范里写了，
# 但是偶尔还是会使用」——失效不是"不知道规则"，而是**"写新代码"与"重写代码"被当成两套规则**：
# 重构时只盯行为不变，同一句三段式被原样搬进新结构，规则对本次写的代码等于不成立。
# 故本条钉在「表达式与调用写法」节「三元表达式为最低优先级」条**自己的正文**上（该节相邻条目含「三元」
# 「三段式」字样，按整节核会把抽走的要点兜住），钉三件事：① 该条是本集合的 L1 判定面；
# ② **重构不构成豁免**（判定标准两条：新增/改写的那一行出现三段式、以"减少 diff"为由保留）；
# ③ **只允许简单三元**：三个位置各是一个原子，不带运算、不带函数调用（用户口径："严禁三元，
# 只允许简单三元，不带任何运算、任何函数调用"）——"换不动就留着"的例外面不得兜住带运算/调用的三段式；
# ④ 例外面与存量边界（搬不动的原样搬动不算违规、未触达的存量不发动全库改造）。
[[guards.check_refactor_style_guard]]
bullet = "三元表达式为最低优先级"
file = "specs/general/coding-shape.adoc"
kind = "bullet_tokens"
message = "重构写法防线被破坏：{file} 的「三元表达式为最低优先级」条**本条自己的正文**缺失 {missing}——缺了「只允许简单三元（三个位置不带运算、不带函数调用）」或「重构也照此办」，带运算/调用的三段式与重构时原样搬动的三段式都没人报"
section = "表达式与调用写法"
min = 13
tokens = [
    "三元表达式为最低优先级（L1）",
    "就**绝不用三段式**",
    "**只允许简单三元**",
    "**三个位置都不带任何运算、不带任何函数调用**",
    "**怎么判「简单」（任一命中即不是简单三元）**",
    "**重构也照此办（L1）**",
    "**不区分「写新代码」与「重写既有代码」**",
    "**判定标准（任一命中即违规）**",
    "**例外与边界（L2）**",
    "原样搬动**，这是本节的正当例外",
    "**未触达的存量**",
    "**理由**",
    "是本集合的判据化取值",
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_refactor_style_guard]]
file = "specs/general/coding-shape.adoc"
kind = "anchor_count"
bullet = "三元表达式为最低优先级"
section = "表达式与调用写法"
min = 13
