[[guards.check_chain_assignment_order_guard]]
bullet = "链式赋值顺序随字段顺序"
file = "specs/general/coding.adoc"
kind = "bullet_tokens"
message = "链式赋值顺序防线被破坏：{file} 的「链式赋值顺序随字段顺序」条**本条自己的正文**缺失 {missing}——该条对应用户提出的要求（链式调用里的赋值顺序与字段、数据库顺序保持一致），不得删除、不得降级、不得自成第二个次序来源。每条锚点须在**本条 bullet 内唯一**：本条正文里同一个词只出现一次，故锚点直接取该词即可被抽走即报；写成「更重要的在下」那类**同节他条也含**的短语时，核对对象换成本条也拦不住（锚点本身没命中过本条、无从判断是被抽走还是本来就没有）"
# 锚点一律取**本条正文里只出现一次**的词：本步的报错只在 token 不出现在本 bullet 时触发，
# 故 token 若在本条内部**另有出处**（依据行、同段复述），抽掉目标那句话后 token 仍在、
# 只是从别处命中，报不出来。本轮实测：`不发动全库重排` 三处出现、`ISO/IEC 25010` 两处、
# `不改变求值语义` 两处（边界句 + 「不改变」的另一种说法），逐词删净后仍全绿。
section = "命名与代码质量"
min = 19
tokens = [
    # 条文：赋值顺序随字段顺序、标 L1（防被降级成建议——『顺序怎么写都行』读起来无害）
    "链式赋值顺序随字段顺序（L1，任何语言）",
    "**书写顺序须与字段顺序一致**",
    # 不另定次序、回指既有两条（防第二真源）
    "字段顺序**取该条已定义者",
    "实体类**按「实体类字段按数据库顺序」",
    "其他类**按「接口/类/注解成员排序」取该类的成员次序",
    # 理由（同一份字段清单只有一个次序来源）
    "同一份字段清单的第二个来源",
    "只是次序无声漂移",
    # 判定标准（逐条可核对）
    "**判定标准（任一命中即违规）**",
    "含按字母序、按使用频率、按改动追加的次序",
    "以「这样读起来更顺」",
    "把「字段顺序」读成「本条的专用顺序」",
    # 例外只在语义要求时开口（L2）
    "**例外（L2）**",
    "**执行次序决定语义**",
    "按所选字段在字段顺序里的相对先后",
    # 边界（防反用：只规定书写次序、不多写）
    "**只规定赋值环节的书写次序",
    "不要求为满足本条的次序而多写一次赋值",
    # 存量边界
    "改到哪处才顺带调整该处的次序",
    # 依据行（标准名/编号 + 本集合取舍声明）
    "**「赋值顺序随字段顺序」是本集合的判据化取值**",
    "通行风格指南未规定赋值次序须跟随字段次序",
]
# Java 落点侧同样**按条目自己的正文核**：「编码」一节里相邻条目含同样的框架专名
# （「成员与注解排序」条含实体类字段与表列序、「数据对象模板」条含 `@Accessors(chain = true)`
# 与 `@SuperBuilder`），整节核时把本条的载体名抽走也报不出来。本轮实测：把本条 Java 落点条文
# 整条改成「赋值环节按**书写者顺手的次序**排列，**不要求**按字段声明次序」后 **0 条报红**
# （锚点词全在相邻条目里命中过）。

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_chain_assignment_order_guard]]
file = "specs/general/coding.adoc"
kind = "anchor_count"
bullet = "链式赋值顺序随字段顺序"
section = "命名与代码质量"
min = 19
[[guards.check_chain_assignment_order_guard]]
bullet = "链式赋值顺序随字段顺序（L1）"
file = "specs/stack/java.adoc"
kind = "bullet_tokens"
message = "链式赋值顺序（Java 落点）防线被破坏：{file} 的「链式赋值顺序随字段顺序（L1）」条**本条自己的正文**缺失 {missing}——Java 执行者按栈文件学时仍会随手排；载体是链式 setter 与 builder 链，顺序取字段声明次序"
section = "编码"
min = 6
tokens = [
    "`@Accessors(chain = true)` 的链式 setter",
    "`@SuperBuilder` 的 builder 链",
    "**赋值环节的书写顺序按字段声明次序**",
    "判据本体、判定标准、例外与存量口径见",
    "此处**不复述**",
    "本条**不另定一套顺序**",
]

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_chain_assignment_order_guard]]
file = "specs/stack/java.adoc"
kind = "anchor_count"
bullet = "链式赋值顺序随字段顺序（L1）"
section = "编码"
min = 6
[[guards.check_chain_assignment_order_guard]]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
anchor = ["任何代码活动"]
tokens = ["链式调用**（含链式赋值、builder 链的赋值环节）"]
message = "链式赋值顺序防线被破坏：{file} 的「任何代码活动」条目缺失 {missing}——缺该识别特征时，写链式赋值不会触发加载该条"
[[guards.check_chain_assignment_order_guard]]
file = "specs/stack/java-object.adoc"
kind = "file_groups"
groups = [
    [
        "模板侧照抄约定",
        [
            "赋值环节按字段声明次序",
            "链式赋值顺序随字段顺序",
        ],
        "模板：整段照抄的清单里须给出赋值顺序约定并指回判据本体——模板是新建对象时真正被读的那一份，缺则该约定在照抄时丢掉",
    ],
]
message = "链式赋值顺序（模板）防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 图书馆侧**按那一行核**（`line_tokens`，不是整份文件）：这三条锚点在 `library/adoption.adoc`
# 里各自另有出处（同文件相邻条目含「本集合自己的判据化取舍」「没有任何材料规定」，标题句含
# 「链式赋值顺序随字段顺序」），按整份文件核时把本条整条掏空成一句空话也报不出来。本轮实测：
# 把该条替换成「链式赋值顺序随字段顺序，本集合自己的判据化取舍，没有任何材料规定。」后
# **0 条报红**——防线唯一的机械抓手在图书馆侧是空的。
[[guards.check_chain_assignment_order_guard]]
anchor = ["链式赋值顺序随字段顺序", "本集合自己的判据化取舍"]
file = "library/adoption.adoc"
kind = "line_tokens"
# 锚点同样取**该行内只出现一次**的词：`没有任何材料规定`/`Google Java Style Guide 3.4.2`/
# `用户原文口径` 在 `library/adoption.adoc` 的**别条目**里反复出现（分别 12 处 / 2 处 / 9 处），
# 抽掉本行那句后 token 仍在、只是从别的条目命中——本轮实测这三项逐词删净后**一条都不报**。
tokens = [
    "没有任何材料规定**“赋值环节的书写次序须跟随字段次序”",
    "也**没有**规定“以哪一处为准”",
    "**字段顺序不另定**",
    "**赋值顺序不一致即违规**",
    "**例外只在语义要求时开口**",
    "为什么取“跟随字段顺序”而不是“随书写者方便”",
    "只改了字段、忘了赋值处时不报错",
    "**本项目实证**：用户原文口径为“链式调用时，比如赋值，顺序 和字段、数据库顺序保持一致”",
]
message = "链式赋值顺序防线被破坏：{file} 的该条登记行缺失 {missing}——本集合的取值须如实标注外部材料**未**规定该层（防读者把它读成标准规定），并须给出理由与实证"

# 判据本体侧**按条目自己的正文核**（`bullet_tokens`，不是整节）：「命名与代码质量」一节里
# 相邻条目与本条共用大量字样（「链式赋值顺序随字段顺序」含"字段顺序"与存量边界句、「实体类
# 字段按数据库顺序」含"表列序"、「静态字段排在类最前」含例外句），整节核时这些相邻条目会把
# 从本条抽走的字样**兜住**。锚点一律取**本条 bullet 内只出现一次**的词。
