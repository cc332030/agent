[[guards.check_param_carrier_guard]]
bullet = "不得以键值容器承载方法参数"
file = "specs/general/coding.adoc"
kind = "bullet_tokens"
message = "参数载体防线被破坏：{file} 的「不得以键值容器承载方法参数」条**本条自己的正文**缺失 {missing}——判据被抽走时，「这个参数会变」「字段太多」「只是个内部方法」会把键值容器放回来。每条锚点须在**本条 bullet 内唯一**"
section = "数据契约的载体（数据库实体类不进对外契约）"
min = 11
tokens = [
    "不得以键值容器承载方法参数（L1）",
    "方法参数与返回值的载体是**具名类型**",
    "**字段名、字段类型与必填性都没有落点**",
    "**判定标准（任一命中即违规）**",
    "**已有具名类型或具名先例**",
    "**已有一个等价的具名类型**",
    "**例外与边界（L2）**",
    "**键值集合本身就是要表达的数据**",
    "**仅对该处、该次生效、不得泛化**",
    "改到哪处才顺带调整",
    "随动迁移，见 `specs/core/execution.adoc`",
]

# 同条的**定性**（该条是本集合自己的取舍、不是标准规定）与**依据名**在**节末的依据行**上——
# 那条是独立的 bullet，`bullet_tokens` 取不到它，故另起一步按整份文件核。

# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_param_carrier_guard]]
file = "specs/general/coding.adoc"
kind = "anchor_count"
bullet = "不得以键值容器承载方法参数"
section = "数据契约的载体（数据库实体类不进对外契约）"
min = 11
[[guards.check_param_carrier_guard]]
file = "specs/general/coding.adoc"
groups = [
    [
        "本集合取舍定性",
        [
            "「参数不得以键值容器承载」是本集合自己的判据化取舍",
        ],
        "定性：须如实标明这是本集合自己的判据化取舍（防读者把它读成某标准的规定，从而在'标准没这么要求'时自行放宽）",
    ],
    [
        "坏味道依据名",
        [
            "Martin Fowler《Refactoring》",
        ],
        "依据名：须保留可追溯的出处（该条的坏味道取向取自「数据泥团」；只写名称、不附链接）",
    ],
]
kind = "file_groups"
message = "参数载体防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 加载门：调度器的「任何代码活动」条目须给出识别特征（缺则该条在"要写方法参数"这一场景
# 永远不会被加载——写规则与登记是同一个动作，与 `check_method_placement_guard` 同口径）。
[[guards.check_param_carrier_guard]]
anchor = ["任何代码活动"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "参数载体防线被破坏：{file} 的「任何代码活动」条目缺失 {missing}——缺该识别特征时，写方法参数不会触发加载该条，键值容器仍会被随手用来传参"
tokens = ["要写**方法参数**（决定该参数用什么类型承载）"]

# 『不得新增只做条件取值的方法』（用户提出的「三元」）：用户禁止"新增一个里面只有三元判断
# 取值的方法"——即方法体只剩一处条件取值、只为在一个表达式里挑一个值。
# 要治的失效：这类方法**没有自己的语义**（名字只是把那次挑选复述一遍）、只把同一个取值逻辑
# 从调用点搬了个位置，每次取值都要多跳一次；而「空则取默认值」在标准库/项目自有工具类/
# 已引入工具库（`defaultIfNull`/`defaultIfEmpty`/`emptyToDefault` 一类）里已有现成入口，
# 缺的只是**加一个通用工具方法**（一处定义、全项目复用），不是就地为这一次调用造专用方法。
# 用户原话（本 PR 内）："严禁新增一个里面只有三元判断取值的方法，适应任何语言，有很多类似的
# defaultIfNull defaultIfEmpty 的方法，没有可以加"。提示：该条与登记在 `_tokens.toml`
# 的『三元表达式为最低优先级』同节相邻，按整节核时会把抽走的要点兜住，故**按条目自己的正文核**。
