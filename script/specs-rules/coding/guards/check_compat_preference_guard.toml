[[guards.check_compat_preference_guard]]
bullet = "取兼容性更好的那一个（L1，跨语言）"
file = "specs/general/coding.adoc"
kind = "bullet_tokens"
message = "取兼容性更好的那一个防线被破坏：{file} 的「取兼容性更好的那一个（L1，跨语言）」条**本条自己的正文**缺失 {missing}——该条对应用户提出的要求（同一能力两个及以上等价入口并存时取兼容性更好的那一个、适用所有语言），不得删除、不得降级、不得把取值口径压成一句『注意兼容性』"
section = "警告与弃用"
min = 21
tokens = [
    # 条文与适用范围（效果相同才适用——缺这一半会给"效果不同也硬换"留下口子）
    "**取兼容性更好的那一个**",
    "只在**效果相同**时适用",
    # 完整能力面是取用前提（防"换一个更兼容的写法"做成功能缩水）
    "完整能力面",
    # 前提的整句（只锚四字时，前提句可被抽走而防线报绿，实测）
    "候选者**取不到你想要的那个能力**时不得选它",
    # 取值口径三条与先后次序（可逐条核对：迁移风险 / 两代以上版本支持 / 标准组织）
    "的取值（三条，从先到后，取最先成立的那一条）",
    "**迁移风险更小**",
    "**它同时被两代以上技术栈版本支持**（新旧版本并存期无需二选一、无需按版本配置）",
    "**它的技术支持方是标准组织**",
    # 三条都判不出时的去向（回指既有先例条，不得自成第二套）
    "先例优先，不另立一套",
    # 判据形态（防把"谁更短/更熟"当理由）
    "同一组条件下两个候选各自成立",
    # 判定标准四条（含"新不等于兼容"这一条反向拦）
    "**判定标准（任一命中即违规）**",
    "同一能力在同一处代码里并存两种等价形态",
    "凡是新的就取",
    # 例外三档（③ 是标准组织形态"可径取"的那一半，缺则既有形态被误要求更换）
    "**例外（L2，须写清理由并说明用了哪一条）**",
    "**符合标准的既有形态**与另一候选等价时",
    # 边界与依据行
    "**边界**：只规定取哪一个，**不规定怎么改**",
    # 例外清单的整体边界（缺则「效果差异」与「取不到」两半可整组抽走而防线报绿，实测）
    "**例外（L2，须写清理由并说明用了哪一条）**：① 效果确有差异",
    "② 兼容性更好的一方**在当前依赖面内取不到**",
    # 例外第三档的**适用面**（缺则「已不兼容的旧形态」被误读成"既有形态可径取"）
    "这一档只保「在当前技术栈版本下仍被兼容」的既有形态",
    "ISO/IEC 25010",
    "**「同一能力取兼容性更好的一个」是本集合的判据化取舍**",
]


# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时规范正文一字不少、上面的步骤一次都不报错。
[[guards.check_compat_preference_guard]]
file = "specs/general/coding.adoc"
kind = "anchor_count"
bullet = "取兼容性更好的那一个（L1，跨语言）"
section = "警告与弃用"
min = 21


# 技术栈侧同一待遇的取值落点（Java/Spring 的 `javax`/`jakarta` 两代命名空间选举）。
# 该条是**一跳引用**：取值口径与判定标准只在通用层那一份，栈侧只给本栈的载体与
# "不得把 `javax` 说成被弃用"这一处实证失效形态。
[[guards.check_compat_preference_guard]]
bullet = "校验注解的候选之间取兼容性更好的一方（L1）"
file = "specs/stack/spring.adoc"
kind = "bullet_tokens"
message = "取兼容性更好的那一个防线被破坏：{file} 的「参数校验」节里该条**本条自己的正文**缺失 {missing}——栈侧只作一跳引用（取值口径在 `specs/general/coding.adoc`「取兼容性更好的那一个」），但『不得把 `javax` 说成被弃用』与本栈的取用方向不得被删"
section = "参数校验"
min = 6
tokens = [
    "取 **`jakarta`/新命名空间形态**",
    # 本栈失效形态的两个方向：① 旧命名空间**已不构成正当候选**；② **「未被标记弃用」≠「还可用」**
    "在本栈已不构成正当候选",
    "**已不兼容 `javax` 形态**",
    "**「未被标记弃用」与「还可用」不是一回事**",
    "`specs/general/coding.adoc`「取兼容性更好的那一个」",
    "**效果相同**",
]

# 加载门：调度器的「任何代码活动」条须给出"多个等价入口并存要选一个"这一识别特征
# （缺则写 `@Valid`/`jakarta` 一类取舍时不会触发加载该条——写规则与登记是同一个动作）。
# **核对对象是该行的正文**（`line_tokens`）：识别特征写在「任何代码活动」这一行里，
# 整句被抽走时规范正文一字不少、只靠通用层那条 `bullet_tokens` 发现不了（本仓库实测）。
[[guards.check_compat_preference_guard]]
anchor = ["任何代码活动"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "取兼容性更好的那一个防线被破坏：{file} 的「任何代码活动」登记缺失 {missing}——缺该识别特征时，在两个等价入口之间取舍不会触发加载该条"
tokens = [
    "要**在多个等价入口之间取一个**",
    # 识别特征的**整句**（只锚上面那一枚时，整句可被抽走、加载门退化成一句空话，实测）
    "两代命名空间的同名类型",
]

# 加载门（Spring 侧）：项目存在 Spring 依赖时，写/改参数校验注解即须加载栈文件
[[guards.check_compat_preference_guard]]
anchor = ["Spring 项目"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "取兼容性更好的那一个防线被破坏：{file} 的 Spring 技术栈登记缺失 {missing}——缺该识别特征时，`javax`/`jakarta` 两代命名空间并存时的取舍不会触发加载栈文件"
tokens = ["**校验注解的候选取舍**"]


# 『长方法的反复调用点：在本处加透传』防线（**用户提出**：太长的方法本类多次调用可以先加透传，
# 但很多类都要加时，是换方法名、还是加公共透传）。
# 判据按**本条 bullet 自己的正文**核（`bullet_tokens`）：「代码复用」节相邻条目含
# 「公共方法」「静态工厂方法」「抽离」「重复」等字样，按整节核会把抽走的要点兜住。
# 防的四个失效形态：① 条文的**去向分档**被抽走（跨类重复时又变成"每个类各写一份透传"）；
# ② **判定标准**被抽走（"什么时候算违规"无从判定）；③ **例外与边界**被抽走
# （短调用也被要求加透传、或去改外部 API 的签名）；④ **存量边界**被抽走（等于要求立刻全库补齐透传）。
