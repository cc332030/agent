# 调度器只核**触发特征**（写多层嵌套对象之间的搬运代码时即命中）：`MapStruct` 是
# `java.adoc` 的条目本体专名，通用层与 Java 栈条目都不得把它当识别特征抄进来
# （通用层尤其：它跨语言、不得点名具体库）。
