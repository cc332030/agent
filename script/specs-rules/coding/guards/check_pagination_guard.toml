        "理由：须写明 `convert` 在容器内部替换元素、分页元数据**原样保留**（当前页/每页条数/总记录数/总页数），新建 page 时逐项搬运、漏一项既不报错也不提示——缺理由则本条的级别与处置会被降级",
    ],
    [
        "判定标准（逐条可核对）",
        [
            "自建分页类",
            "不得互改",
            "自我豁免",
