message = "分页查询返回类型与转换防线被破坏：{file}「持久化访问（MyBatis-Plus / JPA 等）」缺失要点 {missing}——{desc}；该条对应用户点名的要求（普通接口 `Result<IPage<Rsp>>`、Feign 接口 `Result<自定义Page<Rsp>>`、转换走 `page.convert` 而不是新建 page），不得删除、不得降级"
