# 调度器只核**触发特征**（要写文档/注释、需要提到某个类型时即命中）：`不写类全名`、
# `包名 + 类名`、`全限定类名`、`classpath` 都是 `doc.adoc`/`java.adoc` 的条目本体取值，
# 抄进调度器即第二真源（`terminology.adoc`「数据字典」的反膨胀）。
[[guards.check_doc_type_notation_guard]]
file = "AGENTS_COMMON.adoc"
groups = [
    [
        "写文档/注释时的类型指代",
        [
            "类型",
            "文档",
        ],
        "文档条目的识别特征：写注释/文档/格式条目须含『要提到某个类型』这一触发面，否则写文档时该条永不被触发加载",
    ],
    [
        "类型指代（Java 栈）",
        [
            "类型指代",
        ],
        "Java 技术栈条目的识别特征：Java 条目须含『类型指代』这一触发面（写 javadoc、要提到一个类时即命中），否则 Java 项目写 javadoc 时该条永不被触发加载",
    ],
]
kind = "file_groups"
message = "文档类型指代防线被破坏：{file} 缺失要点 {missing}——{desc}"

