# ⑤b 与规划层的分工：两条都在"动手前"，各管一头，不得互相顶替。
[[guards.check_spec_driven_guard]]
kind = "line_tokens"
file = "specs/general/planning.adoc"
section = "动手前：现状与最佳方案"
anchor = ["规格与方案分工"]
tokens = [
    "`specs/general/spec.adoc`",
    "不得互相顶替",
]
message = "{file}「动手前：现状与最佳方案」缺 {missing}——规格与方案的分工只写在规格文件里时，读规划规范的人不知道还有这一层：只写方案不写验收标准、或只写规格不写方案与基线，两头都会漏"

# ④b 「写厚」那一头：把"书"的形态钉成可逐行判定的几类。
# 正向锚点只证明"该写的那几句还在"，证明不了"条目一条不少、篇幅翻了几倍"——后者正是
# 本条要治的另一半（把方案、对照表与实现细节搬进去）。五类形态：多级小节、表格、定界块、
# 条目下的子条目、**条目之后又起一段顶格正文**（一条要求跨了段落）。
#
# **核对对象是这份判据本体自己**（`specs/general/spec.adoc`），不是"执行者写的那份规格"——
# 引用方项目里的规格文件**本仓库看不见**，机械侧无从核它。故本条能保证的只有两件：① 这条
# 判据仍在（锚点组）；② 这套规范的示范文本自己就按"一条一条、每句说完"写（本文件里出现
# 小节/表格/代码块/子条目/跨段续写即报红——判据本体先得自己守得住）。**真实项目里那份规格
# 写没写厚**靠文本判据 + 语义复核，不得声称由本仓库机械拦住（与
# `specs-project-maintainer/spec-lifecycle.adoc`「L1 须落在可控对象上」同口径）。
[[guards.check_spec_driven_guard]]
kind = "shape_ban"
file = "specs/general/spec.adoc"
banned = ["subsection", "table", "code_block", "nested_list", "entry_continuation"]
message = "出现了 {hit}——规格写成了说明书：要求按条写、每一条一句说完，方案与论证移去设计文档、对照表与代码块移去模板与用例；条目一条不少而篇幅翻几倍，正是「该写的都写了、写成一本」的那一头"

# ⑤c 本仓库落点：规范条目自己取哪一档（anchored 不落在规范集合身上）。
# 通用条只说"anchored 须项目主动声明"，"本项目声明成什么"落在维护方自查层——两处不是重复：
# 一处给判据、一处给取值。缺这一段时，通用条的默认档没人落实，本项目改规范时会顺手按
# anchored 长期带一份规格，于是同一条要求有了两份长期文本（改一处必漏另一处）。
[[guards.check_spec_driven_guard]]
kind = "section_groups"
file = "specs-project-maintainer/spec-lifecycle.adoc"
section = "本仓库的规范条目取哪一档规格（anchored 不落在规范集合自己身上）"
groups = [
    [
        "默认不取 anchored",
        [
            "默认取 first、不取 anchored（L1）",
            "规范条目本身就是该行为的长期真源",
