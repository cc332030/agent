        ],
        "缺则规格写完之后没有去向：并入的是哪一条说不清，最容易被留下的正是这份规格本身",
    ],
    [
        "无长期载体时才临时 anchored",
        [
            "只有\"还没有长期载体\"时才允许临时 anchored（L2）",
            "写清它将来的常驻地",
            "指不出将来的落点",
        ],
        "缺则临时 anchored 没有终点：挂着它却说不清将来归到哪一节，等于按默认档留下一份没人维护的规格",
    ],
    [
        "不改准入与定级",
        [
            "不改准入与定级（L1）",
            "两者不得互相顶替",
        ],
        "缺则规格档被读成准入与定级的替代：一条规则还是不是该收、定哪一级没人判，级别与准入重新回到凭感觉（与「规格与方案分工」同一条边界）",
