# ⑥ 加载门：调度器登记 + 识别特征（缺则该条永远不会被触发加载——规则在、没人读到）。
[[guards.check_spec_driven_guard]]
kind = "file_tokens"
file = "AGENTS_COMMON.adoc"
tokens = [
    "specs/general/spec.adoc",
    "要定需求与验收标准",
    "拿不准该写到什么程度",
]
message = "{file} 的通用层未按名登记 {missing}——缺则《规格》不会被触发加载（用户要求接入的这套规则在加载这一步就已落空）"

# ⑦ 公开面同步：读者按 README 学习时须知道有这条规则。
[[guards.check_spec_driven_guard]]
kind = "file_tokens"
file = "README.adoc"
tokens = [
    "`spec.adoc`",
    "验收标准",
]
message = "{file} 的目录说明未登记 {missing}——公开面看不见这条规则，等于它只对读全库的人生效"
