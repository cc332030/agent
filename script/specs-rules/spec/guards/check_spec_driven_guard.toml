# 『规格（spec driven）』防线（**用户提出**：接入 spec 规范）。
#
# 判据本体唯一落点＝通用层 `specs/general/spec.adoc`——**公共内容**（对任何语言、任何项目
# 成立）。本节防的失效有两头，都是"没人看得见"的那种：
#   ① **该写不写**：需求只在对话里，执行者按自己理解补全缺口——交付出来的东西与发起人想的
#      不是一件事，而两边的差异在文本上分辨不出来（没有一条可判定的验收标准可对照）；
#   ② **不该写硬写**：把"spec 驱动"读成"每件事都要新开一份规格文档"，小改动也产出一叠
#      没人读、没人维护的 markdown——比没有规格更坏：它留下一份与代码背离的第二份说明书。
#
# 故本条钉三类取值，缺任一类这条规则都会滑向其中一头：
#   * **写到什么程度**（每条要求要有验收标准 + 只到行为面 + 可定位 + 不复制既有内容）；
#   * **什么时候写**（三档按行为影响面取：免规格 / 轻规格 / 完整规格，且"文档先行"不等于
#     "每件事新开一份文档"）；
#   * **维护深度与去向**（默认只服务本次任务、anchored 须项目声明、as-source 默认不做、
#     收尾须有去向）。
# **"按规模分档、只到行为面、默认 first"是本集合的判据化取舍**，外部标准只给"需求须单一、
# 无歧义、可验证、可追溯"的下限（ISO/IEC/IEEE 29148）——写法与取舍见文件自身依据行。

# ① 判据本体：写到什么程度（内容与判据）。
[[guards.check_spec_driven_guard]]
kind = "section_groups"
file = "specs/general/spec.adoc"
section = "规格写到什么程度（内容与判据）"
groups = [
    [
        "一条要求一项验收标准",
        [
            "一条要求一项验收标准（L1）",
            "都要有对应的验收标准",
            "不得作为要求进入规格",
            "只是愿望、不是要求",
        ],
        "缺则规格退化成愿望清单：写不出可观察结果的要求（『体验更好』『尽量快』）照样进规格，谁都没法判它满足没有",
    ],
    [
        "只写到行为面",
        [
            "要求只写到行为面（L1）",
            "不写实现方案",
            "即越界",
        ],
        "缺则规格滑成设计文档：类与表结构、算法与依赖选型写进来，方案一改规格就过期，读者也不再知道以哪一份为准",
    ],
    [
        "每条要求可定位",
        [
            "每条要求可定位、可被引用（L1）",
            "稳定标识",
            "不随重排变化",
        ],
        "缺则『这条要求实现到哪、由哪条用例验』无从追溯——用例与提交说明指不回要求，可追溯只挂在嘴上",
    ],
    [
        "不复制既有内容",
        [
            "不复制既有内容（L1）",
            "只引名称与落点",
            "同一件事就有两处来源",
        ],
        "缺则规格把代码与既有文档抄一遍：两处来源各改各的，判据与实现一并漂移（规格是最容易被写厚的产物）",
    ],
    [
        "一条要求一句说完",
        [
            "一条要求一句说完（L1）",
            "不许跨段落",
            "不按页数与字数计",
            "处置方向是移动不是删",
        ],
        "缺则「写厚」这一头无人拦：判据被压成一句「要简洁」时，同一条要求跨多段、搜索与试错过程一起长进规格，读者要跳读才点得出『要求是什么』——而『要求一条不少』照样成立（本条治的正是『该写的都写了，但写成一本说明书』）",
    ],
]

