        ],
        "缺则本项目改规范时按 anchored 长期带一份规格：规范条目已是该行为的长期真源，再带一份就是同一件事的第二个长期文本，两份必然开始漂移",
    ],
    [
        "去向是并入那一条",
        [
            "规格的去向就是它要改的那一条（L1）",
            "并入被改的那一条规范条目",
