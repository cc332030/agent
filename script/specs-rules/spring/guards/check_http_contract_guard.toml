        ],
        "适用范围：契约接口那几条以项目使用声明式 HTTP 客户端为前提，须写明未使用者不适用——缺则没用声明式客户端的 Spring 项目会把契约条当成通用必做（误伤面）",
    ],
    [
        "控制器显式声明 HTTP 方法",
