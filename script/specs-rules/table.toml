# 表格行形态防线：AsciiDoc 表格行**不得以 `|` 收尾**。
#
# 为什么需要它：`check_asciidoctor_syntax` 是确定项，但它在"本机装不出 `asciidoctor`"时
# 报错而不报出问题（本仓库实证：本机长期没有处理器，遍历全部 `.adoc` 的那一段从未真的
# 跑过），于是行尾多出的一个 `|` 安静地留在 `guards.adoc` 的清单表里：
#   ① 编译告警 `dropping cells from incomplete row detected end of table`；
#   ② **整表单元格错位**——AsciiDoc 把行尾那个 `|` 读成"多一个空单元格"，
#      行内单元格流随之整体偏移（实测：一行多一个 `|` 会让同一次编译里位于其后的一行
#      也报同一句告警，排查时看的行号都不是真凶）。
# 而它**不会被任何按文本核锚点的检查发现**（文本一字不少、锚点全在）。
#
# 判据**与处理器版本无关**（不需要装 asciidoctor 就能核）：表格行以 `|` 收尾即报红；
# 行内相邻单元格之间照旧写 ` | `。**行尾那个 `|` 之后的行内注释（`// ...`）与硬换行
# 标记（`+`）先剥掉再看正文**——实测 `asciidoctor 2.0.26` 对这三种写法报的是同一句
# `dropping cells from incomplete row detected end of table`，只核"裸行尾管道"会漏放后两种。
# 只核这一种形态——"表格该有几列""某行是不是漏写了一个单元格"仍由
# `check_asciidoctor_syntax` 编译验证承担（那是语义性的，机械核会误伤）。
#
# 覆盖范围**不外列清单**：引擎按"维护范围内的全部 .adoc"取（与语法编译段同一处收集实现），
# 本文件再列一份维护根就是第二真源——改一处必漏另一处。
#
# **无存量豁免、也不需要**：判据核的是**残缺行**（AsciiDoc 明确读成"多一个空单元格"），
# 不是风格取向——**任何合法写法都不会以行尾管道收尾**（收尾的那个管道就是多出来的那一个）。
# 本仓库当前存量实测：0 处命中（规则生效前已全部修净）。
[[guards.check_table_row_pipe_guard]]
kind = "table_row_pipe"
message = "{file}:{line} 的表格行以 `|` 收尾——AsciiDoc 会把它读成**多出一个空单元格**的残缺行：编译报 `dropping cells from incomplete row detected end of table`，整表的单元格还会随之错位。表格行**行尾一律不写 `|`**，行内相邻单元格之间写 ` | `"
