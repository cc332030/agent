# 用户要求是第一优先级、不得降级；做不到就停下来问（用户提出，最高关注项 P8）。
# 判据本体唯一落点＝必加载层 `specs/core/execution.adoc`「指令执行」的那条 bullet；
# 另两处是**登记**（公共入口「最高优先级铁律」的进门必读一行、维护方不可降级清单 P8）。
# 核的是**判据本体**：光核"这条还在不在"会被相邻条目的字样兜住——"用户要求排第一位、
# 做不到就停下来问、不得自行降级"这三件必须落在这条 bullet 自己的正文里。
# "某次交付是不是真的降级了、卡点是不是真的提给了用户"属运行时事实与语义判断，
# 交人/子 agent 复核（见 GUARD_CHECK_LIMITS）。
