[[guards.check_user_requirement_guard]]
bullet = "用户要求是第一优先级"
file = "specs/core/execution.adoc"
kind = "bullet_tokens"
message = "用户要求不可降级防线被破坏：{file}「指令执行」缺失要点 {missing}——{desc}（该条的**正文**须自带这些要点，被抽空或搬进相邻条目即等于失效）"
section = "指令执行"
tokens = [
    "用户要求是第一优先级，不得降级；做不到就停下来问（L1，最高关注项 P8）",
    "排在其余一切约束之前",
    "用例全部通过",
    "都不构成",
    "做不到或做不全时只有一条正确动作",
    "终止当前方向",
    "把可选做法与各自的代价交给用户定",
    "**判定标准（任一命中即违规）**",
    "弱于",
    "削掉或绕开",
    "说成已完成/已按要求完成",
    "已知限制",
    "反复重试",
    "重试不构成",
    "先宣告做不到而不做任何尝试",
    "与「歧义先问、不自行假设」的分工",
    "要求读准了却做不到/做不全",
    "**依据**",
    "本集合自己的取舍",
]

# 入场核：核**锚点清单自己的条数**——清单被删项时那条 bullet 一字不少、上面的步骤一次都不
# 报错（"核过且通过"与"没核"从此无从区分）。删锚点须与调 `min` 一并发生。
[[guards.check_user_requirement_guard]]
bullet = "用户要求是第一优先级"
file = "specs/core/execution.adoc"
kind = "anchor_count"
min = 19
section = "指令执行"

# 最高关注项清单的登记行（不可降级清单里的一处回指）。核的是**清单里列着 P8 且它指向那条
# bullet 的落点**——只核"P8"两个字会被别的字样兜住，故连"指向落点"一起核。
[[guards.check_user_requirement_guard]]
file = "specs/core/execution.adoc"
groups = [
    [
        "最高关注项清单登记 P8",
        [
            "用户要求是第一优先级、不得降级（L1 最高关注项 P8）",
            "排在其余一切约束之前",
            "停下来问用户",
            "完整定义见本文件「指令执行」",
        ],
        "最高关注项清单须登记 P8 并指向那条 bullet 的完整定义（缺则该条在重构/去重时无『不可降级』保护，且清单读不出它指向哪一处定义）",
    ],
]
kind = "file_groups"
message = "用户要求不可降级防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 公共入口「最高优先级铁律」的进门必读登记。核的是那一行**自带判据形态**（不停下来问就
# 降级＝违规）并**回指权威定义节名**——只核"提了一句用户要求"时，读者读不到"做不到该停下
# 来问"这一动作，铁律行只剩一句口号。
[[guards.check_user_requirement_guard]]
file = "AGENTS_COMMON.adoc"
groups = [
    [
        "进门必读登记 P8",
        [
            "用户要求是第一优先级、不得降级（最高关注项 P8）",
            "排在其余一切约束之前",
            "都不得",
            "不得自行把要求削掉、收窄或替换",
            "停下来问用户",
            "`specs/core/execution.adoc`「指令执行」",
        ],
        "「最高优先级铁律」须登记 P8 并回指权威定义（进门必读，缺则下次会话读不到；只写一句『用户要求优先』而不写『做不到就停下来问、不得自行降级』时，铁律行读不出应对动作）",
    ],
]
kind = "split_block"
message = "用户要求不可降级防线被破坏：{file} 的「最高优先级铁律」缺失 {missing}——{desc}"
split_by = "== 最高优先级铁律（先读）"

# 维护方不可降级清单 P8。核的是条目**自带判据**（要求 + 依据 + 判定标准 + 失效形态）——
# 只核"P8 标题还在"时，正文被抽空照样全绿。
[[guards.check_user_requirement_guard]]
file = "specs-project-maintainer/priority.adoc"
groups = [
    [
        "P8 级别与依据",
        [
            "要求（L1，最高",
            "**依据**",
            "不得由执行者单方降级",
        ],
        "P8 须标明级别 L1、最高，并保留依据行（级别不得静默改动、依据不得整段删除）",
    ],
    [
        "P8 判据本体",
        [
            "做不到或做不全时不得自行收力",
            "由用户裁决",
            "判定标准（维护方侧逐条核）",
            "交付的边界比用户要求窄、而用户并不知情",
            "同一条路走不通仍反复重走、不回头问",
        ],
        "P8 须自带可逐条核对的判定标准（只留一句原则则本条自身也是口号）",
    ],
    [
        "P8 失效形态",
        [
            "失效形态",
            "闷头照自己的方案做",
            "悄悄把用户要求降一档",
            "直到用户逐字追问才暴露",
        ],
        "P8 须写明失效形态（不把卡点提出来、悄悄降档、汇报仍写已完成）——缺则本条只剩『要重视用户要求』，重演时无人对得上",
    ],
]
kind = "regex_section"
label = "P8."
message = "用户要求不可降级防线被破坏：{file} 的 P8 缺失 {missing}——{desc}"
pattern = "^=== P8\\..*?(?=\\n=== |\\Z)"

# 检查修复提示词侧：`review.adoc` 的第 3 步本就写着「无争议的、直接修复、无需确认」——
# 它与通用口径的例外条**必须是同一条界线**，否则"无争议"三个字各读各的：review 那侧按
# "我看着没问题"直接改，通用口径那侧却在等确认。
[[guards.check_user_requirement_guard]]
file = "prompts/_common.txt"
groups = [
    [
        "priority-rules 片段的用户要求半句",
        [
            "用户要求是第一优先级、不得降级（L1，最高关注项 P8）",
            "做不到或做不全时终止当前方向并停下来问用户",
            "不得**自行把要求削掉、收窄或替换",
            "specs/core/execution.adoc",
        ],
        "`priority-rules` 片段须带同口径半句（用户要求第一优先级 + 做不到就停下来问 + 回指判据本体）——片段会被未知项目复制执行，漏了这层则复制出去的那份没有这条（判据本体在必加载层，此处只须出现且回指）",
    ],
]
kind = "file_groups"
message = "用户要求不可降级防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 猜到的行为不是指令：可以猜，但猜出来的那一步不得直接执行，须先报、待人工确认（**用户明确要求**）。
# 用户原话：「可以猜我的行为，但是不要直接执行，需要人工确认」，且「这一句不止是说提交」——
# 它是一条约束"我该怎么干活"的**通用规则**，不是某一处的改法。
# 判据本体唯一落点在通用层 `specs/general/planning.adoc`「猜到的行为先报、待人工确认」；
# 必加载层 `specs/core/execution.adoc`「指令执行」只留**底线与回指**（常驻层只放 L1 底线，展开与
# 依据论证按 `specs-project-maintainer/spec-lifecycle.adoc` 归通用层；复述会各自漂移、也会被
# 判为重复而合并删除）。`specs/general/git.adoc`「分阶段交付（大任务）」与 `prompts/_common.txt`
# 的 `delivery` 片段是**同口径落点**——前者是"顺手多走一步"最常发生的地方，后者会被未知项目复制执行。
# 核的是**判据本体自己的正文**：相邻条目（「歧义先问」「逐字执行用户指令」）字样相近，
# 按整节核会把被抽走的要点兜住。"某次到底有没有先报、有没有等确认"属运行时事实与语义判断，
# 交人/子 agent 复核（见 GUARD_CHECK_LIMITS）。
