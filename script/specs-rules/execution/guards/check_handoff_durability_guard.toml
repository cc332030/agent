# 提示词公共片段侧（会被复制到未知项目执行）：`baseline-and-compat` 片段须带同口径一条——
# 片段里只写"规划落盘"时，"落在哪个目录、怎么排布"在复制出去的那份里落不到任何一条。
# 判据本体给的是"怎么分"，目录形态给不出时执行者仍要每轮现编一个目录名（编一次漂一次），
# 故这一段一并核**目录树形态**。`kind` 用 `file_tokens`（不切块）：
# 任何切分串都会把这段判据自己写进被切掉的那一侧（本仓库实证：锚点自身的字样在正文里命中、
# 切出来的段从下一处起，判据当场空转）。
#   * 形态块以 `----` 定界写；`PLAN.md` / `progress.md` 是最简两件套（规划与进度分家）；
#   * **副本与产出的两级目录名拆成两枚锚点**：整串当锚点时，锚点自身也会在这段注释里命中，
#     核对面形同自证（本仓库实证过的假绿形态）。
