# 『tmp/ 的布局与命名』——用户提出：每一项任务都要文档先行、规划先行，规划与过程落在 tmp/ 并
# 实时更新、新任务即时补进去；**tmp/ 下的文件也要走规划、避免乱丢乱放**；单次小任务/新项目/
# 大规模重构流程不同，问"怎么兼容"；要下载其他多个项目源码、分析其他项目时，源码与分析产出
# 又放哪、参照业界规范。
# 落点选在 `specs/core/execution.adoc`「临时产物」的**子节**里（新增一份文件会给常驻层再加一份
# 无条件成本，而这件事本就是那一条的取值细化）；分档**不自立第二套**——档位与各档取值回指
# `specs/general/verify.adoc`「验证的适用边界」与 `specs/general/planning.adoc`。
# 核的是**判据本体**：布局四类、任务目录可定位、进度实时更新、副本与产出分开、分档只改形态。
# "这次任务把文件放对了没"属运行时事实，交人/子 agent 复核（见 GUARD_CHECK_LIMITS）。
