# 必加载层的底线：核**那条 bullet 自己的正文**——它被删掉、或回指被摘时，
# 每次工作都加载的那一层就读不到这条，只剩通用层、要触发才加载。
[[guards.check_guess_confirm_guard]]
bullet = "猜到的行为不是指令"
file = "specs/core/execution.adoc"
kind = "bullet_tokens"
message = "『猜到的行为先报、待人工确认』的必加载底线被破坏：{file}「指令执行」缺失要点 {missing}——{desc}"
section = "指令执行"
tokens = [
    "猜到的行为不是指令：先报、待人工确认（L1）",
    "**可以猜，但猜出来的那一步不得直接执行**",
    "须报、须等人工确认",
    "只有一种正确修法、且不改判任何既有取值的客观错误",
    "`specs/general/planning.adoc` 的同一主题",
    "本条只留底线与回指",
]

# 入场核：核**锚点清单自己的条数**——清单被删项时那条 bullet 一字不少、上面的步骤一次都不
# 报错（"核过且通过"与"没核"从此无从区分）。删锚点须与调 `min` 一并发生。
[[guards.check_guess_confirm_guard]]
bullet = "猜到的行为不是指令"
file = "specs/core/execution.adoc"
kind = "anchor_count"
min = 6
section = "指令执行"

# 交付链侧：git 规范的分阶段交付须带两组同口径条——
# ① 「猜不得授权」半条（「只到提交 + 推送 + 建 PR」最容易被读成「顺手多做一步」的许可）；
# ② 判据先取、先例不是授权、降级不成立并须停下问（这两条只写在 `delivery` 片段里时，
#    规范侧的交付链读不到它们——片段那一侧写全了不等于本体写全）。
# **按节取文本**：同一串字（`提交 + 推送 + 建 PR`）在本文件别处也出现，按整份文件核会把
# 「从本节删掉」读成齐备。
[[guards.check_guess_confirm_guard]]
file = "specs/general/git.adoc"
kind = "section_groups"
section = "分阶段交付（大任务）"
groups = [
    [
        "分阶段交付的猜不得授权半条",
        [
            "按\"猜\"多走一步同样不行（L1）",
            "不是\"顺手多做一步\"的许可",
