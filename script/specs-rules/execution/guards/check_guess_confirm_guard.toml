    ],
    [
        "判据先取、先例不是授权",
        [
            "判据先取，且先例不是授权（L1）",
            "判据是**执行环境**",
            "不构成授权",
            "不覆盖交付授权",
            "同样属自动化场景",
            "判不出时按自动化场景取严",
            "**判定标准（任一命中即不合规）**",
