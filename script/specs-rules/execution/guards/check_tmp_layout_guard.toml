# 持久落点那一侧（判据本体在 `specs/general/entry-doc.adoc`「交接：什么必须扛过中断」）。
# 与上一步**分工**：上一步核"索引怎么写"（`tmp/` 根一行一条、判据是不用打开文件），
# 这一步核"索引易失之后靠什么接上"——两类内容必须分开，否则索引会被当成持久载体。
# 用户口径：中断后上一轮写在 `tmp/` 下的东西直接失效，多 agent 接替**浪费时间与成本**。
[[guards.check_tmp_layout_guard]]
file = "prompts/_common.txt"
kind = "file_tokens"
tokens = [
    "规划与进度落在 `tmp/`、按用途排布（L1）",
    "一级按用途分",
    "规划文档与进度记录分开放",
    "新发现的待办即时补进规划",
    "源码副本与我们的分析产出分开放",
    "specs/core/execution.adoc",
    "PLAN.md",
    "progress.md",
    "vendor/",
    "analysis/",
    "INDEX.md",
    "接替者只读 `tmp/INDEX.md` 就接得上",
]
message = "提示词公共片段缺失 `tmp/` 布局那一条或其目录形态 {missing}——片段会被未知项目复制执行，漏了这层则复制出去的那份只在判据本体里有、执行者读不到；形态块缺项则目录名每轮现编、编一次漂一次"

# 『完成＝按任务要求走到最后一步、并逐条核对每一步』（用户点名：不得做一部分就再问用户
# 是否继续——"xx任务已完成，剩余xx，要继续请跟我说"这类收尾按未完成判）。
# 失效形态：部分 agent 预设了"按步骤提示"，执行者在步骤中途收尾、把"要不要继续"交回用户，
# 而任务本身既没被阻塞、也没做完——这与「用户要求是第一优先级」不是同一条（那条管
# "做不到就问"，本条管"做得到却没做完"），故须单列一道防线。
#   * `kind = "section_groups"` 是**表级**字段（表内第一步用）——两步同表、只声明一次；
#     两条 `kind` 各在表内的**第一个** `[[guards.…]]` 里给出（上一步给 `section_groups`、本步给 `split_block`）。
