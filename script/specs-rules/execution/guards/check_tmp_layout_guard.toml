# 『索引长什么样、并行时怎么取行』——判据本体在通用层 `specs/general/entry-doc.adoc`
# 「`tmp/` 索引的形态与并行取值」，本步只核它还在不在。
# 为什么必须单列：上一步管的"一行一个任务"只回答了**单线**；并行时四个取值（行按任务
# 还是按任务单、多任务共用一分支时怎么区分、谁改哪一行、索引要不要配合并策略）**一个都没答**，
# 于是并行任务照旧把索引写成流水账、两个执行者撞同一行。
