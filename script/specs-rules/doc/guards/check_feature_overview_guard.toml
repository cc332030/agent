# 『功能全览』防线：用户口径（Issue）——「我的目的是需要有个项目的功能全览（包括细节），
# 不是用户的需求流水账」。失效形态不是"没写这份东西"，而是**写成了事件流**：条目按时间/编号排、
# 同一功能散在多条里、要答"它还在不在"只能回溯任务单——那时它看起来是一份完整文档，
# 却正好承担不了"项目现有行为"这一职责。故锚点取**正向的形态要求**与**反向的禁令文本**两面。
[[guards.check_feature_overview_guard]]
file = "specs/general/doc-lifecycle.adoc"
section = "功能全览（项目现有行为的唯一视图）"
groups = [
    [
        "产物＝按功能组织的全览，不是需求事件流",
        [
            "产物＝按功能组织的全览，不是需求事件流",
            "不是以需求、Issue、时间或提交为条目",
            "现在的样子",
            "不得被当作全览",
        ],
        "职能归属（L1）：须以**功能**为条目、写它现在的样子，并写明需求事件流（发布说明/变更日志/逐轮记账）不承担这一职责、也不得被当作全览——只写「要有一份全览」时，一份按 Issue 顺序排的清单同样满足它，而这正是本条要拦的形态",
    ],
    [
        "每项须能定位到实现与反证",
        [
            "每项须能定位到实现与反证",
            "落点",
            "能反证它还在的判据",
            "specs/general/spec.adoc",
            "specs/general/testing.adoc",
        ],
        "可追溯（L1）：每项须给出实现落点与能反证它还在的判据，并**回指**验收标准的真源（spec）与覆盖要求的真源（testing）——判据本体不在这里再写一份（两份必然漂移）；缺回指即这一条自己长成了第二份来源",
    ],
    [
        "细节按归属分写，全览只做入口",
        [
            "细节按归属分写，全览只做入口",
            "specs/general/doc-design.adoc",
            "信息归属",
            "逐方法的参数表",
        ],
        "不膨胀、不越界：功能级事实写全览，类/方法级细节仍按「信息归属」落代码文档注释与设计文档；须给出越界的判定形态（出现逐方法参数表或实现过程），否则「详细」会被读成「什么都往里写」",
    ],
    [
        "行为变了就同一提交内改全览",
        [
            "同一提交内改全览",
            "同一提交内",
            "移除功能须在全览里显式处置",
            "全览过期比没有更坏",
        ],
        "时效与显式处置（L1）：增删改功能须同一提交内同步全览，**移除**须显式处置（删条目并写明去向或标记已移除及理由）——不写这一条时，删掉的实现留下一条仍然成立的描述，比没有更坏",
    ],
    [
        "落点与形态",
        [
            "落点与形态",
            "specs/general/doc-module.adoc",
            "全局文档与模块文档的分界",
            "分份须按功能边界分",
        ],
        "落点与分份：按「全局文档与模块文档的分界」取值（跨模块进项目根 `doc/`、只属某模块进该模块 `doc/`、根全览只引一行入口），且**分份只按功能边界**——按时间或改动批次分份会把事件流从后门放回来",
    ],
]
kind = "section_groups"
message = "功能全览防线被破坏：specs/general/doc-lifecycle.adoc「功能全览（项目现有行为的唯一视图）」缺失要点 {missing}——{desc}；该条对应用户口径『要有个项目的功能全览（包括细节），不是用户的需求流水账』，不得删除、不得降级为建议"

[[guards.check_feature_overview_guard]]
file = "script/check_effective.py"
anchor = ["check_feature_overview_guard", "功能全览"]
tokens = [
    "check_feature_overview_guard",
    "功能全览",
]
kind = "line_tokens"
message = "功能全览防线未登记：{file} 里凡提到 `check_feature_overview_guard` 的行都须同时写明『功能全览』（缺 {missing}）——台账不登记即这条判据在「定义了但没人跑」的清单里看不见"

[[guards.check_feature_overview_guard]]
file = "AGENTS_COMMON.adoc"
anchor = ["文档的组织形态", "功能全览"]
tokens = [
    "功能全览",
]
kind = "line_tokens"
message = "功能全览防线未进调度器：AGENTS_COMMON.adoc 里提到「文档的组织形态」的那一行须同时写明『功能全览』（缺 {missing}）——判据写得再全，加载调度器上找不到入口，写到需要它的那一刻也不会被想起来"

