file = "README.adoc"
anchor = ["doc-lifecycle.adoc", "功能全览"]
tokens = [
    "功能全览",
]
kind = "line_tokens"
message = "功能全览防线未进公开面：README.adoc 里提到 `doc-lifecycle.adoc` 的那一行须同时写明『功能全览』（缺 {missing}）——公开面是引用方唯一看得见的目录说明，漏登记即这份判据只在本仓库里成立"
