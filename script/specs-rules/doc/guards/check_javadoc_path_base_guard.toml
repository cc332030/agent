        "理由之二：须保留'项目根相对在 IDE 里可解析'——只留模块根一侧会把项目根这条推荐删掉（用户口径是两处都推荐）",
    ],
    [
        "英文双引号包裹（用户点名的写法）",
        [
            "英文双引号",
            "failOnError",
            "不必改成 `<a href>` 链接形态",
        ],
        "双引号：须写明 `@see` 的文档路径用**英文双引号包裹**（用户点名的写法），并写明裸 `@see doc/...` 会被当成员引用解析、`failOnError` 中断构建；加引号后即为合格的文本引用、**不必改成 `<a href>` 链接形态**",
    ],
]
kind = "file_groups"
message = "javadoc 文档路径基准防线被破坏：{file} 的「javadoc」条缺失 {missing}——{desc}"


# 通用层「引用路径」的 javadoc 基准：平台无关的那一条（Java 落点之外的引用方按通用层学习）。
[[guards.check_javadoc_path_base_guard]]
file = "specs/general/doc.adoc"
# **只核「引用路径」节自己的正文**（不核整份文件）：同文件别处另有同样的字样
# （`doc-module.adoc` 一侧的回指、本节之外的说明），按整份文件核时把本节抽空、
# 只留标题仍会全绿——本仓库实测的失效形态。该节是三级节（`=== 引用路径（一切引用）`）。
subsection = "引用路径"
kind = "file_tokens"
tokens = [
    "项目根或模块根相对",
    "推荐、非必须",
    "不限制被引用文档的存放路径",
    "项目根与模块根两处都推荐",
]
message = "javadoc 文档路径基准防线被破坏：{file}「引用路径」缺失 {missing}——通用层是引用方按平台无关口径学习的那一处，缺则只有 Java 栈层有这条推荐、按通用文档规范读的执行者会读成强制或读不到"
