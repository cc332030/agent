# 『记录只落项目文档，不进任何"记忆"类载体』防线（**用户提出**）。
#
# 用户口径：『不允许记到项目记忆、临时记忆、长期记忆或者其他类型，一定要记到
# 项目文档里』。
#
# 要治的失效：内容**看起来已经留下来了**——"已记进项目记忆/长期记忆/知识库"，于是没人再去
# 写文档；而那类载体**不在项目里**，换台机器、换个账号、换个工具就取不到，下一位执行者与
# 人都只拿到这个项目。它与"只留在会话上下文里"是同一成因的两种载体：内容落在**读的人拿不到
# 的地方**，而写的人以为已经交付。
#
# 判据本体落通用层 `specs/general/doc.adoc`「注释与文档」（记录内容落在哪一层，本属文档规范）；
# 另核四处承接面：持久结论那条的落点（`specs/general/context.adoc`）、调度器识别特征
# （`AGENTS_COMMON.adoc`）、提示词公共片段（会被复制到未知项目执行）、公开面（`README.adoc`）。

# ① 判据本体：落点、判定标准、边界与其反面（为什么只能是项目）。
[[guards.check_no_memory_store_guard]]
file = "specs/general/doc.adoc"
section = "注释与文档"
kind = "section_groups"
groups = [
    [
        "落点与级别",
        [
            "**记录只落项目文档，不进任何\"记忆\"类载体（L1）**",
            "一切要留存的内容**一律写进项目自身**",
        ],
        "条文：须有该条并标 L1，且把落点写死成**项目自身**——只写『要存档』时，存档动作落在哪个载体上没有约束，『记进记忆里』照样算做过",
    ],
    [
        "点名的载体类型（含『其他类型』）",
        [
            "项目记忆",
            "临时记忆",
            "长期记忆",
            "工具以别的名目提供的知识库、长期存储、自定义指令一类容器",
        ],
        "载体清单：须逐类点名（项目记忆/临时记忆/长期记忆）并含『其他类型』那一面——只拦这三种名字时，换个名目（知识库、长期存储、自定义指令）就绕过去了，而用户那句正是『或者其他类型』",
    ],
    [
        "判定标准三条",
        [
            "判定标准（任一成立即不合规）",
            "内容只存在于记忆类载体里，项目里找不到对应落点",
            "以\"已经记住了\"",
            "把记忆类载体当成比项目文档更权威的真源",
        ],
        "判定标准：须三条都可核对——『只记在那里、项目里没有』『以已经记住了为由不写』『把它当成比项目文档更权威的真源』；缺第三条则两者不一致时会照着记忆改文档（真源反向）",
    ],
    [
        "边界：管落点、不禁用其存在",
        [
            "本条管的是**落点**，不是禁用它存在",
            "可以作为**同一份内容的附带副本**",
            "但**不得是唯一落点**",
        ],
        "边界：须写明本条管**落点**、不是禁用它存在（副本允许、唯一落点不允许）——缺则本条会被读成『一律不许用这类功能』，与『工具怎么配』无关的事也被判违规",
    ],
    [
        "与临时产物的分界",
        [
            "会话上下文、`tmp/` 一类临时产物本来就不是持久落点",
            "`specs/core/execution.adoc`「临时产物」",
            "不在此列",
        ],
        "分界：须写明会话上下文与 `tmp/` 本来就不是持久落点、不属本条——否则本条会被读成『连 tmp/ 也不许写』，与临时产物的整套布局相抵",
    ],
    [
        "为什么只能是项目（可核对的反面）",
        [
            "换台机器、换个账号、换个工具就取不到",
            "读它的人（下一位执行者、人、另一个工具）手里只有这个项目",
        ],
        "理由：须给出可核对的一句（换机器/账号/工具即取不到、读的人手里只有这个项目）——只写『统一记文档』时，它读起来像排版偏好，遇到『记住更方便』就让位",
    ],
    [
        "依据行",
        [
            "ISO 10007",
            "ISO/IEC/IEEE 29148",
        ],
        "依据：须给标准名/编号（配置项的来源须单一受控、要求须可追溯并被独立理解）——缺则本条成了本集合自造的偏好",
    ],
]
message = "『记录只落项目文档』防线被破坏：{file}「注释与文档」缺失要点 {missing}——{desc}；该条对应用户口径（不允许记到项目记忆/临时记忆/长期记忆或其他类型，一定要记到项目文档里），删掉或降级后『已经记住了』照旧被当成已交付，而项目里查不到任何东西"

# ② 持久结论那条的落点：`context.adoc` 的「结论交给持久文档与规范」须带同一口径。
[[guards.check_no_memory_store_guard]]
file = "specs/general/context.adoc"
kind = "file_tokens"
tokens = [
    "也不得只记进项目之外的\"记忆\"类载体",
    "specs/general/doc.adoc",
]
message = "『记录只落项目文档』防线被破坏：{file} 的「结论交给持久文档与规范」缺 {missing}——该条是『结论往哪落』的第一现场，缺这一句时它列出的落点全是项目内的，读者仍会把『记进记忆』当成同类落点"

# ③ 调度器识别特征：没有它，这条判据永远不会被加载（规则在、却没人读）。
[[guards.check_no_memory_store_guard]]
file = "AGENTS_COMMON.adoc"
kind = "file_tokens"
tokens = [
    "要留档",
]
message = "『记录只落项目文档』防线被破坏：{file} 的调度器「注释与文档」一行缺识别特征 {missing}——缺则『要留档』这类场景不会触发加载，判据写了也不会被读到"

# ④ 提示词公共片段：片段会被复制到未知项目执行，只写在判据本体里那一份执行者读不到。
[[guards.check_no_memory_store_guard]]
file = "prompts/_common.txt"
kind = "file_tokens"
tokens = [
    "也不得只记进项目之外的\"记忆\"类载体",
    "specs/general/doc.adoc",
]
message = "『记录只落项目文档』防线被破坏：提示词公共片段缺 {missing}——片段与判据本体分处两地，片段里没有这一句时，复制出去执行的那一份只列项目内落点、『记进记忆』无从判为不合规"

# ⑤ 公开面：引用方从目录说明就要看得出有这条判据。
[[guards.check_no_memory_store_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "记录只落项目文档（不进项目之外的\"记忆\"类载体）",
]
message = "『记录只落项目文档』防线被破坏：{file} 的目录说明缺 {missing}——缺则引用方只在正文里看得到这条判据，目录层读不到它存在"
