# 『javadoc 文档路径基准』防线（`specs/stack/java.adoc`「javadoc」）：
# 用户口径（Issue）——**不限制文档路径，`@see` 的目标推荐放项目根与模块根两处**。
# 失效形态是"口径被改回强制、或推荐面被收窄成只剩一种"：写入者于是为凑路径去搬文档。
# 锚点取**正向的推荐面**与**反向的禁令文本**两面，任一处被改掉即报红。
