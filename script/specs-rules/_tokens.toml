    "squash 合并",
    "已合并",
    "已合入",
]
# 放行标记：报错文案、实证记录、失效复述里都会出现上面那些词——"记录这件禁令的话"
# 不得被读成"执行了合并"。**注意这条边界本身也会被误伤**：只认否定词还不够，
# 故把"描述一件已发生的失效"的叙述标记也列进来（实测：本条自己的提交说明写过
# "把原话读成合并 PR、直接调平台合并并回已合并 ✅"，那是**记录**而不是**执行**）。
