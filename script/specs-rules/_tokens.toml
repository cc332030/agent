# 「这份提示词要不要引 `build-parallel`」的判定词（`check_maven_parallel_guard`）：
# 提示词正文里出现这些词即说明它的任务含构建/测试步骤 → **必须**引入该片段；
# 一个都不出现（如"只改规范文本"的提示词）→ **不要求**引入（引了反而误导）。
# **只放"构建/测试动作本身"的短词**：这类词是"任务里到底跑不跑构建"的证据，故不得混入
# 通用流程词（如"回归自检"——它是各提示词共有的收尾步骤，本身不跑构建）。放进来会反向
# 失真：一份"只改文本"的提示词照抄该流程名即被要求引入与任务无关的构建片段。
# **同理不得放"幅度词 + 整句"**（如"全量编译与全量测试""跑构建与测试"）：把一整句流程
# 描述钉进规则数据，等于删掉那句话就改不成——命中靠 `any()`，任一个短词出现即足够。
# **只对本项目生效**的任务提示词（用户口径的「优化公共规范」）。
# 这些提示词**不以"会被复制到未知项目执行"为前提**——它们的判据源与对象都在本仓库
