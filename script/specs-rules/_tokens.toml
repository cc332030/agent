# 『分发产物的体积与按需加载』防线的锚点清单（`check_bundle_size_guard`）。
# 用户提出：前端打包告警「Some chunks are larger than 500 kB after minification」反复出现，
# 规范里要**去根治**、不许「掩耳盗铃」（＝调高上限），有必要可扩到所有语言。
# 故锚点分两段：① 通用层「警告与弃用」里的跨语言那一条（体积上限只是质量哨兵的一种）；
# ② 通用层「分发产物的体积与按需加载」（判据本体 + 前端载体 + 依据行）。
# 前者的逐条要点由 `bundle.toml` 的 `bullet_tokens` 步骤就地给出（改措辞与核措辞同处一份
# 规则文件），本文件只放后者的清单。
