# ---- 『NPC 禁合并·动作侧』（check_merge_state_guard）的措辞表 ----
# 与本文件其余段一样：**改措辞只改这里、不动 .py**。这道防线核的是"合并动作真没做"
# （提交说明 / 源分支 HEAD / 分支历史），与文本侧要点齐备无关。
[tokens.merge_state_guard]
# 提交说明里出现这些即视为"合并动作的痕迹"（命中即报红，除非同一行出现放行标记）
merge_action_markers = [
    "merge-pull",
    "merge --no-ff",
    "squash 合并",
    "已合并",
    "已合入",
]
# 放行标记：报错文案、实证记录、失效复述里都会出现上面那些词——"记录这件禁令的话"
# 不得被读成"执行了合并"。**注意这条边界本身也会被误伤**：只认否定词还不够，
# 故把"描述一件已发生的失效"的叙述标记也列进来（实测：本条自己的提交说明写过
# "把原话读成合并 PR、直接调平台合并并回已合并 ✅"，那是**记录**而不是**执行**）。
allow_markers = [
    "拒绝",
    "不得",
    "严禁",
    "禁止",
    "不予执行",
    "不做",
    "一律不",
    "实证",
    "失效",
    "曾",
    "误读",
    "读成",
    "记录",
    "反例",
    "复述",
