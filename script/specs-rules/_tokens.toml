# 『已被证否的旧口径不得写回』防线：把**实测证否**的口径的特征措辞钉住。
# 为什么需要它：口径被证否后改掉的是**方向**，而"旧的错法长什么样"只留在改动记录里，
# 下一个人很容易照旧句子复述回来（本仓库实证：`def test_` 的旧计数口径在改掉之后仍在
# 多轮沿革里成串出现，读者复述一遍就把错口径带回注释）。这里逐条核**措辞形态**；
# "这条口径今天还成不成立"属语义判断，交人/子 agent 复核。
[[guards.check_stale_wording_guard]]
kind = "file_forbidden"
file = "script/check_specs.py"
forbidden = [
    "里的 `def test_` 个数",
    "不是源码里 `def test_` 的个数",
    "写成\"只数 check_specs_test.py\"",
]
message = "script/check_specs.py 写回了**已被现场实测证否**的旧口径措辞（见 script/specs-rules/_tokens.toml 的 check_stale_wording_guard）：用例数的口径既不是「源码里写了几个 `def test_`」、也不是「只数某一个测试文件」，而是「`script/` 下全部 `*_test.py` 里真正会被 `unittest` 收集」的用例数——定义与唯一实现处见 `_test_cases`，本处只回指、不复述"

# 『界面的规模与性能』防线的锚点清单（`check_ui_performance_guard`）。
# 用户口径：能用和好用不一样——界面设计要考虑性能，开发期数据不多时看不出问题，
# **只有数据量大了后才知道哪一处卡**，与后端接口同理；覆盖 web 端、Java、Python 等端画的界面。
# 故判据取**形态**（取数边界、同一次展示不逐项各取一次、重区块按需加载）、不取当前数据量；
# "要不要做性能结论"交回测试规范的触发特征判（界面不默认加、也不默认不加）。
# 规则数据在 `ui-perf.toml`（前端载体、测试触发特征、调度器加载门都在那一份）。

