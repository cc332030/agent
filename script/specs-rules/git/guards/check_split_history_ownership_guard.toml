[[guards.check_split_history_ownership_guard]]
bullet = "一份变多份的历史归属"
file = "specs/general/git.adoc"
kind = "bullet_tokens"
message = "一份变多份的历史归属防线被破坏：{file} 的「文件移动与重命名」缺失要点 {missing}——{desc}（该条的**正文**须自带这些要点，被抽空或搬到别处即等于失效）"
section = "文件移动与重命名"
tokens = [
    "同一源文件只能让其中一份继承移动历史",
    "继承哪一份、按三级判据取",
    "① **内容相似度高的那一份继承**",
    "② **相似度相同时，集中到一个模块**",
    "整体落在同一个模块内",
    "③ **模块的选择取能继承数量最多者**",
    "不是文件总数最多的模块",
    "数量仍相同时任选一个模块",
    "一经选定即固定",
    "**判定标准（逐条可核对，任一命中即不合规）**",
    "继承历史的文件**落在两个及以上模块**",
    "每一边丢几个",
    "为凑\"整体落在一个模块\"而把不相干的模块或文件算进本批",
    "同一源文件被移动多次（多份同时继承）",
]
until = "例外（L2）"

# 加载门：调度器「git 操作」条目的识别特征须含"要判定只剩一份历史时由哪一份继承"——
# 缺则该条在"同一源文件既移动又复制"这一场景**永远不会被加载**（规则写了、读不到；
# 写规则与登记识别特征是同一个动作，与 `check_method_placement_guard` 同口径）。
[[guards.check_split_history_ownership_guard]]
anchor = ["git 操作"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "一份变多份的历史归属防线被破坏：{file} 的「git 操作」条目缺失 {missing}——缺该识别特征时，判定『只剩一份历史该由哪一份继承』不会触发加载该条"
tokens = ["要判定只剩一份历史时由哪一份继承（同一源文件**既移动又复制**）"]
[[guards.check_split_history_ownership_guard]]
file = "specs-project-maintainer/priority.adoc"
groups = [
    [
        "P1 条目",
        [
            "一份变多份的历史归属",
            "相似度高者优先",
            "集中到一个模块",
            "能继承数量最多者",
        ],
        "不可降级清单侧须同步登记该判据（一行回指的形态：相似度高者优先 + 集中到一个模块 + 能继承数量最多者）——缺则清单与 git 规范脱节，重构时该判据会被当普通条目删掉",
    ],
]
kind = "file_groups"
message = "一份变多份的历史归属防线被破坏：{file} 缺失 {missing}——{desc}"

# 『变更编号的作用面』防线（用户提出）：**Issue / 合并请求的编号只允许出现在提交信息中，
# 不得出现在项目内容里**（唯一例外是变更日志）。
# 缺它时的失效：编号（形态如「Issue #N」「PR #N」「某仓库#N」）被写进规范正文、代码注释与规则数据——
# 它们是**平台侧的临时坐标**，项目内容的读者与执行者拿不到、据此也找不到任何东西；
# 换平台/迁移/改名即失效，而追溯的落点本是 git 历史（提交信息）。
