# 『动手前先确认当前分支与上游同步』规则数据（用户提出）。
#
# 本条防的失效：**动手前没核当前分支是否落后上游**——本地看不出任何异常（编译过、用例绿、
# 与记忆里的代码一致），而基点是旧的：改动落在别人已经改过的同一处、提交建立在旧基线上，
# 冲突与覆盖在这一步就已经注定，事后只能靠解冲突与逐处并回补救。**「本地看着没问题」
# 与「基点是最新的」是两件事**，前者不构成后者的依据。
#
# 判据本体唯一落点＝通用层 `specs/general/git.adoc`「动手前先确认当前分支与上游同步」；
# 必加载层 `specs/core/CORE.adoc`「底线」只留**一句要求 + 回指**（常驻层只放底线）
# ——故两处都要钉：只钉通用层时，常驻层那句被删掉照样全绿，而**每次会话读的正是常驻层**。
#
# 锚点分两类、缺一不可：**取值形态**（当场取远端、上游一侧为空）与**边界**（无上游 /
# 取不到远端须明说、按任务核一次、与「并入目标分支」分工）。只留「动手前要先更新」一句时，
# 本条会被读成「每个动作前都取一次远端」——与执行吞吐相抵，现场随即把整条当噪音跳过
# （这是一条规则「写着却不生效」的常见成因：边界不写，执行者只能自己发明一个更严或更松的口径）。
#
# **「本地跟踪引用也算数」是必须钉住的假绿形态**：`@{u}` 是上次取回时的值，不取远端时
# `HEAD..@{u}` 恒为 0——只看它，本条零成本即可自证通过，与它自己写的判定标准②同一形态。

[[guards.check_branch_sync_guard]]
kind = "section_groups"
file = "specs/general/git.adoc"
section = "动手前先确认当前分支与上游同步"
groups = [
    [
        "动手前的触发面与后果",
        [
            "动手前先确认同步",
            "改文件、跑构建/测试、提交",
            "据代码现状作判断并据此推进任务",
            "当前分支已与它的上游同步",
            "未同步则先更新、再动手",
            "冲突与覆盖在这一步就已经注定",
        ],
        "缺则本条只剩标题：触发面（改文件 / 构建 / 提交 / 据代码现状作判断并推进）与后果（冲突与覆盖在动手这一步就注定）都没写，执行者只会把它读成「提交前顺手拉一下」的流程建议",
    ],
    [
        "取值：当场取远端、上游一侧为空",
        [
            "按远端当场取值、上游一侧为空",
            "先取远端当前指向",
            "git rev-list --count HEAD..@{u}",
            "本地跟踪引用",
            "本地领先上游不算未同步",
        ],
        "缺则判据可零成本自证：不写「先取远端当前指向」时，本地跟踪引用（上次取回时的值）会让该计数恒为 0——不取远端也算通过，正是本条判定标准②要拦的形态；缺「本地领先不算未同步」时又把有未推送提交的情形误判为未同步",
    ],
    [
        "同步不得丢本地已有成果",
        [
            "同步不得以减少本地改动为代价",
            "未提交改动的集合不减少",
            "本地未推送的提交条数不减少",
            "破坏性操作",
        ],
        "缺则「先更新」可以拿丢弃本地成果来换：更新把未提交的改动或未推送的提交冲掉，比基点旧更不可恢复——这一档是本条与「破坏性操作」的接缝，删掉即断",
    ],
    [
        "不成立时须明说、不得默认已是最新",
        [
            "不成立时须明说",
            "无上游",
            "取不到远端",
            "尽力而为",
            "未核对到最新",
        ],
        "缺则「核不到」会被当成「核过且通过」：无上游不写状态、取不到远端不尝试就按「已同步」动手，而读者无法从汇报里分辨这几种情况；也不写清「尽力而为」时不记为通过、不因此停下，与「做得到就不许停下来问」相抵",
    ],
    [
        "按任务核一次、不按动作核",
        [
            "按任务核一次，不按动作核",
            "每个动作前都取一次远端",
            "跨轮次、长中断后重新动手",
        ],
        "缺则本条与执行吞吐相抵：写成「每步都取远端」时成本落到每一次工具调用上，现场只能整条忽略——边界不写明，规则就只剩「要么过严、要么失效」两种读法",
    ],
    [
        "与「并入目标分支」的分工",
        [
            "不是同一件事（L1）",
            "本分支与它的上游",
            "压缩前须先并入目标分支的最新改动",
            "两条互不替代",
        ],
        "缺则「已与上游同步」会被读成「已并入目标分支最新」：两者对象不同（上游 vs 目标分支），提示词 `baseline` 片段与 `version-control.adoc`「压缩提交」管的是后者——不写分工，同一件事就有了两种判准",
    ],
]
message = "『动手前先确认当前分支与上游同步』防线被破坏：{file}「动手前先确认当前分支与上游同步」缺失要点 {missing}——{desc}"

[[guards.check_branch_sync_guard]]
kind = "bullet_tokens"
file = "specs/core/CORE.adoc"
section = "底线（L1，任何理由都不得规避）"
bullet = "动手前在 git 工作区里确认当前分支已与上游同步"
tokens = [
    "当场取远端",
    "上游没有本分支缺少的提交",
    "有则先更新",
    "同一任务核一次",
    "specs/general/git.adoc",
    "动手前先确认当前分支与上游同步",
]
message = "『动手前先确认当前分支与上游同步』防线被破坏：{file}「底线」缺失要点 {missing}——{desc}（常驻层是每次会话真正读到的唯一一层，这句被删掉或只剩一句「要同步」时，通用层写得再全也读不到）"
