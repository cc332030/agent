# 分阶段交付——任务**中途**也有交付（用户提出）。
# 题面侧只补 `delivery` 片段（**公共片段里缺一条边界**属应当就地补齐的两类之一：
# 只补片段正文与引用本身、不扩大题面），故须钉住三处：① 片段里这条边界在；
# ② `PROMPTS.adoc` 的公共约定同步了它（提示词会被未知项目复制执行，漏了这层则
# 复制出去的那份没有这条边界）；③ 两个提示词的代码块都须引入 `delivery` 片段
# （判据本体在 `specs/general/git.adoc`「分阶段交付（大任务）」，片段只留一行引用）。
[[guards.check_staged_delivery_guard]]
file = "prompts/_common.txt"
groups = [
    [
        "阶段成果的交付",
        [
            "阶段成果的交付（L1，任务中途也有交付）",
            "它管不了任务中途",
            "先分阶段、先规范再执行",
            "每个阶段完成即交付",
            "不得攒到收尾一次性交付",
            "等于没有交付",
        ],
        "缺则提示词侧只剩收尾一处交付口径——执行者会把『没做完不交付』读成任务中途也不必交付，阶段成果全部留在临时载体里（本条要解决的失效）",
    ],
    [
        "判据本体回指",
        [
            "判据本体见 `specs/general/git.adoc`「分阶段交付（大任务）」",
            "本处不复述",
        ],
        "缺则该边界在提示词侧成为第二真源（片段与规范各自漂移）；也断了『一处完整定义 + 其余一行引用』",
    ],
]
kind = "file_groups"
message = "分阶段交付防线被破坏：{file} 的 `delivery` 片段缺失要点 {missing}——{desc}"
[[guards.check_staged_delivery_guard]]
file = "PROMPTS.adoc"
groups = [
    [
        "公共约定同步",
        [
            "任务中途也有交付",
            "先分阶段、先规范再执行",
            "不得攒到收尾一次性交付",
            "等于没有交付",
            "分阶段交付（大任务）",
        ],
        "缺则公共约定与片段脱节——两个提示词的『公共约定』索引里读不到这条边界（`check_prompts_index_guard` 要求每条边界都必须可达）",
    ],
]
kind = "file_groups"
message = "分阶段交付防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 题面侧：两个提示词的**装配结果**里须有这条边界——片段里有不等于题面里有；
# 本步把 `include::` 展开后再核（题面侧只要求"它须被引入"，不要求逐字抄在题面里，
# 判据见 `script/rules_engine.py` 的 `_step_prompt_files_groups`）。
[[guards.check_staged_delivery_guard]]
file = ""
resolve_includes = true
groups = [
    [
        "题面装配后须有该边界",
        [
            "阶段成果的交付（L1，任务中途也有交付）",
            "每个阶段完成即交付",
            "specs/general/git.adoc",
        ],
        "缺则该提示词装配后没有这条边界——执行者按它执行时会继续把阶段成果留在临时载体里（题面侧只核『被引入了没有』，不要求逐字抄一遍）",
    ],
]
kind = "prompt_files_groups"
message = "分阶段交付防线被破坏：{file} 缺失要点 {missing}——{desc}"
