[tokens.change_number_scope_guard]
# 项目内容的扫描面（相对于仓库根的路径前缀；`.gitignore` 的 `tmp/` 一类临时产物不在内）。
# **随动义务**：这是"枚举"，而判据说话的对象是"随项目交付的一切文本"（见 `specs/general/git.adoc`
# 「提交信息」本条 bullet）。故**新增一级目录或新的一级文件时须同步加进本表**——否则那批内容
# 会静默漏扫（清单不够用即覆盖面不够用，判据在、扫描面缺）。改本表不改代码。
scan_prefixes = [
    "specs/",
    "specs-project-maintainer/",
    "prompts/",
    "library/",
    "script/",
    ".github/",
]
# 仓库根下**逐个收**的文件（不在 `scan_prefixes` 里的一级文件；新增一级文件时同步加进本表）。
scan_root_files = [
    "AGENTS.adoc",
    "AGENTS_COMMON.adoc",
    "PROMPTS.adoc",
    "README.adoc",
    "PUBLIC.adoc",
    "index.html",
    ".cnb.yml",
]
# 纳入扫描的扩展名。
scan_suffixes = [".adoc", ".py", ".toml", ".yml", ".yaml", ".html", ".txt", ".md", ".xml", ".json", ".sh", ".bat", ".cmd", ".ps1"]
# **豁免**：变更日志按 `specs/general/changelog.adoc`「可核对」条承载条目与需求的对应关系，
# 是规则里点名的唯一例外。
exempt_files = ["CHANGELOG.adoc"]
# **放行形态**（不是变更编号的"编号"）：它们是**内容本身的载体**、不是指向别处的平台坐标。
# **按"整段形态"匹配、不按"同行共现"**——同行共现会把"`PKCS #5` 与 `Issue #N` 写在同一行"
# 的情形整体放过，真变更编号被架空（review 实测）。故这里给的是**完整正则形态**：
# ① 标准名里的编号（`PKCS #5` / `PKCS#5` 一类，**允许无空格**——外部标准两种写法都常见；
#    漏掉一种时防线对另一种不是漏报而是**误报**，误报会被读成"判据本身写错了"进而被整条撤掉）；
# ② 本仓库防线清单/隐患清单的序号（`| 129 |` 一类——编号是表格那一格的内容本身，
#    参见 `check_reference_coord_guard` 的"编号即内容本身的载体"例外）。
allow_patterns = [
    "(?:PKCS|RFC|ISO|GB/T|NIST SP|IEC|IEEE)\\s*#\\s*[0-9]{1,6}",
    "^\\s*\\|\\s*[0-9]{1,4}\\s*\\|",
]
# 变更编号的**形态**（改措辞不动代码）：本平台编号（`Issue #N`/`PR #N`）、
# 外部仓库的编号（`owner/repo#N`）、以及紧邻"某一次改动"语境的反引号编号（`` `#N` ``）。
# **长度上限给到 6 位**：上限就是判据的取景框——本平台编号当前已到四位量级，卡在四位时
# 越过它即**静默漏报**（而"漏报"正是本条要防的失效形态本身）；放行表已经把"编号本身即
# 载体"的误报兜掉，故不必再靠长度上限兜。
number_patterns = [
    "(?:Issue|ISSUE|issue|PR|Pr|pr|Pull Request|pull request)\\s*#\\s*[0-9]{1,6}",
    "(?:[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]{2,}#\\s*[0-9]{1,6}",
    "`#\\s*[0-9]{1,6}`",
]
# 分阶段交付（大任务）——用户提出：「大任务分阶段执行时，也要分阶段提交与推送，
# 以便中断后还能继续操作，避免丢失宝贵的成果」。判据本体落 `specs/general/git.adoc`「分阶段交付（大任务）」。
# 核的是**取值状态**：阶段划分是否先定、阶段成果是否落在"已提交并已推送的载体"里、
# 临时产物是否不提交、中断后是否从最后一个已交付的阶段继续；"这个任务算不算大任务""某次操作算不算一个阶段"
# 属语义判断，交人/子 agent 复核（见 `specs-project-maintainer/guards.adoc` 的核对边界）。
