# 『接口实现字段名与 getter 名不一致须手动桥接』（用户从存量项目规范引入：类型相同、字段名与接口
# getter 方法名不一致时，手动 `@Override` 桥接并加 `@JsonIgnore`，避免序列化出现重复属性）。
# 机制：访问器按**字段名**生成 ⇒ 不生成接口要求的那个方法（非抽象类因此编译不过）；手动桥接后
# 接口方法名与字段名各成一个读取方法、指向同一个值 ⇒ 不加忽略就序列化出**两个属性**。
# 按**条目自己的正文**核（`bullet_tokens`）：「编码」一节里相邻条目含「依据/存量边界/判定标准」
# 一类同样字样，按整节核时会把从本条抽走的要点兜住。
