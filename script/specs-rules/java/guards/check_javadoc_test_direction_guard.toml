# 通用层同口径（非 Java 语言与按通用文档规范加载的执行者从这里学）。
[[guards.check_javadoc_test_direction_guard]]
file = "specs/general/doc-design.adoc"
# 「类间关系与双向引用」是**三级子节**（`=== `），`section` 只认二级 —— 按 `section` 取会
# 报"缺少该节"（本轮实测）。故走 `subsection`。
subsection = "类间关系与双向引用"
groups = [
    [
        "指向可解析的一方、反向不成立",
        [
            "指向可解析的一方",
            "反向不成立",
        ],
        "通用层：须写明关系**指向可解析的一方**且**反向不成立**——只写'互相引用'会让非 Java 语言与引用方项目照搬出解析不了的引用",
    ],
    [
        "判定依据：解析范围",
        [
            "不在主源码的文档解析范围内",
            "单边承载",
        ],
        "依据：须写明测试源码**不在主源码的文档解析范围内**、故由**测试侧单边承载**——缺则'反向不成立'成了无依据的结论，容易被当成 Java 特有而以'等价实现'绕过",
    ],
    [
        "文件引用按各语言写法、能照路径找到目标即可（不要求链接）",
        [
            "文本引用",
            "不要求写成可点的链接",
            "多个测试类",
        ],
        "引用写法：须写明指向文件的引用按各语言文档注释的引用写法写、**能照路径找到目标即可、不要求写成可点的链接**（Java 用英文双引号包裹的 `@see \"路径\"`），同一源类的多个测试类逐个写出——缺则非 Java 栈照搬成'必须写成链接'或反过来写成裸引用报错",
    ],
]
kind = "file_groups"
message = "『类间关系只写可解析方向』通用层口径被破坏：{file} 缺失 {missing}——{desc}"
