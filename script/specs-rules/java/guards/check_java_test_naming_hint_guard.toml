# 『Java 永不自动执行的实验代码后缀 Playground』防线（`specs/stack/java-testing.adoc`「测试类命名」）：
# 用户口径（Issue）——`src/test/java` 下有手动执行的代码，**任何情况下都不能自动执行**；
# 为这类任务取名（**不叫"手动"**）、**通过名字匹配**避免执行。
# 失效形态有四类，逐类钉住：① **拒用"手动"的取名口径被删**（名字退回 `Manual*`——
# "手动"只描述怎么跑，表达不了"任何自动集合都不许收它"）；② **名字匹配天然落空**这一机制
# 被删（后缀被改成 `*Tests`/`*IT` 一类会进自动集合的形态，"永不执行"当场失效）；
# ③ **构建配置显式排除**被删（默认 includes 落空只挡默认规则，自定义扫描仍会收它）；
# ④ **不得混入其他后缀**被删（`XxxPlaygroundTests` 被 surefire 命中）。
# 故按**四条 bullet 各自的正文**核（`bullet_tokens`）——整节核时相邻条目（`IT`、`PerfTests`）
# 含同样的 `surefire`/`includes`/`IT` 字样，会把从某条抽走的要点兜住。
