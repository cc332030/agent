[[guards.check_java_test_naming_hint_guard]]
file = "specs/stack/java-testing.adoc"
# **只核「测试类命名」节自己的正文**：该节改名成 `（L1 强制）`、节内正文改回
# "测试类名一律…"时，按整份文件核会把节外的同形字样拿来兜底（本仓库实测：整份文件核时
# 该形态报不出）。节名本身也要核（它是口径级别的一处落点），故下面第一组核的是节名。
section = "测试类命名"
groups = [
    [
        "命名是推荐、非必须",
        [
            "测试类名**推荐**用",
            "推荐、非必须",
        ],
        "口径：须写明测试类名是**推荐**（'推荐用「被测类名 + 测试类型后缀」'、'推荐、非必须'）——被改回'一律'即为降级被推翻",
    ],
    [
        "AI 生成用默认名字",
        [
            "AI 生成时的默认名字",
            "AI 新建测试类**用默认名字**",
        ],
        "默认名字：须写明 **AI 生成时用默认名字**（被测量的类叫 `StringUtils` → 测试类叫 `StringUtilsTests`）——缺则 AI 生成时无落点",
    ],
    [
        "允许自定义类名",
        [
            "类名允许自定义",
            "自定义不是违规",
            "CCacheAspectCacheKeyTests",
        ],
        "自定义：须写明**允许自定义类名**（含分类限定语）、**自定义不是违规**，并给出用户点名的实例——缺则该形态只能靠默认名硬凑",
    ],
    [
        "后缀沿用上表（推荐，非禁令）",
        [
            "后缀沿用上表的五类（推荐）",
            "这是推荐、不是禁令",
            "构建配置一侧的取值不变（L1）",
        ],
        "后缀面：五类后缀是**推荐**（不是禁令）、但构建配置一侧的取值仍为 L1（要进常规 test 阶段的须用 surefire 能识别的默认名字）——前者防'自造后缀一律禁'，后者防把执行边界一起放宽",
    ],
]
kind = "file_groups"
message = "Java 测试类命名（推荐面）防线被破坏：{file} 缺失 {missing}——{desc}"


# 与上条同源的一组（`specs/stack/java-testing.adoc`「测试类命名」）：命名面只取约定内的名字
# 是**推荐面的取值规则**（五类后缀一律以 `Tests` 结尾、全部命中 JUnit/Maven 的类名规则），
# 执行边界另由「执行边界不靠名字承担」与「`SandboxTests` 三重落点」两条钉住。
# 故按**条目各自的正文**核（`bullet_tokens`）——整节核时相邻条目（`PerfTests`、`IntegrationTests`）
# 含同样的 `surefire`/`includes`/`Tests` 字样，会把从某条抽走的要点兜住。
