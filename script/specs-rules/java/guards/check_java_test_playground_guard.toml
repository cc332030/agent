# 『没有多态时不得为 service 类加有相同方法的父接口』防线（**用户提出**，判据本体在通用层）
# 用户口径：「在没有多态的情况下，禁止为 service 类添加有相同方法的父接口」。
# 本文件里放三道：① 通用层本体（`specs/general/coding.adoc`「类设计」）；② 它自己的锚点条数；
# ③ Java 落点（`specs/stack/java.adoc`「编码」）只给载体——认类、多态成不成立看注入与声明类型、
# 去向是直接用该类、"框架由接口生成实现"的契约不在核对面。
# 失效形态：① 条文被删或降级成"建议"（于是"面向接口编程""以后可能换实现"重新成立）；
# ② **「没有多态」的判据**被抽（只剩一句口号时，任何"接口 + 唯一实现"都能自圆其说）；
# ③ 理由被抽（读者不知道接口在这里没换来任何东西）；④ 例外清单被抽（连框架由接口生成实现的
# 契约一起判红，`Mapper`/Feign/Spring Data 仓储无处安放）；⑤ 存量边界被抽（等于要求立刻批量删接口）。
# 核对对象一律是**条目自己的正文**（`bullet_tokens`，不是整节）：「类设计」节相邻条目
# （工具类继承、纯数据结构类、配置类）含大量「接口」「实现」字样，按整节核会被兜住。
# 锚点一律取本条 bullet 内**只出现一次**的措辞——轴名（`**理由**`/`**判定标准（任一命中即违规）**`/
# `**存量边界（L1）**`）在本节其余条目里同样出现，用它们核等于让相邻条目兜住本条。
