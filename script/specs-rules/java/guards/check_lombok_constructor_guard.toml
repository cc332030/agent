# 『Java 数据对象模板防线』：模板文件（整段照抄的清单）与判据本体两处都不得被删或降级。
# 背景（用户口径）：数据对象模板属"要么不读、要么整份读完"的产物，故**单列成模板文件**、
# 不并进 `specs/stack/java.adoc`；但判据本体必须留在规范文件里（同一件事只有一处真源）。
# 失效形态有四类，逐类钉住：① 模板文件被删/被并回规范（回到"撑大规范又读不全"）；
# ② 判据本体从规范文件里消失（只剩模板清单，读者不知道"为什么补注解时已提交的类默认不加 `@Accessors`"）；
# ③ 加载门丢了（新建对象时该文件永不被加载）；④ 三处取值被删或降级。
