# 『源类不 @see 其测试类、关系由测试侧单边承载』防线（`specs/stack/java.adoc`「javadoc」）。
# 用户报告的真实失效：规范原写"源类 javadoc `@see` 其各类测试类"，执行者照做后
# **主源码 javadoc 解析不到 `src/test/java`**——裸类名报 `reference not found`
# （`failOnError` 断构建），加引号则降级成**纯文本**（实测：生成的文档里就是带引号的
# 一串字面量、不成链接）。两种写法都不成引用，故规则本身要改向，不是改写法。
# 钉三面，缺任一面即口径会退回旧形态或退回"加引号绕过"：
#   ① 正文方向（测试类引用源类、源类不写）；
#   ② 引号的效力边界（只对路径成立、不用于绕过类名解析失败）；
#   ③ 不可解析的原因（`src/test/java` 不在主源码 javadoc 解析范围内）。
# 用户口径：路径引用用英文双引号包裹即可（文本引用、按字面记录路径、照路径找得到目标），
# 不要求写成 `<a href>` 链接——链接形态只是可选，不作为规范要求。
