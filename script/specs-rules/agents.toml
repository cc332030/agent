[[guards.check_changelog_timing_guard]]
file = "specs/general/changelog.adoc"
groups = [
    [
        "登记时机",
        [
            "登记时机",
            "默认动作是「不新增、不修改」",
            "只有**用户本次主动声明**",
            "不得自动追加",
        ],
        "通用层须有『登记时机（默认动作：不新增、不修改）』节，写明**变更日志不是自动追加区**、**默认动作是不写**、**只有用户本次主动声明才写**、**不得自动追加**——防该条被删或被降级成建议（执行者会重新把『改了东西』与『该记一条』画等号，条目随每轮任务自发生长）。本条是**跨项目成立**的规则，故判据本体落在通用层（用户口径：挪到公共规范里）",
    ],
    [
        "未声明时一律不写",
        [
            "未提到变更日志",
            "只要求更新文档或 README",
            "均按**未声明**处理",
        ],
        "须点名**未声明的越界形态**（未提到变更日志、只要求更新文档或 README、只说『改动了什么』、只要求『调整项目规范』，均按未声明处理）——本条要治的正是『用户只说要改文档/改规范，执行者却顺手改了 changelog』，缺这一句则判据只剩正向一半",
    ],
    [
        "顺手补一条",
        [
            "顺手补一条",
        ],
        "须保留『顺手补一条』这类常见越界形态（每轮改动顺带追加条目）",
    ],
    [
        "声明是例外而非默认",
        [
            "声明是例外而非默认",
            "仅对当次生效",
            "不得泛化",
        ],
        "须写明**声明是例外而非默认**（仅对当次生效、不得泛化）——缺则执行者会把『用户这次声明过』读成『这个项目以后都自动记』",
    ],
    [
        "移除时的处置",
        [
            "移除时的处置",
            "保留其余内容与既有版本号不动",
            "不得为「版本线连续」自造一个新版本号条目顶上",
        ],
        "须写明**用户要求移除条目时的处置**（删指定条目、其余内容与既有版本号不动、不得自造新版本号条目顶上）——缺这一句时，执行者会为『版本线连续』把删掉的条目换成一条同版本号的『已移除』记录，等于换个说法把它留在文件里",
    ],
    [
        "规范文件变更不入变更日志",
        [
            "项目自身的规范文件变更不入变更日志",
        ],
        "须写明**项目自身的规范文件变更不入变更日志**（由其 git 历史承载）——缺则执行者会把『改了规范』当成『该记一条』",
    ],
]
kind = "file_groups"
message = "变更日志登记时机防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_changelog_timing_guard]]
file = "script/check_effective.py"
anchor = ["check_changelog_timing_guard", "默认动作"]
tokens = [
    "check_changelog_timing_guard",
    "默认动作",
]
kind = "line_tokens"
message = "变更日志登记时机防线未登记：{file} 的登记表里凡提到 `check_changelog_timing_guard` 的那一行都须同时写明该条的**默认动作**口径（缺 {missing}）——须登记该条（定义了却没抓手＝这条又变成靠自觉，与它要治的失效同形）；用整份文件核会把通用层那条判据本体（本就该出现该条口径）一并算进来，核的不是「登记处登记了没有」"

[[guards.check_rule_instance_separation_guard]]
file = "script/check_effective.py"
anchor = ["check_rule_instance_separation_guard", "规范保持通用"]
tokens = [
    "check_rule_instance_separation_guard",
    "规范保持通用",
]
kind = "line_tokens"
message = "规则与实例分离防线未登记：{file} 里凡提到 `check_rule_instance_separation_guard` 的行都须同时写明『规范保持通用』（缺 {missing}）——须登记该条（定义了却没抓手＝这条又变成靠自觉，与它要治的失效同形）；判据只认**登记表那一行**，不认全仓库任何一处提到该名字的地方"

[[guards.check_rule_instance_separation_guard]]
file = "AGENTS.adoc"
groups = [
    [
        "规则与实例分离",
        [
            "规则与实例分离",
            "本仓库默认动作：不写实例",
            "保持通用",
            "用户原话",
            "tmp/",
            "library/adoption.adoc",
            "library/sources.adoc",
            "CHANGELOG.adoc",
        ],
        "须有『规则与实例分离（本仓库默认动作：不写实例）』条，写明本仓库自身规范与公共规范**保持通用**、**不得**把本仓库/当前环境/session 专有的实例（用户原话、本机路径、`tmp/` 文件名、轮次与日期、内部代号）写进规范文件、公共内容与提示词，并给出实例的登记落点（图书馆 `adoption.adoc` / `sources.adoc`、changelog）——缺则『用户说调整项目规范』会被读成『把原话抄进规范』，读者拿不到这句话的场景会静默改写规则",
    ],
    [
        "默认动作是",
        [
            "默认动作是「不写」",
            "不得",
            "顺手",
        ],
        "须写明**默认为不写**：只有用户本次明确要求登记时才写，用户说『调整项目规范』时改的是规则本身",
    ],
    [
        "失效形态与依据",
        [
            "失效形态",
            "静默改写",
            "用户指出",
        ],
        "须同时给出失效形态与该条的出处（把某次的原话/实跑环境当成规则的一部分登记 → 读者拿不到该场景就静默改写本集合规则），否则后人只看到一句禁止、读不出它治的是什么",
    ],
]
kind = "file_groups"
message = "规则与实例分离防线被破坏：{file} 缺失要点 {missing}——{desc}"
