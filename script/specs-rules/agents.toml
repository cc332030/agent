[[guards.check_changelog_timing_guard]]
file = "AGENTS.adoc"
groups = [
    [
        "登记时机",
        [
            "登记时机",
            "本仓库的默认动作是「不新增、不修改」",
            "只有用户本次明确要求",
            "不再要求",
            "check_changelog_timing_guard",
        ],
        "须有『登记时机（本仓库默认动作：不新增、不修改；用户明确要求才写）』条，写明**默认动作是不写**、**不再要求『主动声明』这种额外声明**（用户直接说『记一条/改 changelog』即算），并写明本防线抓手名——防该条被删或被降级成建议（执行者会重新把『改了东西』与『该记一条』画等号，条目随每轮任务自发生长）",
    ],
    [
        "未要求",
        [
            "未要求",
            "只要求更新文档或 README",
        ],
        "须点名**未要求的越界形态**（未提到该文件、只要求更新文档或 README、只说『改动了什么』、只要求『调整项目规范』）——本条要治的正是『用户只说要改文档/改规范，执行者却顺手改了 changelog』，缺这一句则判据只剩正向一半",
    ],
    [
        "顺手补一条",
        [
            "顺手补一条",
        ],
        "须保留『顺手补一条』这类常见越界形态（每轮改动顺带追加条目）",
    ],
    [
        "移除时不得自造版本号",
        [
            "移除时",
            "保留其余内容与既有版本号不动",
            "不得为「版本线连续」自造一个新版本号条目顶上",
        ],
        "须写明**用户要求移除条目时的处置**（删指定条目、其余内容与既有版本号不动、不得自造新版本号条目顶上）——缺这一句时，执行者会为『版本线连续』把删掉的条目换成一条同版本号的『已移除』记录，等于换个说法把它留在文件里",
    ],
]
kind = "file_groups"
message = "变更日志登记时机防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_changelog_timing_guard]]
file = "script/check_effective.py"
anchor = ["check_changelog_timing_guard", "默认动作"]
tokens = [
    "check_changelog_timing_guard",
    "默认动作",
]
kind = "line_tokens"
message = "变更日志登记时机防线未登记：{file} 的登记表里凡提到 `check_changelog_timing_guard` 的那一行都须同时写明该条的**默认动作**口径（缺 {missing}）——须登记该条（定义了却没抓手＝这条又变成靠自觉，与它要治的失效同形）；用整份文件核会把 `AGENTS.adoc` 本仓库自身规范（同属本仓库、本就该出现该条口径）一并算进来，核的不是「登记处登记了没有」"

[[guards.check_rule_instance_separation_guard]]
file = "script/check_effective.py"
anchor = ["check_rule_instance_separation_guard", "规范保持通用"]
tokens = [
    "check_rule_instance_separation_guard",
    "规范保持通用",
]
kind = "line_tokens"
message = "规则与实例分离防线未登记：{file} 里凡提到 `check_rule_instance_separation_guard` 的行都须同时写明『规范保持通用』（缺 {missing}）——须登记该条（定义了却没抓手＝这条又变成靠自觉，与它要治的失效同形）；判据只认**登记表那一行**，不认全仓库任何一处提到该名字的地方"

