[[guards.check_changelog_timing_guard]]
file = "AGENTS.adoc"
groups = [
    [
        "登记时机",
        [
            "登记时机",
            "除非用户主动声明",
            "一律不新增、不修改",
            "check_changelog_timing_guard",
        ],
        "须有『登记时机（主动声明才算）：除非用户主动声明，否则一律不新增、不修改本文件』条，并写明本防线抓手名——防该条被删或被降级成建议（执行者会重新把『改了东西』与『该记一条』画等号，条目随每轮任务自发生长）",
    ],
    [
        "主动声明",
        [
            "主动声明",
            "本次明确要求",
        ],
        "须给出『主动声明』的判据（用户**本次明确要求**新增/修改/整理/压缩 changelog或改写其组织方式与条目形态）——只写『声明』而不定义什么算声明，判据仍留在执行者手里（『这应该也算声明』重新可用）",
    ],
    [
        "未声明",
        [
            "未声明",
            "只要求更新文档或 README",
        ],
        "须点名**未声明的越界形态**（未提到该文件、只要求更新文档或 README、只说『改动了什么』、把该条概括转述而未点名 changelog 与动作）——本条要治的正是『用户只说改文档，执行者却顺手改了 changelog』，缺这一句则判据只剩正向一半",
    ],
    [
        "顺手补一条",
        [
            "顺手补一条",
        ],
        "须保留『顺手补一条』这类常见越界形态（每轮改动顺带追加条目）",
    ],
