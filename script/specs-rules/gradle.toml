# 『Gradle 构建』防线规则数据。
#
# 判据本体在 `specs/stack/gradle.adoc`——**公共内容**（对任何用 Gradle 的项目成立）。
#
# 本条防的失效：把 Maven 的写法按字面翻译成 Gradle 脚本能跑的一版，结果依赖版本有两个来源、
# 发布的构件在"构建成功"的表象下少上传、档位切换时两档产物互相覆盖——**都不报错**。
#
# 目标工具侧的**迁移**口径（不得强凑源工具结构）不在本文件，在
# `specs/stack/build-tool-migration.adoc`（由 `check_build_tool_migration_guard` 核）——
# 两道防线各核一份、不互相替代。
[[guards.check_gradle_guard]]

