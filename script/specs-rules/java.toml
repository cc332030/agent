    # 用户点名）：判据本体只留一行回指、不复述全局判定标准。
    "review 时对存量缺这套模板注解不提出问题",
    "specs/general/review.adoc",
]
until = "依据（标准名/编号）"

# 「整段清单的五项齐备」**单列一步、只核清单句本身**（`anchor` 起算、`until` 截断）：
