# 『Java 枚举查找空 catch 防线』（`specs/stack/java.adoc`「健壮性」 + 通用层判据本体）：
# **用户点名**的规范调整——"java 下 `Enum.valueOf` 例外，这里的异常只有可能是值没匹配上，
# 还有其他自己写的枚举工具，允许空 catch"。
# 本条**只放宽「空 `catch` 块体」这一半**，且**带三条准入**（判据本体在通用层）。
# 失效形态不是"没写例外"，而是**例外被读宽**：① 「允许空 `catch`」被抄成通用豁免、
# 把 L1 的其余部分（不得吞异常、对外输入一律校验）一并顶掉；② 准入条件与判定标准被压成
# 一句口号；③ **扩大的两个方向**没被排除——写成 `catch (Throwable)`/`catch (Exception)`
# 的类级空 `catch`（把同一个 `try` 里其他语句的异常一并吞掉），或给"本身已返回默认值"的
# 调用点再补一个空 `catch`。故锚点取**判据本体**（准入条件、判定标准、反面清单、边界），
# 不取轴名——只核「健壮性」这一节在不在属防线空转。
