# 本步核 bullet 正文的**后半段**（`until` 截断）：定位句及其后的三处判据都要核，
# 而末尾的**依据行**会把 `@SuperBuilder`/`@AllArgsConstructor` 等字样再列一遍（同一个
# bullet 的后半句兜住前半句的缺项），故核对对象截到依据行之前。五项齐备另由下面单独一步核。
tokens = [
    "specs/stack/java-object.adoc",
    "模板文件不是规范文件",
    "新增对象时加 `@Accessors(chain = true)`",
    "忽略带泛型参数的 set 方法",
    # 取值一的判据面取**本条独有**的正文锚点：`判定标准（任一命中即违规）` 这一短语在
    # 取值二/三处同样出现（取值二写「**判定标准**」、取值三写「**判定标准（任一命中即违规）**」），
    # 只核该短语时**同一个 bullet 的另两处**会兜住取值一被抽空的判定标准（本轮实测：
    # 抽掉取值一的判定标准句后仍全绿）。故锚到该句独有的正文。
    "给**已提交**的类补注解时加上了",
