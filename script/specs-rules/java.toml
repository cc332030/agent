# `@AllArgsConstructor`）——按整节核时相邻条目会把从本条抽走的字样**兜住**，防线全绿。
# 本轮实测：原 `file_groups` 写法下抽掉本条正文里的 `@SuperBuilder` 后 **0 条报红**
