    "集合字段默认加 `@Singular`",
    "没有单个元素入口",
    "存量不告警",
    # review 面（本轮新增的生效面，用户点名）：取值是「不提出问题」——这是一条**容易被
    # 当成『没写也一样』**的边界，故锚到只在本条出现的判据句与三条判定标准。
    "review 不得据此提出问题",
    "review 不是第三个生效面",
    "既然看到了就提一条",
]
until = "依据（标准名/编号）"

# 「整段清单的五项齐备」**单列一步、只核清单句本身**（`anchor` 起算、`until` 截断）：
# 本条 bullet 正文里还有依据行，依据行同样罗列 `@SuperBuilder`/`@AllArgsConstructor`
# （Project Lombok 官方文档那一段），故在 bullet 级核会被**同一个 bullet 的后半句**兜住
