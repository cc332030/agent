kind = "file_forbidden"
# 下面每一条都是**判据本体才有权写**的字样：模板文件自称“不重复那些判据”，出现任一即
# 第二真源。本轮补三条**此前漏网**的入口——它们的共同形态是“换一句话把同一条机制说第二遍”：
#   * 取值一的机制可绕过“忽略带泛型参数的 set”这四个字，改写成「链式 setter 会丢数据」
#     （模板侧原本就是这么写的：`BeanUtils` 拷贝 ⇒ 丢数据）；
#   * 取值二的机制可绕过“没有任何实例字段”（判据本体的写法），改写成“无实例字段”（模板侧原写法）；
#   * 判据本体的三处**取值名**（`补注解按提交与否分档` / `无参不加` / `集合默认加` 之外）还会以
#     “三项注解的取舍论证”形式被整段抄回——用“本集合自己的判据化取舍”这一**出处声明**
#     当锚点：该声明只在判据本体与图书馆写，模板侧只回指。
#      * 两档生效面的**取值本身**（“既有对象主动声明才补、存量不告警”）也会被整段抄回——
#        这是本文件最容易漏的一处（它读起来像“结论摘要”、不像判据），故用判据本体独有的
#        措辞 `存量不告警` 与 `不主动改既有对象` 当锚点；模板侧只回指、不复述取值。
forbidden = [
    "忽略带泛型参数的 set",
    "判定标准（任一命中即违规）",
    "无实例字段",
    "链式 setter 会丢数据",
    "是本集合自己的判据化取舍",
    "存量不告警",
    "不主动改既有对象",
]
message = "Java 数据对象模板防线被破坏：{file} 出现判据本体的机制/判定标准 {hit}——模板文件自称“不重复那些判据”，在此再抄一份即第二真源（两处各自漂移，正本文件示范重复）"

