# 『Java 数据对象模板防线』：模板文件（整段照抄的清单）与判据本体两处都不得被删或降级。
# 背景（用户口径）：数据对象模板属"要么不读、要么整份读完"的产物，故**单列成模板文件**、
# 不并进 `specs/stack/java.adoc`；但判据本体必须留在规范文件里（同一件事只有一处真源）。
# 失效形态有四类，逐类钉住：① 模板文件被删/被并回规范（回到"撑大规范又读不全"）；
# ② 判据本体从规范文件里消失（只剩模板清单，读者不知道"为什么补注解不加 `@Accessors`"）；
# ③ 加载门丢了（新建对象时该文件永不被加载）；④ 三处取值被删或降级。

[[guards.check_java_object_template_guard]]
file = "specs/stack/java-object.adoc"
groups = [
    [
        "模板文件的定位（模板 / 不是规范文件）",
        [
            "模板文件，不是规范文件",
            "要么不读、要么整份读完",
            "判据本体",
        ],
        "定位：模板文件须写明自己是**模板**、不是规范文件，并写明“要么不读、要么整份读完”的理由——缺则它会被当成又一份规范正文（读者在'没读完也能干'的错觉下只拿到半套模板），或被要求把判据搬回来（撑大规范文件）",
    ],
    [
        "模板侧不重复判据本体（只有回指）",
        [
            "不重复它们",
            "见判据本体",
        ],
        "**本文件的定位就是“不重复那些判据”**：模板侧只给“照抄时怎么用”，理由、机制与判定标准一律回指判据本体——缺则读者拿不到机制，遇“补注解也加上吧”会把 setter 补回去。取 `不重复它们` 这个**定位声明**当锚点，而不是复用它处的 `见判据本体`（后者已被三条取值组要求、恒在）",
    ],
    [
        "注解次序只回指 coding.adoc（不自带判据正文）",
        [
            "注解次序",
            "specs/general/coding.adoc`「命名与代码质量」的**注解排序**",
            "模板里的次序已按",
        ],
        "次序：模板侧须**点名** `coding.adoc`「命名与代码质量」的「注解排序」节、并写明“模板里的次序已按该规则排好”；**不得**把该判据的正文（名长升序、同名长按重要性、长度只算注解名）抄进模板侧——那是 `coding.adoc` 的正文第二真源。锚点取本条独有的整句：只核 `不在此重述` 会被同文件的「生效面」组兜住（本轮实测：抽掉次序回指后防线全绿）",
    ],
    [
        "加载触发特征",
        [
            "加载触发特征",
            "新建一个 Java 数据对象",
            "不加载",
        ],
        "加载门：模板文件须给出触发特征（新建数据对象 / 补注解）并写明“没有以上目的时不加载”——缺则新建对象时该文件永不被加载、模板形同不存在",
    ],
    [
        "整段模板（五项注解齐）",
        [
            "@Data",
            "@Accessors(chain = true)",
            "@SuperBuilder",
            "@NoArgsConstructor",
            "@AllArgsConstructor",
        ],
        "模板本体：整段照抄的清单须五项齐备（`@Data`/`@Accessors(chain = true)`/`@SuperBuilder`/`@NoArgsConstructor`/`@AllArgsConstructor`）——缺任一项时“照抄”照出来的是半套、且缺的那项没有任何替代提示",
    ],
