        ],
        "依据行：模板侧**只回指判据本体同一行**（材料名与三处取舍的论证只在判据本体写一份）；此处再列一遍即第二真源",
    ],
]
kind = "file_groups"
message = "Java 数据对象模板防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_java_object_template_guard]]
file = "specs/stack/java-object.adoc"
kind = "file_forbidden"
# 下面每一条都是**判据本体才有权写**的字样：模板文件自称“不重复那些判据”，出现任一即
# 第二真源。本轮补三条**此前漏网**的入口——它们的共同形态是“换一句话把同一条机制说第二遍”：
#   * 取值一的机制可绕过“忽略带泛型参数的 set”这四个字，改写成「链式 setter 会丢数据」
#     （模板侧原本就是这么写的：`BeanUtils` 拷贝 ⇒ 丢数据）；
#   * 取值二的机制可绕过“没有任何实例字段”（判据本体的写法），改写成“无实例字段”（模板侧原写法）；
#   * 判据本体的三处**取值名**（`补注解不加` / `无参不加` / `集合默认加` 之外）还会以
#     “三项注解的取舍论证”形式被整段抄回——用“本集合自己的判据化取舍”这一**出处声明**
#     当锚点：该声明只在判据本体与图书馆写，模板侧只回指。
#      * 两档生效面的**取值本身**（“既有对象主动声明才补、存量不告警”）也会被整段抄回——
#        这是本文件最容易漏的一处（它读起来像“结论摘要”、不像判据），故用判据本体独有的
#        措辞 `存量不告警` 与 `不主动改既有对象` 当锚点；模板侧只回指、不复述取值。
forbidden = [
    "忽略带泛型参数的 set",
    "判定标准（任一命中即违规）",
    "无实例字段",
    "链式 setter 会丢数据",
    "是本集合自己的判据化取舍",
    "存量不告警",
    "不主动改既有对象",
]
message = "Java 数据对象模板防线被破坏：{file} 出现判据本体的机制/判定标准 {hit}——模板文件自称“不重复那些判据”，在此再抄一份即第二真源（两处各自漂移，正本文件示范重复）"

# 判据本体侧**按条目自己的正文核**（`bullet_tokens`，不是整份文件、也不是整节）：
# `specs/stack/java.adoc`「编码」里条目众多、构造注解字样在相邻条目里同样出现
# （「对象创建统一用 builder」含 `@SuperBuilder`、「构造方法不手写」含 `@NoArgsConstructor`/
# `@AllArgsConstructor`）——按整节核时相邻条目会把从本条抽走的字样**兜住**，防线全绿。
# 本轮实测：原 `file_groups` 写法下抽掉本条正文里的 `@SuperBuilder` 后 **0 条报红**
# （与本 PR 立项时声称的「已改按条目自己的正文核」不符）。
[[guards.check_java_object_template_guard]]
bullet = "数据对象模板"
file = "specs/stack/java.adoc"
kind = "bullet_tokens"
message = "Java 数据对象模板防线被破坏：{file} 的「数据对象模板」条**本条自己的正文**缺失 {missing}——判据本体须自己承载这些要点；只剩“照抄模板文件”这一跳引用时，取值是否属于清单就只在模板文件一处说话（第二真源、两处各自漂移），且“缺 `@SuperBuilder` 也被读成合规”"
section = "编码"
# 本步核 bullet 正文的**后半段**（`until` 截断）：定位句及其后的三处判据都要核，
# 而末尾的**依据行**会把 `@SuperBuilder`/`@AllArgsConstructor` 等字样再列一遍（同一个
# bullet 的后半句兜住前半句的缺项），故核对对象截到依据行之前。五项齐备另由下面单独一步核。
tokens = [
    "specs/stack/java-object.adoc",
    "模板文件不是规范文件",
    "新增对象时加 `@Accessors(chain = true)`",
    "忽略带泛型参数的 set 方法",
    # 取值一的判据面取**本条独有**的正文锚点：`判定标准（任一命中即违规）` 这一短语在
    # 取值二/三处同样出现（取值二写「**判定标准**」、取值三写「**判定标准（任一命中即违规）**」），
    # 只核该短语时**同一个 bullet 的另两处**会兜住取值一被抽空的判定标准（本轮实测：
    # 抽掉取值一的判定标准句后仍全绿）。故锚到该句独有的正文。
    "在既有对象的补注解改动里加上了",
    "新建对象的注解清单缺",
    "没有任何实例字段",
    "集合字段默认加 `@Singular`",
    "没有单个元素入口",
    "存量不告警",
]
until = "依据（标准名/编号）"

# 「整段清单的五项齐备」**单列一步、只核清单句本身**（`anchor` 起算、`until` 截断）：
# 本条 bullet 正文里还有依据行，依据行同样罗列 `@SuperBuilder`/`@AllArgsConstructor`
# （Project Lombok 官方文档那一段），故在 bullet 级核会被**同一个 bullet 的后半句**兜住
# （本轮实测：抽掉清单里的 `@SuperBuilder` 后 bullet 级核仍全绿）。`until` 取
# `模板文件不是规范文件`——清单句以「。」收尾，其后的定位句不参与核对。
[[guards.check_java_object_template_guard]]
anchor = "注解清单整段照抄"
bullet = "数据对象模板"
file = "specs/stack/java.adoc"
kind = "bullet_tokens"
message = "Java 数据对象模板防线被破坏：{file} 的「数据对象模板」条**清单句**缺失 {missing}——判据本体须写明“整段照抄的清单包含哪五项注解”；缺任一项时该注解是否属于清单就只在模板文件一处承载（第二真源），且“缺 `@SuperBuilder` 也被读成合规”。本步按清单句切（不是整条 bullet）：依据行里同样罗列这些注解名，bullet 级核会被同一 bullet 的后半句兜住"
section = "编码"
tokens = [
    "@Data",
    "@Accessors(chain = true)",
    "@SuperBuilder",
    "@NoArgsConstructor",
    "@AllArgsConstructor",
]
until = "模板文件不是规范文件"

