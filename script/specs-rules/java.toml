            "不改写",
            "不得以「模板没写」为由绕过判据本体",
        ],
        "生效面：模板侧**只回指判据本体**并写明“本文件不改写判据、不得以‘模板没写’为由绕过”——两档取值（新增整段适用 / 既有对象主动声明才补 / 存量不告警）**只在判据本体写一份**；此处再复述一遍即第二真源（两处各自漂移，正是本文件的定位要防的）",
