# 调度器（`AGENTS_COMMON.adoc`）只核**触发特征**（「什么时候要加载、凭什么认出来」），
# 不核条目本体的取值/判据——那是被引文件的唯一真源（`terminology.adoc`「数据字典」
# 的反膨胀、`doc-design.adoc`「信息归属」）。原先这几组把条目**节标题/取值**当锚点
# （`评论不得删除`、`跨语言执行脚本的落点`、`src/main/resources/`），等于要求调度器
# 复述本体、与「同一件事只在一处给真源」直接冲突，已按可判读的触发特征放宽。
[[guards.check_comment_preservation_guard]]
file = "AGENTS_COMMON.adoc"
groups = [
    [
        "评论（要发评论/处置评论时即命中）",
        [
            "评论",
        ],
        "调度器须有本条的识别特征（要发评论或处置评论即命中）——否则该禁令永远不会被触发加载",
    ],
]
kind = "file_groups"
message = "评论不得删除防线被破坏：AGENTS_COMMON.adoc 缺失要点 {missing}——{desc}"

[[guards.check_external_script_guard]]
file = "AGENTS_COMMON.adoc"
groups = [
    [
        "跨语言执行脚本",
        [
            "跨语言",
            "SQL/Lua",
        ],
        "调度器的通用编码加载项须含该条识别特征（要把 SQL/Lua 等被调语言内联在宿主语言里时即命中；缺则永不加载）",
    ],
    [
        "跨语言执行脚本（Java 栈）",
        [
            "跨语言",
            "资源目录",
        ],
        "调度器的 Java 技术栈登记须含跨语言脚本的识别特征（缺则 Java 项目不知道需加载）",
    ],
]
kind = "file_groups"
message = "跨语言执行脚本防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_external_script_guard]]
file = "specs/general/coding.adoc"
groups = [
    [
        "资源文件夹",
        [
            "资源文件夹",
            "不得",
        ],
        "L1（a）落点：跨语言脚本须独立成文件放在资源文件夹、不得内联在宿主语言代码里（字符串字面量/拼接/模板/多行字符串）",
    ],
    [
        "扩展名",
        [
            "扩展名",
            "取被调语言自身的扩展名",
            "MyBatis",
        ],
        "L1（b）扩展名：须取被调语言自身的扩展名，无通用扩展名时取该技术明确支持的文件形式（如 MyBatis 的 `*.xml` 承载 SQL）——缺则退回无语义扩展名",
    ],
    [
        "从资源读取后执行",
        [
            "从资源读取后执行",
        ],
        "L1（c）读取方式：须写明脚本是按资源读取后执行，否则'放文件'会退化成'放文件但把内容读进字符串再拼装'，高亮与错误校验的收益随之消失",
    ],
    [
        "加载时机",
        [
            "加载时机",
            "性能敏感",
            "第一次使用",
            "classpath",
        ],
        "L1（d）加载时机：须写明性能敏感路径不得每次使用都去读资源——资源进 classpath 后发布即不变，须第一次使用时读取一次并缓存；缺则'争分夺秒'的调用（如 Redis 操作）会每次都去读一遍资源（用户报告的第二个场景）",
    ],
    [
        "需求要求内容会变",
        [
            "需求要求内容会变",
            "不适用缓存",
        ],
        "L1（d）反面边界：须写明需求要求内容会变的（如转 PDF 的 HTML 模板）不适用缓存、按是否需重读决定——缺则被读成'一律读一次缓存'，把需求的可变内容冻结在首次读到的版本上",
    ],
    [
        "判定标准",
        [
            "判定标准",
            "SELECT",
            "字符串拼接",
            "每次使用都重新读取",
        ],
        "判定标准：须给出可逐条核对的判定（宿主语言里出现被调语言语句文本、以拼接/格式化/插值/模板组装、扩展名不对、性能敏感路径每次重新读取），否则只剩口号、无法判定",
    ],
    [
        "反例",
        [
            "反例",
            "多行字符串",
        ],
        "反例：须点出典型反例（Java 拼 SQL、Lua 内联成字符串、shell 片段写进 Python 字符串），否则判据不可判定",
    ],
    [
        "OWASP",
        [
            "OWASP",
            "ISO/IEC 25010",
        ],
        "依据行：须标注标准名/编号（OWASP 参数化查询、可维护性、需求须可验证与性能效率），否则后人无从判断它还成不成立",
    ],
]
kind = "regex_section"
label = "跨语言执行脚本的落点（资源文件夹，不写字符串拼接/模板）"
message = "跨语言执行脚本防线被破坏：{file}「{EXTERNAL_SCRIPT_SECTION}」缺失要点 {missing}——{desc}；该条是用户明确要求的跨语言约定，不得删除、不得降级为建议"
pattern = "^== 跨语言执行脚本的落点（资源文件夹，不写字符串拼接/模板）(?:\\s|$).*?(?=^== |\\Z)"


# 『调度器不得抄条目本体』：对每条调度行，取其括号内的说明段，与**被引规范文件**的正文
# 做最长公共子串检测——超过阈值即报红。这是对上面那条"细节词"守卫的**补强**：细节词只能
# 拦「判定标准/任一命中」这类**措辞标记**，拦不住把**取值**成串抄进来（本轮实证的漏网形态：
# `@NoArgsConstructor`/`@RequiredArgsConstructor`/`@AllArgsConstructor`、
# `Tests`/`BootTests`/`PerfTests`/`IT`、`src/main/resources/`、`kebab-case`、
# `默认启用多线程构建`、`先解冲突、再压缩` 都被逐字抄进调度器、且既有守卫全绿）。
# 判据见 `specs/general/terminology.adoc`「数据字典」的「反膨胀」与
# `specs/general/doc-design.adoc`「信息归属」（同一件事只在一处给真源）。
[[guards.check_dispatcher_no_details_guard]]
file = "AGENTS_COMMON.adoc"
kind = "dispatcher_no_verbatim"
# 阈值取 14：低于它的重合多为主题名/文件基名这类本来就该出现的词（如 `新建数据对象`），
# 属巧合；到 14 字以上基本只可能是把本体成句抄了过来（实证：以 14 为界可拦下
# `持久化访问（数据库/缓存等）`/`组件/库/工具为主、要求每个类` 这类本体复述）。
min_overlap = 14
# 必加载层那几行本就只给路径与主题名（不涉及被引文件的取值），不参与检测。
ignore = [
    "必加载层（每次工作都加载）",
]
# **只作用于加载调度器那一节**：入口的「最高优先级铁律」是刻意写成"可先读、不必先加载
# 其他文件"的摘要（它每条都带"完整定义见…"），与本条要拦的"把条目本体抄进调度器不是同一件事。
scope_after = "== 分类与懒加载（加载调度器）"
scope_until = "== 技术栈扩展约定"
message = "调度器加载项与 `{ref}` 正文逐字重合 {overlap} 字：`{frag}`（AGENTS_COMMON.adoc:{line}）——调度器只写『哪个文件 + 何时加载』，条目的取值/判据一律写在该文件里；抄进调度器就是第二份会各自漂移的正文、还把常驻层撑大（判据见 specs/general/terminology.adoc「反膨胀」与 specs/general/doc-design.adoc「信息归属」）"
