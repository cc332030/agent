# 取规范脚本的**进度与停住**防线（用户口径：「显示文件下载进度及其他明细，下载完成不要关闭窗口」）。
#
# 两类事实分开核、互不替代：
#   ① **进度与明细**在逻辑代码这一侧（`script/fetch-specs.py`）：逐份打完即吐、写 stderr 并
#      flush、收尾有总账——攒到收尾统一打就等于没有进度（卡住时一行都看不见）。
#   ② **跑完停住**在入口这一侧（`script/fetch-specs.sh` / `.bat`）：判据只认「自己开着一个
#      终端」，管道/重定向/CI 里照旧立刻退出——反过来，若逻辑代码自己等输入，它被别的程序
#      调起时就成了一个不返回的命令（职责边界见 specs/general/script.adoc「跨环境脚本」）。
#
# 本轮实测的两条失效形态都写进了判据：①`_progress` 持锁后再调一个自己也取锁的函数 → 自锁、
# 第一份取完整轮挂住而进度行一行没打出来；②`.sh` 用 `exec` 跑逻辑代码 → 壳被换掉，后面
# 「取退出码 + 停住」那两段一行都不跑，窗口照旧秒关。

[[guards.check_fetch_progress_guard]]
file = "script/fetch-specs.py"
kind = "file_groups"
groups = [
    [
        "逐份打进度（取完一份即吐一行）",
        [
            "def _progress(",
            "sys.stderr.write(",
        ],
        "须有**逐份打进度**的执行体，且直接写 stderr——`download_one` 每份取完即调它（攒到收尾统一打就等于没有进度：卡住时一行都看不见，用户口径要的正是「显示文件下载进度」）",
    ],
    [
        "吞缓冲的 flush（管道与重定向下也看得见）",
        [
            "def _flush",
            "sys.stderr.flush()",
        ],
        "须**立刻 flush**：stderr 接到管道或重定向时是块缓冲，不 flush 就会攒到进程结束才吐——而「卡住时看得见卡在哪一份」正是这条的收益",
    ],
    [
        "进度带明细（份数/状态/字节/耗时）",
        [
            "_DONE}/{total}]",
            "seconds:.1f",
        ],
        "进度行须带**明细**（已取份数/总数、状态、字节、耗时）——只打一串点或只打「正在下载」时，用户看不出取了哪些、差多少（口径是「进度**及其他明细**」）",
    ],
    [
        "自锁这一条要写进注释（`threading.Lock` 不可重入）",
        [
            "不可重入",
            "自锁",
        ],
        "计数与写出须在**同一段临界区**里、且注释写明「`threading.Lock` 不可重入、持锁后再调自己取锁的函数就是自锁」——本仓库实测：分开取锁时第一份取完就整轮挂住，而进度行一行都没打出来（这种挂起没有任何输出，最容易被当成「还在下载」）",
    ],
    [
        "分子只数终态（重试那一行不推进）",
        [
            "counts=False",
            "重试",
        ],
        "进度分子须只数**这一份的终态**：重试那一行不是终态（它接着还要再取一次），数进去收尾就会出现 `[48/47]`——分子与分母一旦对不上，这一整屏数字就没法拿来核对",
    ],
    [
        "收尾给总账（共取几份、用时）",
        [
            "共取 {len(results)} 份",
            "用时",
        ],
        "收尾须给**总账**（共取几份、用时）：进度行是逐份流水账，人看完那一屏需要一行能核对「这批是不是全取到了」的结论",
    ],
    [
        "进度走 stderr、结果走 stdout",
        [
            "stdout 仍只留落点与结果",
        ],
        "须写明**进度走 stderr、结果走 stdout**——调用方会拿 stdout 做重定向，进度混进去就是「结果里多了一堆噪音」（本仓库实证：有人把落点里的文件当成命令 stdout）",
    ],
]
message = "取规范进度防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_fetch_progress_guard]]
file = "script/fetch-specs.py"
kind = "section_groups"
section = "输出（用户口径：「显示文件下载进度及其他明细，下载完成不要关闭窗口」）"
groups = [
    [
        "停住窗口是入口的事、不是脚本的事",
        [
            "入口的事",
            "不关窗口",
        ],
        "头部须写明**跑完不关窗口是入口的事**（逻辑代码自己探测终端、等一次回车，它被别的程序调起时就变成一个不返回的命令）——职责边界见 specs/general/script.adoc「跨环境脚本」",
    ],
    [
        "入口停住只在有终端时（管道/CI 照旧立刻退出）",
        [
            "管道",
            "立刻退出",
        ],
        "同一节须写明入口**只在有终端时停住**：管道、重定向、CI 里照旧立刻退出——给自动化挂上一个「永久不返回」的命令，正是 specs/general/verify.adoc 那类失效",
    ],
]
message = "取规范进度防线被破坏：{file}「输出」缺失要点 {missing}——{desc}"

[[guards.check_fetch_progress_guard]]
file = "script/fetch-specs.sh"
kind = "file_groups"
groups = [
    [
        "跑完停住（用户口径：下载完成不要关闭窗口）",
        [
            "按回车键关闭窗口",
            "read -r _",
        ],
        "入口须在**自己开着终端**时跑完停住：双击启动的窗口是入口自己开的，逻辑代码一退出就跟着关，进度与失败清单连看都来不及看（用户口径：「下载完成不要关闭窗口」）",
    ],
    [
        "不得用 `exec`（换了壳就没有停住的机会）",
        [
            '"$runtime"',
            "status=$?",
        ],
        "须跑同一个解释器进程、**取它的退出码再决定停不停**（`status=$?` 与停住这段必须够得着）——本仓库实测：`exec` 把壳换掉之后，后面取退出码与停住那两段一行都不跑，窗口照旧秒关",
    ],
    [
        "无终端时立刻退出（不给自动化挂上不返回的命令）",
        [
            '-t 0',
        ],
        "停住的判据须**只认「自己开着一个终端」**（标准输入挂在终端上）：管道、重定向、CI 里没有终端，停住会让整套自动化挂在一个永不返回的命令上",
    ],
]
message = "取规范进度防线被破坏：{file} 缺失要点 {missing}——{desc}"

[[guards.check_fetch_progress_guard]]
file = "script/fetch-specs.bat"
kind = "file_groups"
groups = [
    [
        "跑完停住（cmd /c 给自己开窗并加提示）",
        [
            "cmd /c",
            "pause",
        ],
        "入口须在**自己开窗时**跑完停住（`cmd /c \"… & pause\"`：没有控制台就新开一个窗口、有控制台就直接跑）——窗口是入口自己开的，逻辑代码一退出就跟着关，进度与失败清单连看都来不及看（用户口径：「下载完成不要关闭窗口」）",
    ],
    [
        "退出码先存下来再原样返回（不被停住改掉）",
        [
            "set \"FETCH_SPECS_STATUS=%errorlevel%\"",
            "exit /b %FETCH_SPECS_STATUS%",
        ],
        "退出码须**先存下来**再原样返回——`pause` 自己会改 errorlevel，直接 `exit /b %errorlevel%` 会把一次失败报成成功（「失败也成功」）",
    ],
    [
        "不在用户的控制台里插提示",
        [
            "do not disturb",
        ],
        "注释须写明**不在用户已有控制台里插提示**（那会像一个卡住的命令、吃掉下一次按键，见 specs/stack/windows.adoc）——停住只属于入口自己开的那个窗口",
    ],
]
message = "取规范进度防线被破坏：{file} 缺失要点 {missing}——{desc}"
