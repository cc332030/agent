# 『界面与样式』防线规则数据。
#
# 判据本体在 `specs/general/coding.adoc`「界面与样式」——**公共内容**（对任何产出界面的项目成立，
# 不限语言与端）。前端载体在 `specs/stack/web.adoc`（技术栈层），它**只给载体、不另立判据**。
#
# 本条防的失效：AI 写界面习惯**从零开始**——没有 UI 框架时，各个位置的同一套东西（按钮、卡片、
# 表单控件）被各写一套，从业务角度看是同一件事，展示出来却是好几种样式。
# 用户口径：**可以从零开始写，但不能每个地方都从头写；对 UI 做统一管理、避免各自为政**；
# **优先取现有的 UI 框架与开源样式方案**；**逆向一个网页时为与原来一致，从零写是正当情形**。

# ① 判据本体：通用层整节（框架优先、同一形态一个来源、全局外观一处、无障碍取框架所给、
# 从零写的唯一正当情形、从零也须收在一处、存量边界、依据行）。
[[guards.check_ui_style_guard]]
file = "specs/general/coding.adoc"
section = "界面与样式"
kind = "section_groups"
token_list = "UI_STYLE_ANCHORS"
message = "『界面与样式』防线被破坏：{file}「界面与样式」缺失要点 {missing}——{desc}；该条对应用户点名要求（优先用现成 UI 框架与开源样式方案、同一形态只许一个样式来源、不得每处从头写），不得删除、不得降级"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错（"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_ui_style_guard]]
file = "specs/general/coding.adoc"
section = "界面与样式"
kind = "anchor_count"
token_list = "UI_STYLE_ANCHORS"
min = 53

# ② 前端载体：技术栈层只给载体、不另立判据（第二真源由本组反向钉住）。
