# ③ 加载门：调度器须登记界面识别特征——缺则写界面时永不触发加载（判据存在而走不到）。
[[guards.check_ui_style_guard]]
file = "AGENTS_COMMON.adoc"
kind = "file_tokens"
tokens = [
    "识别特征（含**界面**与**样式优先级**、**页面内容多**到要分组）",
    "**前端界面载体**",
    "一页内容的分组怎么摆、要不要给页内检索",
]
message = "『界面与样式』防线被破坏：{file} 缺失要点 {missing}——调度器须在「任何代码活动」与前端栈两处登记界面的识别特征（含样式优先级的触发：要写/改选择器或考虑要不要加 `!important` 时），缺则执行者写页面/样式时永不加载该节，判据存在却走不到"

# ④ README 目录说明同步（读者按 README 学习时须知道有这条规则）。
[[guards.check_ui_style_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "**界面与样式（任何语言、任何端",
    "**界面的取用入口与唯一落点**",
    "**分组组织与页内检索的载体**",
]
message = "『界面与样式』防线被破坏：{file} 缺失要点 {missing}——README 的目录说明须同步登记该条（通用层 `coding.adoc` 与栈层 `web.adoc` 两处），否则读者按 README 学习时无从知道有这条规则"

# ============================================================================
# 『同一件事只有一个来源』（`check_same_thing_one_source_guard`）
#
# 与上面『界面与样式』是**同一条判据的两档**：用户追问"功能也算吧？工具类也算吧？还能扩到
# 哪些地方？"——答案是把"同一套东西只许一处来源"铺到界面之外：功能（业务上同一件事各写
# 一套分支）、工具类（同一能力在两个 Utils 里各一份）、数据契约、配置、校验规则。
# 用户还给了**为什么先提界面**：样式只有人眼看到才知道有问题；功能与工具类一不一致，结果就
# 不同、甚至报错，能查出来——**只是底层还是各自为政**。故本条把"能查出来"与"会收敛"分开，
# 并要求重复须有能自动发现它的手段。
#
# 判据本体在 `specs/general/coding.adoc`「界面与样式」的「同一件事只有一个来源（不限界面，
# 任何语言）」；栈层只给载体（Web 的前后端契约、Java 的工具方法落点），不另立判据。

# ① 判据本体：通用层该小节（两档后果、识别判据、五条 L1、例外、存量边界、依据行）。
[[guards.check_same_thing_one_source_guard]]
file = "specs/general/coding.adoc"
subsection = "同一件事只有一个来源（不限界面，任何语言）"
kind = "subsection_groups"
token_list = "SAME_SOURCE_ANCHORS"
message = "『同一件事只有一个来源』防线被破坏：{file} 该节缺失要点 {missing}——{desc}；该条对应用户点名要求（功能与工具类同样算、同一套东西不得各处各写一套、删掉重复后底层仍各自为政），不得删除、不得降级"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错。
[[guards.check_same_thing_one_source_guard]]
file = "specs/general/coding.adoc"
subsection = "同一件事只有一个来源（不限界面，任何语言）"
kind = "anchor_count"
token_list = "SAME_SOURCE_ANCHORS"
min = 37

# ② 界面那一档的入口（本条的处置次序是"先界面、再其余"）：上一节须指向这一档。
[[guards.check_same_thing_one_source_guard]]
file = "specs/general/coding.adoc"
section = "界面与样式（任何语言、任何端）"
kind = "section_groups"
groups = [
    [
        "为什么界面排在最前（指回下一档）",
        [
            "**为什么界面排在最前**",
            "**唯一没有可执行判据**的一类",
            "下节「同一件事只有一个来源」",
        ],
        "缺则两条各自成篇：读者读不出为什么先治界面、也读不出界面只是同一条判据里没有判据的那一档",
    ],
]

# ③ 栈层只给载体、不另立判据（Web 的前后端各一份时契约落在哪、Java 的工具方法落在哪）。
[[guards.check_same_thing_one_source_guard]]
file = "specs/stack/web.adoc"
subsection = "前后端各一份时的契约载体"
kind = "subsection_groups"
groups = [
    [
        "契约的唯一来源与判定标准",
        [
            "**契约的唯一来源（载体）**",
            "**由它生成或对照核验**",
            "那条例外判",
        ],
        "缺则前后端各写一份字段/校验规则无处收敛：例外①只剩一句许可、没有载体，两侧各写一份照样过",
    ],
]
[[guards.check_same_thing_one_source_guard]]
file = "specs/stack/java-syntax.adoc"
section = "工具类使用约定"
kind = "section_groups"
groups = [
    [
        "同一能力只留一个工具方法与一个工具类（Java 落点）",
        [
            "**同一能力只留一个工具方法与一个工具类（Java 侧的载体，不构成 Java 专属规则）**",
            "`specs/general/coding.adoc`「同一件事只有一个来源」",
            "**落点**",
        ],
        "缺则通用层的「工具类也算」在 Java 侧没有落点：判据在通用层、取用位置无人指，同一能力继续在两个 Utils 里各一份；且这处只写「Java 落点」会被读成 Java 专属规则（通用层那条对任何语言都成立）",
    ],
]

# ④ 加载门：调度器须登记「同一件事长出第二份来源」的识别特征——缺则判据存在而走不到。
[[guards.check_same_thing_one_source_guard]]
