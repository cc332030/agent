    ],
    [
        "取用入口（框架与样式方案）",
        [
            "**框架与样式方案的取用入口（L2）**",
            "项目包清单里已引入的组件库与样式方案",
            "公共组件目录与全局样式落点",
        ],
        "缺则前端这一半只剩通用层口号：先看哪儿取现成方案没有落点，执行者仍会就地手写",
    ],
    [
        "同一形态的唯一落点（载体）",
        [
            "**同一形态的唯一落点（载体）**",
            "第二个文件里出现一份复制或就地重写",
        ],
        "缺则「同一形态只许一个样式来源」落不到具体位置，页面里各写一套照样过",
    ],
    [
        "框架默认外观与复刻的落点",
        [
            "**改造框架默认外观的落点（载体）**",
            "**逆向/复刻与设计稿的载体**",
        ],
        "缺则覆盖框架外观散在使用点、复刻时的差异清单没有落点（同一属性多处覆盖）",
    ],
    [
        "`!important` 的落点（载体）",
        [
            "**`!important` 的落点（载体）**",
            "页面级的就地样式里",
        ],
        "缺则通用层那条只有次序没有落点：`!important` 散到页面级就地样式里、或在同一段里层层加码，而栈层读不到它该写在哪一处",
    ],
    [
