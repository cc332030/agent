# ④ 图书馆侧登记（本集合取舍 + 外部材料未规定该层 + 实证）：上面三条锚点组里"本集合自己的
# 判据化取舍""没有任何材料规定"在 `library/adoption.adoc` 的别条目里反复出现，按整份文件核时
# 把本条登记行整条删掉也报不出来。故**按那一行核**（`line_tokens`，锚点取该行内只出现一次的词）。
[[guards.check_ui_style_guard]]
file = "library/adoption.adoc"
kind = "line_tokens"
anchor = ["内容多的页面按分组组织", "本集合自己的判据化取舍"]
tokens = [
    "**没有任何材料规定**",
    "**没有**规定",
    "**未**规定",
    "**检索须落在全页那一层**",
    "**本项目实证**",
]
message = "分组组织与页内检索防线被破坏：{file} 的该条登记行缺失 {missing}——本集合的取值须如实标注外部材料**未**规定该层（防读者把它读成标准规定），并须保留『检索须落在全页那一层』与实证出处"
