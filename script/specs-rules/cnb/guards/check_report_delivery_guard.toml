# 『汇报须送到发起人手里』防线（**本仓库实证失效**）。
#
# 实证：一轮 NPC 任务做完了改动、跑完了校验、`git push` 也推了，**PR 下一条新评论都没有**
# ——发起人只能再发一条评论追问「你的结果回复到哪里了？需要修复此问题」。执行者的最终输出
# 里有汇报，但那个输出**没落到任务单的评论上**，读者拿到的仍是零。
#
# 失效成因不是"没写汇报"，而是两条判据各自只写了一半：
#   - 交付片段管的是**汇报的内容与通道数**（一条完整汇报 / 必须停下确认），
#     从没说过"这条汇报要**发出去**"；
#   - 平台层管的是"往哪派"（评论 = 派发入口）与"不得自派"，**回程没有对称的一条**。
# 于是"写了但没发"在两个缺口之间落地，而所有文本防线都报绿。
#
# 判据本体：通用侧口径在 `prompts/_common.txt` 的 `delivery` 片段（片段会被复制到未知项目），
# 平台侧的**送达形态**在本文件指向的那一节——两处各管一半，不各写一份。
[[guards.check_report_delivery_guard]]
kind = "file_groups"
file = "specs/platform/cnb.adoc"
groups = [
    [
        "收尾汇报须在该任务单下新增一条评论（L1）",
        [
            "收尾汇报须在唤起你的那处任务单下新增一条评论（L1，本平台实证失效）",
            "**只有一个形态**",
        ],
        "须有该 L1 条并把送达形态写死成**在唤起你的那处任务单下新增一条评论**——只写『要汇报』时，执行者会把『我的最终输出里有汇报』当成已经回复（本仓库实证：推了提交、PR 下零评论）",
    ],
    [
        "自己的输出不算送达",
        [
            "执行者自己的最终输出、会话内的自述、提交说明都不算送达",
        ],
        "须点名『自己的输出/会话自述/提交说明不算送达』——不点名时，最省事的那条路（输出里写一段）看起来与『发出去了』等价",
    ],
    [
        "三条判定标准",
        [
            "有改动、已提交推送，而该任务单下**一条新评论都没有**",
            "把\"我在自己的输出里写了汇报\"当成已经回复",
            "把结论留在别处",
        ],
        "须给可逐条核对的判定标准（一条新评论都没有 / 把自己的输出当已回复 / 结论留在别处）——缺则『算不算送达』回到执行者自述",
    ],
    [
        "与『不得自派』的分工",
        [
            "与「不得以评论派发唤起自己」是两件事",
            "不得以评论派发唤起自己",
            "互不豁免",
        ],
        "须与『不得以评论派发唤起自己』划清分工（那条禁点名唤起、本条要结论回给发起人）——不划清时，执行者会用『不许发评论』把回帖一起免掉，这正是本条的失效形态之一",
    ],
    [
        "内容口径回指交付片段",
        [
            "prompts/_common.txt",
            "`delivery` 片段",
            "只补**平台侧的送达形态**",
        ],
        "汇报**内容**的口径须回指 `delivery` 片段、本处只管送达形态——两处各写一份正文时，改一处必漏另一处",
    ],
]
message = "『汇报须送到发起人手里』防线被破坏：{file} 缺失要点 {missing}——{desc}；本条对应用户报告的真实失效（一轮任务推了提交、任务单下一条评论都没有，发起人只能追问『你的结果回复到哪里了』），不得删除、不得降级为建议"

# 通用侧：片段会被复制到未知项目执行，只写平台层那一份时，复制出去的提示词仍在缺口里。
[[guards.check_report_delivery_guard]]
kind = "file_groups"
file = "prompts/_common.txt"
groups = [
    [
        "汇报须真的送到发起人手里",
        [
            "汇报须真的送到发起人手里",
            "必须在该任务单下新增一条评论",
        ],
        "公共片段须写入同口径（『写了汇报』不等于『发出去』；平台上须在任务单下新增一条评论）——片段是全项目共用的一份，缺则每一份提示词都少了这一步",
    ],
    [
        "判据是这条评论发出去没有",
        [
            "判据是这条评论发出去没有",
            "按**没有交付**判",
        ],
        "须给可核对的判据（这条评论发出去没有）与后果（按没有交付判）——只写『要发出去』时，『发了算不算』仍由执行者自述",
    ],
]
message = "『汇报须送到发起人手里』防线被破坏：{file} 缺失要点 {missing}——{desc}；片段会被复制到未知项目执行，缺则每一份提示词都少了『汇报要真的发出去』这一步"
