kind = "file_groups"
message = "NPC 禁合并防线被破坏：{file} 缺失要点 {missing}——{desc}；本条是『用户明确要求也不照做』的唯一一类操作，最易被『顺手满足用户』冲掉，不得删除、不得降级为建议（L1）"
[[guards.check_npc_merge_guard]]
end_by = "end::delivery[]"
file = "prompts/_common.txt"
groups = [
    [
        "合并一律不做",
        [
            "合并一律不做",
            "无环境区分",
        ],
        "公共片段 `delivery` 须含『合并一律不做（L1，无环境区分）』一条",
    ],
    [
        "直接授权",
        [
            "直接授权",
            "也必须拒绝",
            "授权不免除",
        ],
        "公共片段须写明人工直授也必须拒绝、授权不免除（提示词会被复制到未知项目执行）",
    ],
]
kind = "split_block"
message = "NPC 禁合并防线被破坏：{file} 的 `delivery` 片段缺失要点 {missing}——{desc}；提示词会被未知项目复制执行，漏了这层则复制出去的那份没有这条禁令"
split_by = "tag::delivery[]"

# 题面侧（`intro-rules` 片段）：按片段的 tag 取块，而不是按 `delivery` 取——
# 该句写在题面开头，是执行者最先读到、读取路径最短的那一层（本仓库实证：只把口径
# 登记在 `delivery` 里不够，题面只写"合并提交"时执行者会读成"合并 PR"直接合了）。
[[guards.check_npc_merge_guard]]
end_by = "end::intro-rules[]"
file = "prompts/_common.txt"
groups = [
    [
        "任务的「最后一个动作」按原话取值",
        [
            "任务的「最后一个动作」按原话取值",
            "不得自行追加",
            "合并提交",
            "合并 PR",
        ],
        "题面侧须写明『「合并提交」＝压成一个提交、不是合并 PR』（**本仓库实证**：题面只写「合并提交」，执行者读成「合并 PR」直接合了、还跳过了真正被要求的压缩提交）",
    ],
]
kind = "split_block"
message = "NPC 禁合并防线被破坏：{file} 的题面开头（`intro-rules` 片段）缺失要点 {missing}——{desc}；题面是最先被读到的一层，漏了这里则「合并提交」会被读成「合并 PR」"
split_by = "tag::intro-rules[]"
