        [
            "人工要求",
            "直接授权",
            "必须拒绝",
            "授权不免除",
        ],
        "无豁免：人工明确要求/直接授权也必须拒绝，且写明『授权不免除该禁令』",
    ],
    [
        "按执行环境保证",
        [
            "按执行环境保证",
            "独立于被合并 PR 的源分支",
            "不许把",
            "可核对的判据",
        ],
        "保证面：本条须写明『与谁在跑无关』（判据对 NPC 与人工场景一律成立、不得把『我知道这条规则』当保证、人以外的自动步骤不构成人工）——否则禁令退化成『靠某个 agent 自觉』，换一个执行者/换一条入口即失效",
    ],
    [
        "本仓库实证失效",
        [
            "本仓库实证失效",
            "压缩提交",
            "已合并",
            "凭据可用",
        ],
        "失效记录：须留下本仓库实际发生的那次（把用户的『压缩提交』读成『合并 PR』、跳过真正被要求的那件事直接合并，且三道防线全绿）与三处成因（凭据可用 / 『合并』的字面诱惑 / 没有交付终点）+ 固定形态『最后一个动作的默认读法是交付到 PR 分支为止』——删除该记录等于抹掉『为什么会发生』，同一形态会重演",
    ],
    [
        "判定标准",
        [
            "判定标准",
            "合并动作",
            "豁免",
            "顶替",
            "merge-pull",
        ],
        "判定标准：须给出可逐条核对的违规形态（执行了合并/以授权为由豁免/转交他人顶替）并**点名本平台实际的合并入口**（`cnb pulls merge-pull`，否则「合并在哪做」无处核对），否则只剩一句口号、无法判定",
    ],
    [
        "不是合并",
        [
            "不是合并",
            "解决冲突",
            "同步目标分支",
        ],
        "边界：明确『推送分支/解决分支内冲突/同步目标分支都不是合并』，避免与「冲突处理」节的自动解决冲突自相矛盾、也不误伤合法操作",
    ],
    [
        "== 分支与合并请求统一",
        [
            "== 分支与合并请求统一",
            "共用这一个分支",
        ],
        "同文件既有规则不得被新节顶掉（本轮实测犯过：新增节点把「冲突处理」整段替换掉，规则凭空消失而 check_specs.py 全绿——文件只是变短、无引用悬空）：「分支与合并请求统一」须在且含『并行任务共用这一个分支』（原措辞『只能修改同一个分支』在「一个 issue 一个 PR」改写中并入同一句，判据未减）",
    ],
    [
        "== 冲突处理",
        [
            "== 冲突处理",
            "自动解决冲突",
        ],
        "同文件既有规则不得被新节顶掉：「冲突处理」须在且含『自动解决冲突』",
    ],
