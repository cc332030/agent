# 『一个 issue 一个 PR、不私开分支与 PR』防线（**用户点名**：「本 pr 处理，未经允许，不允许
# 私开 pr」「一个issue对应一个pr」「不允许私自开立新分支和新pr」）。
# 失效形态（本仓库实证过两次）：执行者发现当前 PR 之外还有问题，就**自己另开一个 PR +
# 分支**，把同一批工作拆成两处——用户要求的「本 PR 处理」被读成「另开一处处理」；同一个
# issue 下并行/接续的任务各自新建分支与 PR，则该 issue 的改动散落在多处、无从一并合入。
# 故判据本体落在平台层「分支与合并请求统一」这一节（分支策略的同节条，不另立一节），
# 提示词侧落在 `delivery` 片段（提示词会被未知项目复制执行，只写平台层则复制出去的那份
# 没有这条边界）。**承载位置不随任务内容变化**与**找不到承载它的 PR 时停下问**是本轮
# 补上的两处：前者拦「这次任务不一样，另开一处」，后者拦「没有就先自己建一个」。
