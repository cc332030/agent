# 『环境已给承载分支时不得另建分支』的**判据措辞侧**。
#
# 与 `check_branch_reuse_guard`（动作侧：读本次执行的仓库里有几条分支）成对：那一道只在
# 真仓库里成立，这一道只核 `script/check_specs.py` 里的要点、与仓库状态无关——两者分开，
# 夹具换根时报的是"这一份要点在不在"，而不会混进"仓库里没那份脚本"。
#
# 本条防的失效（本仓库实证，两次）：平台层与 `delivery` 片段都写着「不得另建分支」，执行者
# 仍另开了分支与 PR，而文本侧三道防线全部报 OK——文本侧只证「规则写着」、证不了「动作没做」。
# 故动作侧的判据本体写在脚本函数体里（`_carrier_branches` / `_branch_forked_from_head`），
# 本文件钉住它**没被改写**：承载分支只能从环境取、"另建"只能按分叉关系判、核对面只能是本地分支。

[[guards.check_branch_reuse_rules]]
kind = "file_groups"
file = "script/check_specs.py"
groups = [
    [
        "承载分支只能从环境取",
        [
            "def _carrier_branches(",
            "CNB_PULL_REQUEST_BRANCH",
            "CNB_BRANCH",
            "CNB_DEFAULT_BRANCH",
        ],
        "承载分支须**从环境取**（`CNB_PULL_REQUEST_BRANCH`，或非默认分支的 `CNB_BRANCH`）——让执行者自报「我在哪个分支上干活」时，这条防线就退化成它自己的自觉（这正是本仓库两次失效的形态）",
    ],
    [
        "「另建」的判据是分叉自当前 HEAD",
        [
            "def _branch_forked_from_head(",
            "merge-base",
            "rev-list",
            "--count",
        ],
        "「另建」须落成可核对的形态：分叉点＝当前 HEAD（或分叉点在 HEAD 历史里而该分支另有提交）——只看名字、只看「远端有没有这个分支」都拦不住那一步",
    ],
    [
        "核对面是本仓库的本地分支",
        [
            "refs/heads",
            "git for-each-ref",
        ],
        "核对面须是**本仓库的 `refs/heads`**（平台的一次性工作区会把所有分支都取回来，按 `refs/remotes` 判等于判「别人早就建过」），且报错文案里给出核对命令——读者要能自己把那句话重跑一遍",
    ],
    [
        "报错须点名规则与「说了这件事不构成授权」",
        [
            "分支与合并请求统一",
            "delivery",
            "不得另建分支",
        ],
        "报错文案须回指规则本体并点明**用户在评论里说了这件事不构成授权**——那正是本仓库两次失效的共同读法；不写这一句，下一个人会照旧读成默许",
    ],
]
message = "『环境已给分支时不得另建分支』的判据被破坏：{file} 缺失要点 {missing}——{desc}；本条是文本侧三道防线的另一半（文本侧只证「规则写着」、证不了「动作没做」），删了它，规则再全也拦不住另建分支"
