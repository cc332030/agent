[[guards.check_script_selfdoc_guard]]
file = "specs/general/script.adoc"
groups = [
    [
        "单打独斗",
        [
            "单打独斗",
            "相互独立",
        ],
        "须写明脚本**默认单打独斗**、拆成多个脚本时**各脚本相互独立**（不是同一模块）——缺则多脚本会被当成'一个多模块项目'、按模块给每个脚本各建一篇文档",
    ],
    [
        "多行文档注释",
        [
            "多行文档注释",
            "多行普通/块注释",
            "普通注释",
        ],
        "须写明承载方式的**三级优先级**（多行文档注释 → 多行普通/块注释 → 普通注释）——缺则'写在脚本里'没有可判定的形态，文档头会被降格成零散单行注释",
    ],
    [
        "不另建独立文档",
        [
            "不另建独立文档",
            "一律用**文档注释**承载",
        ],
        "须写明文档**默认写在脚本里、不另建独立文档**，并写明有文档注释机制的语言一律用文档注释承载——缺则'为脚本另建 .adoc'重新成为默许形态",
    ],
    [
        "不许「一个脚本 ↔ 一个文档」的对应关系",
        [
            "不许「一个脚本 ↔ 一个文档」的对应关系",
            "一一对应",
            "个数同步增减",
        ],
        "须写明**不允许一个脚本对应一个文档**并给可判定判据（独立文档与脚本一一对应、个数同步增减即命中）——缺则'按功能命名'会被当成擦边许可：文档仍是一个脚本一篇，只是名字换了个说法",
    ],
    [
        "按**功能**命名",
        [
            "按**功能**命名",
            "擦边许可",
            "一组功能相关的脚本共同指向",
        ],
        "超容量移交时须写明按**功能**命名是**实质要求、不是擦边许可**（一篇文档由一组功能相关的脚本共同指向，实现上一个脚本一篇即属一一对应）——缺则移交出口变成给每个脚本各建一篇的后门",
    ],
    [
        "超出头部块注释的容量",
        [
            "超出头部块注释的容量",
            "命中即违规",
        ],
        "须写明**唯一例外**是内容确已超出头部块注释容量时的移交，并给判定标准——缺则'能拆成两处写'会被当成另建文档的理由（判据是内容量、不是能不能拆）",
    ],
    [
        "大规模团队式协作",
        [
            "大规模团队式协作",
            "例外，不是默认",
        ],
        "须写明**大规模团队式协作是例外、不是默认**——缺则该例外会外推成所有脚本的默认文档组织",
    ],
    [
        "外侧只登记",
        [
            "外侧只登记",
            "一句话用途",
            "不搬用途说明",
        ],
        "须写明**外侧登记面只写一句话用途 + 链接、不搬脚本的用法**（README/项目规范的工具清单、索引页里不得出现参数名/默认值/退出码表/示例命令），并写明它是 `specs/general/doc-design.adoc`「信息归属」在脚本上的落点、**不另立一套判据**——缺则'用法写在脚本自身的说明'只单向成立：脚本头部有了、README 里再抄一份正文，同一份契约两个来源（改脚本头部必漏外侧），本条要防的失效照旧",
    ],
]
kind = "regex_section"
label = "脚本文档的承载位置与协作粒度（默认写进脚本自身）"
message = "脚本自述文档防线被破坏：{file}「{SCRIPT_SELFDOC_SECTION}」缺失要点 {missing}——{desc}；本条依据用户口径（脚本单打独斗、文档直接写在脚本里、多行文档注释/多行普通注释/普通注释三级优先级），不得删除或降级"
pattern = "^== 脚本文档的承载位置与协作粒度（默认写进脚本自身）(?:\\s|$).*?(?=^== |\\Z)"

# `doc-design.adoc`「信息归属」的通用条：**用法写在被使用的那一份里、外层登记只写这是干什么用的**。
# 与本道防线同属"用法文档的归属"，故并入同一道防线（不新开防线、不虚增接线数）：
# 脚本侧的可判定形态（外侧只登记不搬用途）由上面那步核，通用条本体由本步核。
#
# `file` 只写**指向哪一份文档**（`subsection_groups` 自己取该文件的小节；
# 这一格不参与核对）：通用条正文里那句"外层登记只写一句话用途"，
# 与脚本侧条目的锚点字面同名，**不能走上面的 `file_groups` 按整份 `doc-design.adoc` 核**
# ——那样核到的是全文、命中的是别处的同形字样（本轮实测）。
[[guards.check_script_selfdoc_guard]]
file = "specs/general/doc-design.adoc"
groups = [
    [
        "用法与细节写在被使用的那一份里",
        [
            "用法与细节写在被使用的那一份里",
            "外层登记只写",
            "这是干什么用的",
        ],
        "须写明**面向使用者的说明只写在被使用的那一份里**（代码→文档注释、脚本→头部、配置/组件→自身说明位），**外层登记面（README/规范/目录说明/索引页/工具清单）只写一句话用途 + 链接**——缺则'用法写在使用者眼前那一份'只对代码成立，脚本/配置/工具的用法又跑进 README 或规范，同一份契约两个来源",
    ],
    [
        "只管位置",
        [
            "只管位置",
            "留一行链接",
        ],
        "须写明本条**只管位置、内容一条不少**（该记的仍要记全、只是记在对象自身处），并给超出容量时的移交出口——缺则'别写太长'被读成'用法可以不写'，内容要求被折成字数",
    ],
]
kind = "subsection_groups"
message = "用法文档归属（外层只登记、不搬用法）防线被破坏：{file}「信息归属」缺失要点 {missing}——{desc}；本条对应用户明确要求（单个脚本的使用说明写在脚本自己的文档/注释里，不在规范或 README 里写长篇大论），且是'扩展到非脚本内容'的通用落点，不得删除、不得降级为建议"
subsection = "信息归属（同一信息只写一处）"

# 「文件命名」节里的命名条：与上面那节同属「不允许一个脚本对应一个文档」，
# 但坐落在**另一个二级节**——按节取锚点时核不到它，故单独一步核（缺则实现层判据无人守）。
