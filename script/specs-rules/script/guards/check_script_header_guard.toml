[[guards.check_script_header_guard]]
file = "specs/general/script.adoc"
groups = [
    [
        "文档头先行",
        [
            "文档头先行",
            "头部注释必须先行",
            "待办占位",
        ],
        "须写明**头部注释先行**（动手第一步就写、不是收尾补；不得只留 `TODO`/待补占位；改动后同提交同步）——缺这句，本条退回成'要写文档'，交付时文档头与实现早已不同步",
    ],
    [
        "脚本必须写文档头",
        [
            "脚本必须写文档头",
        ],
        "须写明**脚本必须写文档头**（承担实际功能的脚本都要有条目化文档头；只有一次性几行的临时命令可省并仍须一行用途）——缺则'没有文档头的脚本'仍是默许形态",
    ],
    [
        "**关键约定与设计决策**（**不得省略**）",
        [
            "**关键约定与设计决策**（**不得省略**）",
            "放弃了哪些备选",
        ],
        "条目清单须含**关键约定与设计决策**（约定与出处、为什么这么做与放弃了哪些备选做法、兜底与已知限制）并写明**不得省略**——只要求'定位、用法、环境变量、副作用'时，本条要防的失效（为什么这么取边界、放弃了什么，事后无从查）原样存在",
    ],
    [
        "设计决策写成可核对的记录",
        [
            "设计决策写成可核对的记录",
            "决策 + 理由 + 边界",
        ],
        "须写明设计决策写成**决策 + 理由 + 边界**、并给判定标准（只见'怎么做'没有'为什么'、记了备选方案却不说不选的理由、只写决定不写依据）——缺则'记录设计思路'会被写成一段叙述，读者仍无法据此判断'这条约定今天还成不成立'",
    ],
    [
        "不写硬编码数值",
        [
            "不写硬编码数值",
            "抽象描述或常量名",
            "两处真源",
        ],
        "须写明**取值写抽象描述或常量名、不写硬编码数值**并给判定标准（注释出现与常量重复的字面数值／抄死的目录名与默认值／同一取值两处各写一遍）——缺则'改代码不改注释'的文档说谎重新成为默许形态（用户报告：脚本很多细节随维护丢失）",
    ],
    [
        "不写进方法体",
        [
            "不写进方法体",
            "文件级文档注释",
        ],
        "须写明**决策留头部/文件级文档注释、不落进方法体**（方法体只记内部局部决策与边界）——缺则方案取舍被抄进每个方法，改一处必漏另一处",
    ],
    [
        "内容移交独立文档（L1）",
        [
            "内容移交独立文档（L1）",
            "该移交而未移交",
        ],
        "须写明**超出头部块注释容量的内容移交独立文档**并一行链接回指、给判定标准——缺则要么文档头堆成长文（正文规范又变成没人读的墙），要么内容被'写短点'删掉",
    ],
    [
        "行数不设限",
        [
            "行数不设限",
        ],
        "须写明头部注释**篇幅不设上限**（内容不因'写短点'删减、也不因超长判不合格）——缺则'简洁'会被读成篇幅配额，把内容要求折成字数",
    ],
    [
        "入口的注释边界",
        [
            "入口的注释边界",
            "不得复述",
        ],
        "须写明**入口注释只写入口自己、不复述逻辑层契约**（参数语义、默认值、行为与副作用）——缺则同一份契约写两处（改逻辑不改入口注释，按入口注释用会得到错误结论）",
    ],
]
kind = "regex_section"
label = "脚本头部注释（文档头）"
message = "脚本头部注释防线被破坏：{file}「{SCRIPT_HEADER_SECTION}」缺失要点 {missing}——{desc}；本条是用户明确要求的'文档先行也适用于脚本，脚本很多细节可能随着维护丢失'，不得删除、不得降级为建议"
pattern = "^== 脚本头部注释（文档头）(?:\\s|$).*?(?=^== |\\Z)"
