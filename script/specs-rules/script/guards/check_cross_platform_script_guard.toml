[[guards.check_cross_platform_script_guard]]
file = "specs/general/script.adoc"
groups = [
    [
        "入口层不得承载逻辑",
        [
            "入口层不得承载逻辑",
            "判定标准",
        ],
        "须写明**入口层不得承载逻辑**并给可判定判据（整份入口可逐行解释为'定位逻辑代码 → 转交全部参数 → 返回退出码'三件事）——缺这句，入口又会变成'顺便处理一下参数'，两平台各写一遍是本条要防的核心失效",
    ],
    [
        "入口层不为逻辑层添第二套选项语义",
        [
            "入口层不为逻辑层添第二套选项语义",
            "例外",
            "转义",
        ],
        "须写明入口**不为逻辑层添第二套选项语义**（只转交、不解释参数、不设默认值、不吞参数），并写明 `cmd.exe`/PowerShell 需转义时的例外——缺则'不得自行解析参数'会被读成'连必要的转义都禁止'（那是做不到的：`cmd.exe` 承载不了某些字符），或反过来留下'入口可以自己定默认值'的口子",
    ],
    [
        "入口层须让退出码可判定",
        [
            "入口层须让退出码可判定",
            "exit /b",
            "LASTEXITCODE",
        ],
        "须写明入口**让退出码可判定**并给三平台的可核对写法——`cmd.exe` 不写 `exit /b %errorlevel%` 时退出码是最后一条命令的（不等于逻辑代码的），这是'看起来在转交、实际丢失成败'的最常见形态",
    ],
    [
        "不得**在 `.sh` 里再写一遍",
        [
            "不得**在 `.sh` 里再写一遍",
            "只允许**一份薄壳",
            "该平台版本",
        ],
        "须写明**不得在另一平台的入口里重写逻辑**——'Windows 的我可以不写、顺手写个 sh 版本更快'正是本条的失效形态",
    ],
    [
        "跨平台逻辑层",
        [
            "跨平台逻辑层",
            "一份",
        ],
        "须写明逻辑**只写一份**放在跨平台逻辑层（一份跨平台逻辑代码）里——缺则'分两层'退化成'两个入口各写一份'。**此处刻意不用「跨平台逻辑脚本」这个说法**：它把「脚本」一词同时给了入口与逻辑两层，读者会据此把跨平台的那一份也当成「脚本」、进而按脚本的可执行要求去要求它（那正是让用户敲 `python3 foo.py` 的由来）——故两层分别称「逻辑代码」与「入口脚本」，名字本身即区分二者",
    ],
    [
        "CRLF",
        [
            "CRLF",
            "LF",
            "纯 ASCII",
        ],
        "入口文件须**按各自平台规范落盘**（`.bat`/`.cmd` 与 `.ps1` 用 CRLF、`.sh` 用 LF、`.bat` 纯 ASCII）——入口是平台专属文件，行尾/编码错则入口本身就跑不起来",
    ],
    [
        "实现语言取舍",
        [
            "实现语言取舍",
            "Python",
            "Node.js",
            "Go",
            "Rust",
        ],
        "须给出**实现语言取舍**（环境好搭建/不易出错/好维护/兼容性/效率的默认取向：Python 3 与 Node.js 优先、单文件分发用 Go/Rust）——缺则执行者只能凭'哪个顺手'选语言",
    ],
    [
        "同处一目录",
        [
            "同处一目录",
            "同名",
            "主名",
        ],
        "须写明入口与逻辑代码**同处一目录、主名相同**（逻辑 `foo.py` → 入口 `foo.sh`/`foo.bat`，不另建 `bin/`/`script/`/`windows/`）——缺则入口一分散，改逻辑时连带改入口、又改出第二份；也是用户明确要求的落点约定",
    ],
    [
        "不加前后命令",
        [
            "不加前后命令",
            "必要参数",
            "直接执行",
        ],
        "须写明入口**须由解释器原生可执行、调用方不加前后命令**（只给脚本名即可跑；`bash foo.sh` / `python3 foo.py` / `powershell -File foo.ps1` 属违规），并写明'脚本自身功能参数属必要参数'的例外——缺则用户'不希望脚本执行前后加命令和参数'的要求无法判定（要么入口跑不起来、要么被读成连功能参数也不许加）",
    ],
    [
        "入口语言取舍",
        [
            "入口语言取舍",
            ".bat`/`.cmd`",
            "`.sh`",
        ],
        "须写明**入口语言取舍**（入口语言按平台默认具备者选：Windows 取 `.bat`/`.cmd`、Linux/macOS 取 `.sh`；不得为一侧入口引入对方平台要另装的运行时；编译型单文件分发时同一二进制兼作两平台入口）——缺则执行者会按'逻辑层用什么语言'给入口选语言（逻辑用 Python 就写 `.py` 当入口），把安装步骤推给调用方",
    ],
    [
        "不得要求调用方先做前置动作",
        [
            "不得要求调用方先做前置动作",
            "请先",
        ],
        "须写明**入口不设前置步骤**（不要求调用方先 `cd`/设环境变量/`chmod +x`/装依赖）——缺则入口把配置责任推给用户，'拿来就能跑'落空",
    ],
    [
        "不得为“跑逻辑”自加命令",
        [
            "不得为“跑逻辑”自加命令",
            "一一对应",
        ],
        "须写明入口**不得为跑逻辑自加命令、也不得给逻辑代码塞参数**（调用前的 `cd`/`mkdir`/安装/下载/校验，或转交时多加了固定参数）——缺则'只转交'被绕过，入口又开始做别的事",
    ],
    [
        "薄壳之外不得多做",
        [
            "薄壳之外不得多做",
            "与逻辑层调用等价",
            "不等价",
        ],
        "须写明**薄壳之外不得多做、但可以做「把逻辑层当命令直接跑」的薄壳**（判定标准：入口里出现与「把调用方给的参数交给逻辑代码」**不等价**的动作即违规；「先探测解释器、一个都没有就报错退出非 0」仍属薄壳）——缺则「入口不承载逻辑」被读成「入口只许有一条形态」，把「另留一个只跑逻辑的入口脚本」这种正当形态也一起禁掉",
    ],
    [
        "安装/下载/解压任何运行时",
        [
            "安装/下载/解压任何运行时",
            "不属",
            "代为获取运行时",
        ],
        "须写明**入口不得为「让逻辑跑起来」而安装/下载/解压运行时、包或依赖**（`apt`/`apk`/`yum`/`pip`/`winget`、`curl | sh` 一类都不属薄壳），且**代为获取运行时不是入口的职责**——要么由人按本平台既有软件分发方式完成、要么在**人已交互登录、能看见命令与报错的正常会话**里由 agent 完成，不得在入口或非交互执行里静默发生——缺则「让逻辑跑起来」被读成「入口自己想办法搞一个运行时」（把环境差异与不可控的系统改动带进入口）",
    ],
    [
        "不拿裸 shell 当逻辑层",
        [
            "不拿裸 shell 当逻辑层",
        ],
        "须写明**不拿裸 shell 当逻辑层**（bash 在 Windows 上不可得或来自 Git Bash/WSL、cmd 在 Linux 上不可用）——缺则逻辑又被写进 shell，平台差异回到逻辑层",
    ],
    [
        "不得假设自身所处目录",
        [
            "不得假设自身所处目录",
            "cd",
        ],
        "须写明逻辑代码**不得假设自身所处目录**（入口以绝对路径调用、不 `cd`）——缺则入口一 `cd`，逻辑代码里的相对路径在本地与 CI 下行为不同",
    ],
    [
        "（L1）",
        [
            "（L1）",
        ],
        "条文须标注级别——本条的'薄壳/不写两遍'是不可豁免的底线，标成建议即等于没有",
    ],
]
kind = "regex_section"
label = "跨环境脚本（入口 + 跨平台逻辑 + 实现语言取舍）"
message = "跨环境脚本防线被破坏：{file}「{CROSS_PLATFORM_SCRIPT_SECTION}」缺失要点 {missing}——{desc}；本条是用户明确要求的跨平台约定，不得删除、不得降级为建议"
pattern = "^== 跨环境脚本（入口 \\+ 跨平台逻辑 \\+ 实现语言取舍）(?:\\s|$).*?(?=^== |\\Z)"
[[guards.check_cross_platform_script_guard]]
file = "specs/stack/batch.adoc"
groups = [
    [
        "行尾",
        [
            "行尾",
            "CRLF",
            "纯 ASCII",
            "BOM",
        ],
        "批处理栈须写明编码与行尾（`cmd.exe` 按字节读行尾、按系统 ANSI 代码页解析，故 CRLF + 纯 ASCII + 不写 BOM）——缺则批处理按通用 LF/UTF-8 落盘、在 Windows 上直接执行失败",
    ],
    [
        "薄壳",
        [
            "薄壳",
            "exit /b",
            "errorlevel",
        ],
        "批处理栈须写明作为跨环境入口时的薄壳三件事与 `exit /b %errorlevel%`——缺则批处理入口又承载参数解析/路径拼装，或退出码恒为最后一条命令的（调用方/CI 看不到真实成败）",
    ],
    [
        "延迟展开",
        [
            "延迟展开",
            "enabledelayedexpansion",
        ],
        "批处理栈须写明块语句里 `%var%` 在**解析期**展开、须用延迟展开（`!var!`）——缺则循环里累加/拼接取不到值，属批处理最常见的静默失效",
    ],
    [
        "引号",
        [
            "引号",
            "%~1",
        ],
        "批处理栈须写明路径须加引号（Windows 路径常含空格）、可选参数用 `%~1` 去引号后判空——缺则含空格的路径直接报错、参数判空判错",
    ],
    [
        "@echo off",
        [
            "@echo off",
        ],
        "批处理栈须写明首行 `@echo off`——缺则每条命令都被回显、调用方与 CI 无法从输出判断实际执行了什么",
    ],
    [
        "未定义",
        [
            "未定义",
        ],
        "批处理栈须写明未定义变量不得静默容忍（`%var%` 未定义时被替换成空串、命令变残句）——缺则错误被推到更难定位的地方",
    ],
    [
        "$",
        [
            "$",
            "cmdlet",
            "-eq",
        ],
        "批处理栈须写明不得把 PowerShell 语法写进 `.bat`（`$LASTEXITCODE`/cmdlet/`-eq` 在 `cmd.exe` 里不存在，混写出来一条都跑不通）——缺则批处理里继续混写 PowerShell 语法",
    ],
]
kind = "file_groups"
message = "批处理栈缺失要点 {missing}——{desc}"
