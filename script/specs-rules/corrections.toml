# 『用户打错字不是他的真值』防线（用户点名：用户可能打错单词，AI 看不出来、也不纠正，
# 当成"用户故意输的"照做）。
# 缺它时的失效形态：用户把标识符 / 路径 / 字典值里的某个词打错，执行者**识别出了却不纠正**
# ——照错值写进代码（生成名字打错的标识符）、写进文档（把错字当成既有名称）、或抄进路径与
# 配置值；**过程中既没有纠正、也没有告知**（"用户故意输的"与"用户打错了"在文本上分辨不出来，
# 故执行者默认按前者处理、静默照做）。
#
# **判据本体的落点只有一个**：`specs/core/execution.adoc`「指令执行」的该条 bullet。
# 本文件只给"要点在不在"。
#
# 锚点取**逐字节原文**（引号用正文里的 `"`），且一律取**判据句本身**——只取"用户打错字"
# 五个字这类轴名，任何写了这句话的条目都会命中（假绿）。
[[guards.check_correction_guard]]
file = "specs/core/execution.adoc"
section = "指令执行"
bullet = "用户打错字不是他的真值"
kind = "bullet_tokens"
tokens = [
    "用户打错字不是他的真值：先纠正、按纠正后的意思做（L1）",
    "不得当真值照做",
    "名字打错的标识符",
    "抄进路径、路径参数与配置值",
    "与它是不是\"已定义的名称\"无关",
    "先按能读出的正确词纠正、再按纠正后的意思执行",
    "须在输出里显式告知",
    "照错写的那一处即违规",
    "改了却不说明的按**未完成**计",
    "纠正方式属做法",
    "本条**不要求**为每一次纠错发起确认",
    "只有**明显的字面打错**才叫错别字",
    "读不出用户要的是哪个词",
    "按「歧义先问、不自行假设」停下问",
    "不得**猜一个改掉",
    "用户**显式声明过**某个词就是他要在的那个词",
    "工作区里已有的词不是错别字",
    "不得**按\"看着像打错\"去纠正或改名",
    "不构成",
    "看出来了也不用管",
    "**依据**",
    "本集合自己的取舍",
]
message = "用户打错字防线被破坏：该条 bullet 缺失要点 {missing}（该条的**正文**须自带这些要点——只留标题、把判定标准搬进相邻条目即等于失效）"

# 入场核：核**锚点清单自己的条数**——清单被删项时那条 bullet 一字不少、上面的步骤一次都不
# 报错（"核过且通过"与"没核"从此无从区分）。删锚点须与调 `min` 一并发生。
[[guards.check_correction_guard]]
file = "specs/core/execution.adoc"
section = "指令执行"
bullet = "用户打错字不是他的真值"
kind = "anchor_count"
min = 22

# 依据侧（图书馆）：本条的"标准给到哪一层 + 本集合加了什么 + 要治的失效形态"须仍在——
# 缺则本条只剩一句"要纠正错别字"，日后无人能判"它今天还成立吗"。
[[guards.check_correction_guard]]
file = "library/corrections.adoc"
kind = "file_groups"
groups = [
    [
        "外部材料只给方向与下限",
        [
            "外部材料只给方向与下限",
            "ISO 9241-110",
            "ISO/IEC/IEEE 29148",
            "ISO 9001",
            "未规定「执行者必须纠正用户的错别字」",
        ],
        "依据侧须写明标准只给方向与下限（符合预期/可控、需求单一可追溯、成文信息可核验），且**未**规定是否纠正错别字——缺则本集合的更严取舍被当成标准原文",
    ],
    [
        "本集合的更严取舍与覆盖点",
        [
            "同义性差异与覆盖点（本集合自己承认的）",
            "是本集合更严的硬性约定",
            "怎么纠正",
            "由执行者定（L3）",
            "用户显式声明过的词以声明为准",
        ],
        "依据侧须写明同义性差异：哪些是本集合加严的（不得当真值 / 判定标准）、哪些是本集合的裁量面（怎么纠正不设统一动作）、划界在哪（显式声明优先）",
    ],
    [
        "失效形态与实证",
        [
            "本项目实证",
            "既没有纠正、也没有告知",
            "用户故意输的",
            "用户打错了",
        ],
        "依据侧须收**要治的失效形态**（识别出了却不纠正、既不纠正也不告知，且两种情形在文本上分辨不出来）——它是「这条要求针对什么」的锚点",
    ],
    [
        "机制边界如实标注",
        [
            "在文本上不可判",
            "运行时事实与语义判断",
        ],
        "依据侧须如实标注机制边界（“打错”与“故意这么输”在文本上不可判，本条抓手只到文本要点、实然判断交复核）——不标则读者以为有机械抓手能判出一条错别字",
    ],
]
message = "用户打错字防线被破坏：{file} 缺失要点 {missing}——{desc}"

# 图书馆登记：主题文件与入口「主题登记」表须双向一致（"写文件"与"登记"是同一个动作）。
[[guards.check_correction_guard]]
file = "library/README.adoc"
kind = "file_groups"
groups = [
    [
        "主题登记表登记 corrections",
        [
            "link:corrections.adoc[]",
            "本集合据此推出的是自己更严的硬性约定",
            "机制边界",
        ],
        "入口「主题登记」表须登记该主题并保留取舍/边界说明（缺则依据成了无人反查得到、也无人知道它只对本站成立）",
    ],
]
message = "用户打错字防线被破坏：{file} 缺失要点 {missing}——{desc}"
