# 『举例不是面』防线规则数据（**用户追问的方法论**）。
#
# 用户口径（原话）：『调整规范：用户提出比如、举例等等的时候，不要只看这种情况下，需要扩展，
# 搞清楚说话的重点，不要只看举例』；『我说的重点是"界面的性能"，你扩展了吗？界面的性能只有
# 拖拽吗，是不是可以一个方法论，来避免这种抓不住重点、只看举例的情况？这个方法论只只用于
# 界面吗？还是其他地方也可以加？』。
#
# 本条防的失效：要求里带一个实例（"一万行的表格拖动调整大小""比如这个字段"），执行者只把
# 那一个实例修好就宣布完成——同类形态的其余部位照旧，用户得一处一处再提一遍；而"漏下的那些"
# 与"做过的那些"在输出文本上分辨不出来。
#
# **落在规划层、不限界面**：这是用户第二问的答案——方法论本身与界面无关，任何一类要求都成立；
# 界面一节只**回指**它，不另立一套。

# ① 判据本体：`specs/general/planning.adoc`「举例不是面」整节。
[[guards.check_example_not_surface_guard]]
file = "specs/general/planning.adoc"
section = "举例不是面"
kind = "section_groups"
groups = [
    [
        "识别判据（先判这一问带不带面）",
        [
            "识别判据（先判这一问带不带面）",
            "例子与问句的对象不是同一个层级",
            "命中即须**先把这个\"面\"取出来，再回答**",
        ],
        "缺识别判据时，读者读不出「什么时候该扩展、什么时候不该」——要么一律扩展（改到不相干的范围），要么照旧只改举例那一处",
    ],
    [
        "先把面取出来再动手",
        [
            "先把\"面\"取出来，再动手（L1）",
            "举例的具体形态只是其中一个样本",
            "以「他只举了这一个」为由不做扩展",
        ],
        "缺这条时，举例的那一个实例修好就算完成——同类形态的其余部位照旧，用户得一处一处再提一遍",
    ],
    [
        "按维度列、不按场景列",
        [
            "按维度列，不按场景列（L1）",
            "天生漏掉没被提到的那些",
            "新出现一个同类的实例时，清单里没有能落进去的那一档",
        ],
        "缺这条时，清单又变成「他提到的那些场景」——清单天生漏掉没被提到的那些，而漏掉的正是下一次要重新提的",
    ],
    [
        "面要落到能被下次加载的载体上",
        [
            "面\"要落到能生效的载体上，不是只落到这次的答复里（L1）",
            "加载门/入口清单里走不到它",
            "没有可核对的判定标准",
        ],
        "缺这条时，扩展只写在当次回复里——这次答得好、下次照旧，用户看到的是「说了等于没说」",
    ],
    [
        "反向：不得把面扩成别人的面",
        [
            "不得把\"面\"扩成别人的面（L1）",
            "不得把\"面\"当成\"可以顺手重构\"的许可",
        ],
        "缺这条时，「要按面做」成了发动全库改造与顺手改无关模块的许可",
    ],
    [
        "边界与依据行",
        [
            "什么不算\"举例\"",
            "声明优先于本条",
            "本集合的判据化取舍",
        ],
        "缺边界时，用户已声明范围（只看这一处）也会被强行扩展；缺依据行则读者以为「先取属再答」是某标准原文",
    ],
]

# ② 读任务那一侧的回指：读任务时就要判，不能等动手才发现把举例当成了面。
[[guards.check_example_not_surface_guard]]
file = "specs/general/collab.adoc"
section = "任务的读懂"
kind = "line_tokens"
anchor = ["例子不是范围"]
message = "『举例不是面』防线被破坏：{file} 的「任务的读懂」缺 {missing}——读任务时不再判「这一问带不带面」，方法论只留在规划层、派发进来的要求照旧只按举例办"
tokens = [
    "`specs/general/planning.adoc`「举例不是面」",
    "说不出这一类还有哪些形态",
]

# ③ 界面一侧的回指：本条与界面的关系必须写明（用户第二问：这个方法论只用于界面吗）。
[[guards.check_example_not_surface_guard]]
file = "specs/general/coding.adoc"
section = "界面的性能"
kind = "line_tokens"
anchor = ["为什么按维度列而不按场景列"]
message = "『举例不是面』防线被破坏：「界面的性能」一节缺 {missing}——没有这句回指，读者仍会把这一节读成「清单里那几个场景」，拖动调整大小一类的举例照旧被当成全部"
tokens = [
    "`specs/general/planning.adoc`「举例不是面」",
    "不会因为\"这一种没人提过\"而失效",
]
