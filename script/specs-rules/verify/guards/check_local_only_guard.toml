[[guards.check_local_only_guard]]
file = "specs/general/testing.adoc"
section = "环境与兼容"
kind = "section_groups"
token_list = "LOCAL_ONLY_TOKENS"

# 与上条成对：只核正文时，把锚点清单自身削掉几项（正文一字不少）防线仍全绿，
# "核过且通过"与"没核"无从区分——删锚点须与调基线一并发生。
[[guards.check_local_only_guard]]
file = "script/specs-rules/_tokens.toml"
kind = "anchor_count"
min = 4
token_list = "LOCAL_ONLY_TOKENS"

# Java 落点只给载体（判据本体在通用层）：替代品优先进程内、确实要独立进程时起在本机回环；
# `IntegrationTests` 同受约束（它讲的是执行时机、不是"可去连远端"的许可）。
[[guards.check_local_only_guard]]
file = "specs/stack/java-testing.adoc"
tokens = [
    "用例只在本机跑（Java 侧的载体，不构成 Java 专属规则）",
    "specs/general/testing.adoc",
    "`IntegrationTests` 同样受此约束",
]
kind = "file_tokens"
message = "Java 测试规范缺失「用例只在本机跑」的载体 {missing}——缺则写测试时想不到这条，远端地址照旧写进测试配置，且 `IntegrationTests` 会被读成『可以去连远端环境』的许可"

# 调度器须能被触发（否则设计用例、决定连不连远端时，这一条永远不会被加载）。
[[guards.check_local_only_guard]]
file = "AGENTS_COMMON.adoc"
tokens = [
    "判定用例能不能连本机之外的机器",
]
kind = "file_tokens"
message = "加载调度器缺少「用例只允许在本机跑」的识别特征 {missing}——缺则写测试、配测试环境时这一条永远不被加载"

# 提示词侧同口径（提示词会被未知项目复制执行，漏了这层则复制出去的那份没有该边界）。
# 核对对象**收在 `final-verify` 片段内**：按整份文件核时同一批措辞出现在别的片段里就能兜住。
[[guards.check_local_only_guard]]
file = "prompts/_common.txt"
anchor = "// tag::final-verify[]"
tokens = [
    "测试用例只允许在本机跑（L1）",
    "把所有其他机器都拔掉，这套用例还跑不跑得通",
    "不得以\"本地起不来、用远端环境跑\"自我豁免",
    "主动声明",
]
kind = "text_block_groups"
message = "提示词公共片段缺失「用例只允许在本机跑」的要点 {missing}——缺条文则执行侧照旧连远端环境跑；缺判据问句则『有没有越出本机』无从判断；缺禁止面则『本地起不来』成了通行豁免；缺例外则用户声明的那一处也无处安放"

# 公开面同步（读者不从公开面知道有这条，就仍把『有环境才跑得通』当成用例成立的前提）。
[[guards.check_local_only_guard]]
file = "README.adoc"
tokens = [
    "测试用例只允许在本机跑",
    "specs/general/testing.adoc",
]
kind = "file_tokens"
message = "公开面 README 未登记「测试用例只允许在本机跑」{missing}——公开面只看得见『怎么跑测试』、看不见『用例不许依赖别的机器』，这条判据对读者不存在"

# 『跑测试按改动面取最小集』与『基线只取改动面那一片』防线（**用户提出**）。用户口径：
# `一上来就跑所有的测试用例太慢了`——用例要能按文件/模块/服务细分、只跑需要验的那部分；
# 先干活、干完再看动了哪些内容，对**改动前的那个状态**取基线（那一片本来有问题就先处理
# 基线），改完跑同一批比对。判据本体在 `specs/general/verify.adoc`「验证的适用边界」的
# 「测试跑多少」；基线侧落 `specs/general/planning.adoc`「动手前先定基线」；测试侧只在
# `specs/general/testing.adoc`「执行与验证」留「能按落点选取执行」的归属句。锚点清单只写
# 一处（`_tokens.toml` 的 `TEST_SCOPE_TOKENS`），本处按名引用。
#
# 取节方式说明：`specs/general/verify.adoc` 的这两个条目落在「验证的适用边界」节里、
# 且该节同时是本条与「最轻路径」等相邻条目的落点，故按**该节正文**逐组核锚点。
