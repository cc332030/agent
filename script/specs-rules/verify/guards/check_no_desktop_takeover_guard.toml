[[guards.check_no_desktop_takeover_guard]]
file = "specs/general/verify.adoc"
section = "编译/运行验证"
token_list = "NO_DESKTOP_TAKEOVER_TOKENS"
kind = "section_groups"

# 与「最轻路径」成对：只核正文时，把锚点清单自身削掉几项（正文一字不少）防线仍全绿。
[[guards.check_no_desktop_takeover_guard]]
file = "script/specs-rules/_tokens.toml"
kind = "anchor_count"
min = 22
token_list = "NO_DESKTOP_TAKEOVER_TOKENS"


# 提示词侧同口径（提示词会被未知项目复制执行，漏了这层则复制出去的那份没有该边界）。
# 核对对象**收在 `final-verify` 片段内**：按整份文件核时，同一批措辞出现在别的片段里
# 就能把抽走的要点兜住。也核公开面 README（读者不从目录说明知道有这条，就仍按
# "看效果就截整屏"行事）——两处都是**单条锚点**：条文以长句写成、要点逐条在 token 侧核，
# 这里只答"这一层有没有被整段抽掉"。
[[guards.check_no_desktop_takeover_guard]]
file = "prompts/_common.txt"
anchor = "// tag::final-verify[]"
tokens = [
    "取那个目标自己的画面、不接管用户的桌面（L1）",
    "不在最上层、被盖住",
    "实际试过",
    "DevTools 协议",
]
kind = "text_block_groups"
message = "提示词公共片段缺失「看显示效果不接管桌面」的要点 {missing}——缺条文则执行侧仍按「切前台 + 整屏截图」取证；缺『不在最上层、被盖住』则执行者以为只能切到前台；缺『实际试过』则例外变成凭印象的挡箭牌；缺 DevTools 则调试工具排不到前面"
[[guards.check_no_desktop_takeover_guard]]
file = "README.adoc"
tokens = [
    "需要看显示效果时不接管用户的桌面",
    "specs/general/verify.adoc",
]
kind = "file_tokens"
message = "公开面 README 未登记「看显示效果不接管桌面」{missing}——公开面只看得见「看效果就截图」，这条判据对读者不存在"

# 调度器须能被触发（否则「要看显示效果」时这一条永远不会被加载）。
[[guards.check_no_desktop_takeover_guard]]
file = "AGENTS_COMMON.adoc"
tokens = [
    "要看显示效果时",
    "截整屏",
]
kind = "file_tokens"
message = "加载调度器缺少「看显示效果时不接管桌面」的识别特征 {missing}——缺则看效果照旧切前台 + 整屏截图"

# 要复用的验证场景归入测试源码、不落成一次性脚本（用户提出）：判据本体在
# `specs/general/verify.adoc`「编译/运行验证」——用户口径：不是「本次只验一次」的
# 测试场景就该归成测试用例落进测试源码，不能当临时脚本/文件，否则每验一次就重写一次。
# 锚点清单**只写一处**（`_tokens.toml` 的 `REUSABLE_SCENARIO_TOKENS`），本处按名引用。
