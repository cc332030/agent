[[guards.check_windows_window_guard]]
file = "specs/stack/windows.adoc"
section = "开窗口不得影响正在用这台机器的用户"
token_list = "WINDOWS_WINDOW_TOKENS"
kind = "section_groups"

# 与上面成对：只核正文时，把锚点清单自身削掉几项（正文一字不少）防线仍全绿。
[[guards.check_windows_window_guard]]
file = "script/specs-rules/_tokens.toml"
kind = "anchor_count"
min = 15
token_list = "WINDOWS_WINDOW_TOKENS"

# 提示词侧同口径（提示词会被未知项目复制执行，漏了这层则复制出去的那份没有该边界）。
[[guards.check_windows_window_guard]]
file = "prompts/_common.txt"
anchor = "// tag::final-verify[]"
tokens = [
    "Windows 下不为跑界面而把窗口开到用户眼前（L1）",
    "隐藏窗口或后台运行",
    "不切前台窗口、不动鼠标键盘",
    "specs/stack/windows.adoc",
]
kind = "text_block_groups"
message = "提示词公共片段缺失「Windows 下不为跑界面而把窗口开到用户眼前」的要点 {missing}——缺条文则执行者在 Windows 上照旧把窗口开到前台抢焦点；缺「隐藏或后台」则没有取值；缺「不切前台、不动鼠标键盘」则看效果仍靠切前台；缺落点则判据无从追溯"

# 公开面同步（读者不从目录说明知道有这条，就仍按"开个窗口看一眼"行事）
[[guards.check_windows_window_guard]]
file = "README.adoc"
tokens = [
    "Windows 下不为跑界面而把窗口开到用户眼前",
    "specs/stack/windows.adoc",
]
kind = "file_tokens"
message = "公开面 README 未登记「Windows 下不为跑界面而把窗口开到用户眼前」{missing}——公开面只看得见通用口径，这条按 Windows 的取值对读者不存在"

# 调度器须能被触发（否则在 Windows 上开窗口时这一条永远不会被加载）。
[[guards.check_windows_window_guard]]
file = "AGENTS_COMMON.adoc"
tokens = [
    "specs/stack/windows.adoc",
    "要开窗口跑界面/验证布局",
]
kind = "file_tokens"
message = "加载调度器缺少 Windows 平台栈的登记与识别特征 {missing}——缺则要开窗口跑界面时 `specs/stack/windows.adoc` 永远不加载，规则实际失效"

# 要跑的那一份须是本次产出的那一份（用户提出）：判据分两处、各管一面——
# `specs/general/verify.adoc`「编译/运行验证」管**对象身份怎么核**（绝对路径点名、核进程
# 映像路径、已有实例挡路时不得拿它的画面当结果），`specs/stack/windows.adoc`
# 「要跑的那一份须是本次构建的那一份」管 **Windows 上的取值形态与单实例挡路时怎么办**。
# 用户口径：触发 exe 的唯一实例规则时，取到的那一份根本起不来、被交给既有实例，
# **启动的是老实例**，除非让测试实例把唯一实例原则停用。锚点清单只写一处
# （`_tokens.toml` 的 `RUN_ARTIFACT_TOKENS` / `RUN_ARTIFACT_WINDOWS_TOKENS`）。
