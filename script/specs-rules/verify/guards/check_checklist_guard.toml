[[guards.check_checklist_guard]]
file = "specs-project-maintainer/verify.adoc"
groups = [
    [
        "三态台账",
        [
            "三态台账",
            "悬置",
            "未发现问题",
            "不得合并",
        ],
        "留证须按三态台账（通过/未发现问题/悬置）分列、不得合并",
    ],
    [
        "**通过**",
        [
            "**通过**",
            "**悬置**",
            # 维护方侧**不重列**逐态取值（判据本体在通用层，抄回来即第二真源）——
            # 故本组放宽为"态名 + 指向通用层判据本体"的落点说明：留证退化成散文结论
            # （"查不出"与"没做"无法分辨）仍被拦住，而"把通用层的条文抄进维护方文件"
            # 不再被当成正确写法（本 PR 立项理由）。
            "specs/general/verify.adoc",
        ],
        "维护方侧须点出三态并指向通用层的判据本体（逐态取值不在本文件重列）",
    ],
]
kind = "file_groups"
message = "{file} 缺失三态台账要素 {missing}——{desc}，留证会退化成散文结论（\"查不出\"与\"没做\"无法分辨）"
[[guards.check_checklist_guard]]
file = "specs/general/collab.adoc"
# 该文件的时限要点分属**两个节**，故分两块按节核：派发口径属「资源限制与感知」、
# 执行类操作口径属「操作超时与超时后的处置」。按整份文件核（`file_groups`）挡不住
# "条目被挪出本节/标题被改写"——实测那两种形态下全文锚点仍全绿。
section = "资源限制与感知"
kind = "section_groups"
groups = [
    [
        "硬超时",
        [
            "硬超时",
            "到点即视为失联",
            "不得无限等待",
        ],
        "派发子 agent 须自带可判定的时限，到点视为失联（防任务永久挂起）",
    ],
    [
        "超时的处置",
        [
            "超时的处置",
            "放弃该子 agent",
            "如实",
        ],
        "超时后须放弃 + 如实标悬置，不得无限等待、不得写成已通过",
    ],
    [
        "时限取值须有判据",
        [
            "时限取值须有判据",
            "一次性、边界明确、可超时",
        ],
        "时限取值须有判据、优先选可超时的一次性派发形式",
    ],
]
message = "{file} 在「资源限制与感知」节缺失要素 {missing}——{desc}；语义复核会再次卡死且无人负责"
[[guards.check_checklist_guard]]
file = "specs/general/collab.adoc"
section = "操作超时与超时后的处置"
kind = "section_groups"
groups = [
    [
        "每一次操作自带可判定的时限",
        [
            "每一次操作自带可判定的时限（L1",
            "没有进度输出的操作尤其适用",
        ],
        "时限不限于派发：每一次操作都须预估最长执行时间并设可判定的时限（没有进度输出的操作尤其适用）；缺则『超时』只被读成子 agent 派发的事，命令/构建/读取卡死仍无人拦",
    ],
    [
        "超时后先排查、再换手段继续",
        [
            "超时后先排查、再换手段继续（L1）",
            "排查原因",
            "换一种手段继续",
            "不得把整条任务停在中间",
            "不得把超时未完成的操作写成已完成",
        ],
        "超时后须先排查原因、再换手段继续、并继续做不依赖该操作的其余部分（不得停在中间、不得写成已完成）；缺则超时被读成\"标一句未完成即可\"，重启即从头来过",
    ],
    [
        "与复核者超时的分工",
        [
            "与复核者超时的分工（L1）",
            "执行类操作没有这条约束",
            "不得直接放弃该步骤",
        ],
        "须写明与复核者超时的分工：复核的替代手段受独立性约束故标悬置，执行类操作没有该约束、超时后须换手段做完（否则会被照搬成\"所有超时都标悬置\"）",
    ],
]
message = "{file} 在「操作超时与超时后的处置」节缺失要素 {missing}——{desc}；语义复核会再次卡死且无人负责"

