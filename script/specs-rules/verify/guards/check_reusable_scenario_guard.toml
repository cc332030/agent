[[guards.check_reusable_scenario_guard]]
file = "specs/general/verify.adoc"
section = "编译/运行验证"
token_list = "REUSABLE_SCENARIO_TOKENS"
kind = "section_groups"

# 与上面成对：只核正文时，把锚点清单自身削掉几项（正文一字不少）防线仍全绿，
# "核过且通过"与"没核"无从区分——同 `anchor_count` 的既有口径，删锚点须与调基线一并发生。
[[guards.check_reusable_scenario_guard]]
file = "script/specs-rules/_tokens.toml"
kind = "anchor_count"
min = 19
token_list = "REUSABLE_SCENARIO_TOKENS"

# 本条引入的**新名称**须按《数据字典》「新增与调整内容时都须判定」入本文件的字典
# （`specs/general/terminology.adoc`：名称是检索键，定义仍只有一处）。核对面收在字典节内：
# 只核整份文件时，正文里同一串字样会把"字典没登记"兜住——本仓库实测（上一条「最轻路径」
# 就是这么漏的）：正文一字不少、字典里一条没登记，全线报绿。
[[guards.check_reusable_scenario_guard]]
file = "specs/general/verify.adoc"
section = "本文件的字典（本文件使用的名称，定义写在这里）"
groups = [
    [
        "本条的名称已入字典",
        [
            "**验证场景的归属（要复用就写成用例）**",
        ],
        "缺登记则新引入的名称没有唯一落点（《数据字典》「新增与调整内容时都须判定」）——正文与字典各自漂移，读者按名称检索不到它",
    ],
]
kind = "section_groups"

# 通用测试规范侧同口径（回指本体，不重列）：用例才是回归的载体。
[[guards.check_reusable_scenario_guard]]
file = "specs/general/testing.adoc"
tokens = [
    "验证场景的归属按「要复用就写成用例」判",
    "specs/general/verify.adoc",
]
kind = "file_tokens"
message = "通用测试规范缺失「验证场景归属」的回指 {missing}——缺则测试侧只认「有测试」，验证脚本留在 tmp/ 仍算合规"

# Java 落点只给载体（判据本体在通用层）：写成测试方法而非一次性程序；
# 「不复述判据」这一条上机械抓手——回指处若把取值再抄一遍，两处从此各自漂移。
[[guards.check_reusable_scenario_guard]]
file = "specs/stack/java-testing.adoc"
tokens = [
    "验证场景要复用就写成测试方法（Java 侧的载体，不构成 Java 专属规则）",
    "判据取值一律回那边看",
    "specs/general/verify.adoc",
]
kind = "file_tokens"
message = "Java 测试规范缺失「验证场景要复用就写成测试方法」{missing}——缺则写测试类时想不到这条，验证脚本照旧留在 tmp/"

# 调度器须能被触发（否则写完一段临时验证脚本时，这一条永远不会被加载）。
[[guards.check_reusable_scenario_guard]]
file = "AGENTS_COMMON.adoc"
tokens = [
    "这次的验证脚本要不要留",
    "这个场景上次也验过",
]
kind = "file_tokens"
message = "加载调度器缺少「验证场景归属」的识别特征 {missing}——缺则写完临时验证脚本时这一条永远不被加载，接着每验一次就重写一次"

# 提示词侧同口径（提示词会被未知项目复制执行，漏了这层则复制出去的那份没有该边界）。
# 核对对象**收在 `final-verify` 片段内**：按整份文件核时同一批措辞出现在别的片段里就能兜住。
[[guards.check_reusable_scenario_guard]]
file = "prompts/_common.txt"
anchor = "// tag::final-verify[]"
tokens = [
    "要复用的验证场景归入测试源码、不落成一次性脚本（L1）",
    "这个场景以后还要不要再验一次",
    "判不准时按\"会重复\"处理",
    "永不自动执行",
]
kind = "text_block_groups"
message = "提示词公共片段缺失「验证场景归属」的要点 {missing}——缺条文则执行侧仍把验证脚本写进 tmp/、跑完即散；缺判据问句则「要不要留」无从判断；缺兜底则灰色地带倒向随手脚本；缺去向则「既不想进自动阶段、又不想留 tmp 脚本」无处安放"

# 公开面同步（读者不从目录说明知道有这条，就仍按「验证随手写个脚本」行事）。
[[guards.check_reusable_scenario_guard]]
file = "README.adoc"
tokens = [
    "要复用的验证场景归入测试源码、不落成一次性脚本",
    "specs/general/verify.adoc",
]
kind = "file_tokens"
message = "公开面 README 未登记「要复用的验证场景归入测试源码」{missing}——公开面只看得见「跑验证」、看不见「验过的东西要留落点」，这条判据对读者不存在"


# 『用例只允许在本机跑』防线（`check_local_only_guard`）。用户口径：
# **测试用例的执行范围严格控制在本地电脑范围内**，不允许依赖任何其他电脑、服务器
# （「手动写的除外」——即人工另行声明的远端验证那一处，落成本条的唯一例外）。
# 判据本体在 `specs/general/testing.adoc`「环境与兼容」，锚点清单在
# `_tokens.toml` 的 `LOCAL_ONLY_TOKENS`；四处同口径（Java 落点、调度器识别特征、
# 提示词公共片段、公开面 README）各自只给载体、不重列判据。
