[[guards.check_commit_message_guard]]
file = "specs/general/git.adoc"
groups = [
    [
        "== 提交信息",
        [
            "== 提交信息",
        ],
        "提交信息的书写规则须有独立承载节（缺则「提交信息怎么写」无处可查，而变更日志那边却要求按类型分组）",
    ],
    [
        "<type>[(scope)]: <subject>",
        [
            "<type>[(scope)]: <subject>",
            "固定闭集",
        ],
        "首行形态须写清：`<type>[(scope)]: <subject>` + 类型取**固定闭集**（与变更日志的类型同源、不混用同义词）——缺则「有类型前缀」不可核对",
    ],
    [
        "首行不以",
        [
            "首行不以",
            "起头即不合规",
        ],
        "须有**可逐条核对的判定标准**（首行不以 `<type>:` / `<type>(scope):` 起头即不合规）——只写「建议加类型」无法判定是否被遵守",
    ],
    [
        "破坏性变更须显式标注",
        [
            "破坏性变更须显式标注",
            "BREAKING CHANGE",
            "不得把某个类型默认为破坏性的",
        ],
        "破坏性变更须显式标注：`!` 或 `BREAKING CHANGE:` 页脚，且**不得把某个类型默认为破坏性的**（破坏性变更可与任何类型组合）——这是与变更日志「不得用类型分级代替破坏性变更标注」同源的另一半",
    ],
    [
        "正文写",
        [
            "正文写",
            "为什么",
        ],
        "正文须写「为什么」与影响边界（不重复 diff 已能看出的「改了什么」）——与变更日志「说影响，不说实现过程」同口径",
    ],
    [
        "Conventional Commits",
        [
            "Conventional Commits",
            "业界约定、非标准",
        ],
        "须**如实标注**依据是业界约定、不是标准（Conventional Commits 自述为a lightweight convention on top of commit messages）——防被读成「某标准要求提交信息带类型」",
    ],
]
kind = "file_groups"
message = "提交信息防线被破坏：{file} 缺失要点 {missing}——{desc}"

