# 入场核（与上面那步成对）：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤一次都不报错（那条"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_rename_split_guard]]
file = "specs/platform/cnb.adoc"
kind = "anchor_count"
bullet = "压缩对象不含"
section = "压缩提交"
min = 6
# 锚点一律取**本条 bullet 内只出现一次**的词——`bullet_tokens` 只回答"这一串在不在这条
# 正文里"，`内容相似度高`（在 ① 与 ② 的位置句里各出现一次）这类**重复出现**的写法会被
# 同一个 bullet 的另一处兜住：**把一级判据整句删掉、同形字样仍在**，防线照样报绿。
# `until` 取 `例外（L2）`——该 bullet 的后半句（例外与"拆分出的文件不得添加历史来源注记"）
# 与前三级判据无关，把它们排除在核对对象外，锚点才真正落在判据本体那一段。
[[guards.check_split_history_ownership_guard]]
bullet = "一份变多份的历史归属"
file = "specs/general/git.adoc"
kind = "bullet_tokens"
