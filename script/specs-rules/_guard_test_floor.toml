# 『防线与反例用例』的记账——**按防线分片**，一道防线一行。
#
# 为什么是这张表、不是一个 `GUARD_TEST_BASELINE` 常量：全局单值计数器是**单点写入**——
# 每个新增/删除反例的改动都得改同一行，两个并行 PR 只要都碰它，合并时**必然**撞在同一个
# 物理行上（本仓库实证：近 12 次 main 提交有 12 次动了那个常量，其中 5 次是同一行）。
# 改成按防线名分片之后，各人各改自己那一道的行，天生不同 hunk、不再结构性冲突。
#
# 口径（不是"用例条数"，而是**用例类数**）：值是钉住该道防线的 `TestCase` **类**个数。
#   * 取"类"不取"条"：同一测试类里加一条反例是**追加在本类末尾**，与并行改动天然不同
#     hunk；而"条"数的总数仍会撞同一行，等于把冲突从常量搬到了表里。
#   * 未登记的防线按 0 计：`check_specs.py` 的 `CHECKS` 里出现的每一道防线都须在本表有一行
#     （漏登记即报红），删掉一道防线的行则报红——增删照样在 diff 里可见。
#   * **加减都报**（与旧的"只许增"基线不同）：这道防线一个用例类都没有了，多半是
#     "删防线时连它的反例一起删"，那件事必须在 diff 里留下痕迹；确要减就同时删行、写一句说明。
#
# 逐轮沿革不进这里（本表只记"现在是多少"）：沿革按轮次分文件落在
# `specs-project-maintainer/ledger/`，一轮一个文件——多个改动方各加自己的文件，
# 谁也不碰谁（同一张表里"每轮往里插一行"同样必冲）。

