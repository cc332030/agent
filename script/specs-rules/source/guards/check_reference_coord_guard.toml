# 『skill 引用坐标』判据本体——落点是**实测依据**（安装侧真正落到落点的只有 SKILL.md），
# 故本组核的是"这句话还在不在"：它被抽掉时，执行者会按"引用方能看到 references/ 目录"
# 写引用（与安装侧实测相反），而那道防线的形态判据仍在、继续报绿。
[[guards.check_reference_coord_guard]]
file = "script/specs-rules/_tokens.toml"
groups = [
    [
        "位置式坐标的判据图形",
        [
            "REF_COORD_POSITIONAL_RE",
            "REF_COORD_POSITIONAL_OK_RE",
            "RELATIVE_POSITION_OK_RE",
            # 图形本体里**只出现一次**的片段：只核"变量名还在"时，把正则改成空串
            # （`REF_COORD_POSITIONAL_RE = `）仍能过——那正是"判据图形被抽走"的形态。
            "(?:最后|末尾|倒数第",
            "序号(?:为|是)?",
        ],
        "缺则这道防线没有可核的图形：位置式（条号/序号）与「第 N 步」的区分退回函数体硬编码，改判据就要改脚本",
    ],
]
kind = "file_groups"
