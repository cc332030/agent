[[guards.check_skill_ref_coord_guard]]
file = "script/specs-rules/_tokens.toml"
groups = [
    [
        "兄弟文件引用前缀清单",
        [
            "SKILL_SIBLING_REF_PREFIXES",
            # 锚点须落在**清单本体**上：只核 `SKILL_SIBLING_REF_PREFIXES = [` 时，
            # 清空成 `= []` 仍含该子串、照样过（本轮实测的空转形态）。
            '''"references/",
    "scripts/",''',
        ],
        "缺则这道防线没有可核的引用面（哪些前缀算「指向兄弟文件」退回执行者凭感觉）",
    ],
]
kind = "file_groups"

# 『引用坐标』的**判据图形**（位置式表述的正则）也在规则数据里：图形写在防线函数体里时，
# 把"条号"那一段整段删掉仍会全绿（本轮实测的空转形态），故一并核它在不在。
