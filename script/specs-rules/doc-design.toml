[[guards.check_dependency_view_guard]]
file = "specs/general/doc-design.adoc"
groups = [
    [
        "doc/dependency.adoc",
        [
            "doc/dependency.adoc",
            "多模块",
            "文档根目录",
        ],
        "落点与位置：多模块项目须有固定路径 `doc/dependency.adoc`，且写明它放在文档根目录（使站点导航与 AI 可按固定路径直达）——路径不固定则『先查本文档』无从执行",
    ],
    [
        "完整",
        [
            "完整",
            "全部模块",
            "模块之间",
        ],
        "完整（L1）：须列出**当前项目全部模块之间**的依赖关系，且写明『完整』的含义是模块之间、而非第三方库清单（否则读者仍要去读构建文件）",
    ],
    [
        "UML",
        [
            "UML",
            "依赖箭头",
        ],
        "UML 优先（L1）：依赖关系须以 UML 图为主（模块用组件/包、依赖用依赖箭头），**不得只写一段文字描述**——文字无法枚举全部模块对",
    ],
    [
        "先读本视图",
        [
            "先读本视图",
            "不重启依赖树解析",
        ],
        "先说清『查依赖关系优先查本文档』：涉及依赖判断时先读本视图、回答完即止，不得每次重新解析依赖树（否则本条等于没写）",
    ],
    [
        "没有本视图时",
        [
            "没有本视图时",
            "本次任务内",
            "补全后再用",
        ],
        "文档缺失则新增（L1）：多模块项目没有本视图时须在本次任务内新增/补全，不得以『存量还没有』为由跳过（否则规则只对已合规的项目生效）",
    ],
    [
        "同一提交内",
        [
            "同一提交内",
            "更新本视图",
        ],
        "同提交同步（L1）：模块之间增删依赖、新增/拆分模块后须在同一提交内更新本视图——视图过期比没有更坏（读者会按它得出错误结论）",
    ],
    [
        "不得再在它的依赖清单里重复声明",
        [
            "不得再在它的依赖清单里重复声明",
            "新增依赖前先读本视图",
        ],
        "不重复声明（L1）：模块已被（直接或间接）依赖时不得重复声明同一依赖，且须写明新增依赖前先读本视图（这是本条要消灭的那个失效本身）",
    ],
    [
        "不替代构建工具",
        [
            "不替代构建工具",
            "第三方库",
        ],
        "文档与工具各司其职（L2）：本视图不替代构建工具的依赖树（依赖树只描述第三方库的传递关系、与模块间依赖不是一回事），冲突时以构建文件为准",
    ],
    [
        "依据",
        [
            "依据",
            "ISO/IEC/IEEE 42010",
            "UML",
        ],
        "依据行：须标注标准名/编号（架构描述与 UML 记法、可追溯性、显式声明依赖），否则后人无从判断它还成不成立",
    ],
]
kind = "regex_section"
label = "依赖关系文档（模块间依赖的唯一视图）"
message = "依赖关系文档防线被破坏：{file}「{DEPENDENCY_VIEW_SECTION}」缺失要点 {missing}——{desc}；该条对应用户报告的真实失效（模块已间接依赖却又加一次），不得删除、不得降级为建议"
pattern = "^== 依赖关系文档（模块间依赖的唯一视图）.*?(?=^== |\\Z)"
