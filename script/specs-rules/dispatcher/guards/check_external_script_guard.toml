pattern = "^== 跨语言执行脚本的落点（资源文件夹，不写字符串拼接/模板）(?:\\s|$).*?(?=^== |\\Z)"


# 『调度器不得抄条目本体』：对每条调度行，取其括号内的说明段，与**被引规范文件**的正文
# 做最长公共子串检测——超过阈值即报红。这是对上面那条"细节词"守卫的**补强**：细节词只能
# 拦「判定标准/任一命中」这类**措辞标记**，拦不住把**取值**成串抄进来（本轮实证的漏网形态：
# `@NoArgsConstructor`/`@RequiredArgsConstructor`/`@AllArgsConstructor`、
# `Tests`/`BootTests`/`PerfTests`/`IT`、`src/main/resources/`、`kebab-case`、
# `默认启用多线程构建`、`先解冲突、再压缩` 都被逐字抄进调度器、且既有守卫全绿）。
# 判据见 `specs/general/terminology.adoc`「数据字典」的「反膨胀」与
