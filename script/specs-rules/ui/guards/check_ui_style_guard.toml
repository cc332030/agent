[[guards.check_ui_style_guard]]
file = "specs/general/coding.adoc"
section = "界面与样式"
kind = "section_groups"
token_list = "UI_STYLE_ANCHORS"
message = "『界面与样式』防线被破坏：{file}「界面与样式」缺失要点 {missing}——{desc}；该条对应用户点名要求（优先用现成 UI 框架与开源样式方案、同一形态只许一个样式来源、不得每处从头写），不得删除、不得降级"

# 与上面那步成对：核**锚点清单自己的条数**——清单被删项时现场一字不少、上面的步骤
# 一次都不报错（"防线零证据"的形态）。删清单须与调 `min` 一并发生。
[[guards.check_ui_style_guard]]
file = "specs/general/coding.adoc"
section = "界面与样式"
kind = "anchor_count"
token_list = "UI_STYLE_ANCHORS"
min = 53

