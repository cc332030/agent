# ③ 加载门：调度器须登记界面识别特征——缺则写界面时永不触发加载（判据存在而走不到）。
[[guards.check_ui_style_guard]]
file = "AGENTS_COMMON.adoc"
kind = "file_tokens"
tokens = [
    "识别特征（含**界面**与**样式优先级**、**页面内容多**到要分组）",
    "**前端界面载体**",
    "一页内容的分组怎么摆、要不要给页内检索",
]
message = "『界面与样式』防线被破坏：{file} 缺失要点 {missing}——调度器须在「任何代码活动」与前端栈两处登记界面的识别特征（含样式优先级的触发：要写/改选择器或考虑要不要加 `!important` 时），缺则执行者写页面/样式时永不加载该节，判据存在却走不到"

# ④ README 目录说明同步（读者按 README 学习时须知道有这条规则）。
[[guards.check_ui_style_guard]]
file = "README.adoc"
kind = "file_tokens"
tokens = [
    "**界面与样式（任何语言、任何端",
    "**界面的取用入口与唯一落点**",
    "**分组组织与页内检索的载体**",
]
message = "『界面与样式』防线被破坏：{file} 缺失要点 {missing}——README 的目录说明须同步登记该条（通用层 `coding.adoc` 与栈层 `web.adoc` 两处），否则读者按 README 学习时无从知道有这条规则"

# ============================================================================
# 『同一件事只有一个来源』（`check_same_thing_one_source_guard`）
#
# 与上面『界面与样式』是**同一条判据的两档**：用户追问"功能也算吧？工具类也算吧？还能扩到
# 哪些地方？"——答案是把"同一套东西只许一处来源"铺到界面之外：功能（业务上同一件事各写
# 一套分支）、工具类（同一能力在两个 Utils 里各一份）、数据契约、配置、校验规则。
# 用户还给了**为什么先提界面**：样式只有人眼看到才知道有问题；功能与工具类一不一致，结果就
# 不同、甚至报错，能查出来——**只是底层还是各自为政**。故本条把"能查出来"与"会收敛"分开，
# 并要求重复须有能自动发现它的手段。
#
# 判据本体在 `specs/general/coding-ui.adoc`「界面与样式」的「同一件事只有一个来源（不限界面，
# 任何语言）」；栈层只给载体（Web 的前后端契约、Java 的工具方法落点），不另立判据。

# ① 判据本体：通用层该小节（两档后果、识别判据、五条 L1、例外、存量边界、依据行）。
[[guards.check_ui_style_guard]]
file = "library/adoption.adoc"
kind = "line_tokens"
anchor = ["内容多的页面按分组组织", "本集合自己的判据化取舍"]
tokens = [
    "**没有任何材料规定**",
    "**没有**规定",
    "**未**规定",
    "**检索须落在全页那一层**",
    "**本项目实证**",
]
message = "分组组织与页内检索防线被破坏：{file} 的该条登记行缺失 {missing}——本集合的取值须如实标注外部材料**未**规定该层（防读者把它读成标准规定），并须保留『检索须落在全页那一层』与实证出处"
