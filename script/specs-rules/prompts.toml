# 『优化公共规范』防线：**只对本项目生效 + 全项目范围（含命令本身）**与 **`tmp/` 降级**两组。
# 前一组是本轮用户口径（"只对本项目生效，作用范围整个项目所有内容，也包括命令本身"）：
# 缺它时会把本命令发给其他项目（判据源与对象都不在），或把扫描面缩回规范集合、
# 命令文件自身成了盲区。后一组是**降级路径**——`tmp/` 是**隐性硬性前置**，
# 只读工作区时这一步做不出来又没有退路，执行者会停在半路、或把"没做"写成"通过"。
# 「无降级路径的硬性前置一律不合规」。
[[guards.check_spec_optimize_guard]]
file = "prompts/spec-refine.adoc"
groups = [
    [
        "tmp 不可用时的降级路径",
        [
            "**`tmp/` 不可用时就地降级**",
            "清单写进本次汇报正文",
        ],
        "缺它时工作区只读或项目不落 `tmp/` 的场合无法落地——本步是全命令的核对依据",
    ],
    [
        "只对本项目生效与全项目范围（含命令本身）",
        [
            "**只对本项目（本仓库 `cc332030/agent`）生效**",
            "**不对其他项目成立、也不要复制到其他项目执行**",
            "**本项目的全部内容、不限于规范集合**",
            "**含本命令文件自身**",
            "一个都不漏",
        ],
        "缺「只对本项目生效」时会把本命令发给其他项目（判据源与对象都不在）；缺「全项目范围、含命令本身」时扫描面被缩回规范集合、命令文件自身成了盲区",
    ],
    [
        "自定分类的边界",
