# 『以对象定义规则、不给具体操作（写规范的写法口径）』规则数据。
#
# 判据本体在 `specs-project-maintainer/spec-lifecycle.adoc`「以对象定义规则、不给具体操作」
# ——它只对**维护这套规范集合**的项目成立，故落点在维护方自查层，不进公共内容。
#
# 本条防的失效（用户指出）：写规则时**顺手把"怎么取"也写进规范**——规范的读者拿到的是一个
# 随环境变的操作流程，而不是一条判据；换个执行者/换台机器，同一句话读出的动作就不一样。
#
# **核的是判据本体（条目正文与其标题），不是"这一节在不在"**（见
# `specs-project-maintainer/guards.adoc`「机械防线的核对对象是判据本体，不是轴名」）。
#
# 同一道防线的多处落点写成 `[[guards.check_declarative_rule_guard]]` 追加表。
[[guards.check_declarative_rule_guard]]
