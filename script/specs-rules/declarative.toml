message = "「以对象定义规则、不给具体操作」防线被破坏：{file} 缺失要点 {missing}——{desc}"

# Maven 侧：取值只到「当前构建设备的核心数」为止，
# **「怎么得到核心数」不得出现在任何一处**（本条要治的正是它）。
[[guards.check_declarative_rule_guard]]
file = "specs/stack/maven.adoc"
kind = "file_tokens"
tokens = [
    "mvn -T <核心数>",
    "核心数怎么得到是执行动作，不写进规范",
    "取值只定义到占位符那一层",
]
message = "「以对象定义规则、不给具体操作」防线被破坏：{file} 缺失要点 {missing}——Maven 并行度的取值须只到「当前构建设备的核心数」这一层（写成 `mvn -T <核心数>` 的占位符形态）；缺则规则会被读成「要自己去探测核数」"

[[guards.check_declarative_rule_guard]]
file = "prompts/_common.txt"
kind = "file_tokens"
tokens = [
    "mvn -T <核心数>",
    "核心数怎么得到是执行动作",
    "取值只定义到这一层",
]
message = "「以对象定义规则、不给具体操作」防线被破坏：{file} 缺失要点 {missing}——执行侧的 `build-parallel` 片段同口径（取值只到核心数一层），并回指本条的判据落点"

