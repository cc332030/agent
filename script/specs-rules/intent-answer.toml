# 『问与答对齐』防线（用户点名的失效：答非所问、漏下要求不提、换了条路就当中途结束）。
# 缺它时的失效：执行者答的是**相邻的另一件事**（用户实证：问"六条命令"、答"四个目录"），
# 或只做看得见的那一件、其余只字不提——而"没做"与"漏下没说"在文本上分辨不出来。
# 判据本体在 `specs/core/execution.adoc`；本文件只给"要点在不在"。
#
# **核对对象是"该节/该小节自己的正文"，不是整份文件**（`section_groups` /
# `subsection_groups`）：同一批字样在 `specs/` 下不止一处（`回答的必须是发起人这一问的那件事`
# 在 `execution.adoc` 也有一句、`不得跳过` 与 `漏下没说` 在 `execution.adoc` 另有落点），
# 按整份文件核时**把本节抽空也报不出来**——实测：把 `collab.adoc` 的「答什么由问句定」整条
# 删成"注意别答偏"（判定标准一并去掉），按整份文件核的 `file_groups` **全绿**。
# 故落点各按自己的层级（二级节 / 三级小节）取，锚点也**只在本节内**核对：
# 抽掉目标那句话后，同节别处不会再兜住它。
#
# 锚点一律取**规范正文的逐字节原文**（引号用正文里的 `"`、不要用排版引号 `“”`），
# 且**在本节/本小节内只出现一次**——否则抽掉目标那句后 token 仍从同节别处命中。
[[guards.check_intent_answer_guard]]
file = "specs/general/collab.adoc"
section = "任务的读懂"
groups = [
    [
        "先把“事”读出来",
        ['**先把"事"读出来（L1）**', "**不得只挑好做的一条**做"],
        "缺该条时派发进来的要求没有『先拆成事、再逐条答』的判据（用户点名的答非所问由此而来）",
    ],
    [
        "答什么由问句定",
        ["**答什么由问句定（L1）**", "**输出里答不上问句中任何一处即不属回答**"],
        "缺该条时题面上只剩一句『答什么由问句定』的标题，判据实体被抽走后读者按旧习惯答相邻的那件",
    ],
    [
        "没做的事要说出来",
        ["**没做的事要说出来（L1）**", '**"漏下没说"与"没做"同判**'],
        "缺该条时边缘要求漏做且只字未提（『漏下没说』与『没做』在这条判据上是同一件事）",
    ],
    [
        "重复提出不是豁免",
        ["**重复提出不是豁免（L1）**", '也不得因为"上一条评论里出现过"就当已办'],
        "缺该条时同一要求在任务单下被反复提出、执行者读成『已经说过了』而跳过",
    ],
    [
        "同一件事分步做、不分步说",
        ['**同一件事分步做、不分步说（L1）**', "想做下一件事须**另起一次派发**"],
        "缺该条时执行者把『分步做』落成『分步说』或『少做一部分』",
    ],
]
kind = "section_groups"
message = "问与答对齐防线被破坏：{file} 的「任务的读懂」节缺失要点 {missing}——{desc}；本条对应用户报告的真实失效（答的是相邻的另一件、漏下要求不提），不得删除、不得降级为建议"
