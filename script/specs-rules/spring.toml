# 『Spring 接口契约与参数校验』规则数据（被测落点＝`specs/stack/spring.adoc`）。
#
# 两条条目都是用户从存量项目规范引入的写法约定：
#   * 方法参数校验入口统一用 `@Validated`（`@Valid` 无分组参数、只作对象内部字段级联）；
#   * 控制器须显式声明 HTTP 方法；声明式客户端与提供方共用同一份契约接口；契约路径前缀只定义
#     一次；内部调用接口的参数以请求体承载、不逐个散参。
# 判据按**节**核（`section_groups`）：这几条分处同一节的多条 bullet，按节核即可覆盖
# 「适用范围 / 条文与级别 / 判定标准 / 边界 / 存量 / 依据」各处要件。
# 防的是：条文被降级成建议（「反正只发一种方法」「两侧写的就是一回事」「参数少就直接声明」）。
#
# **已知下界（如实记下，不靠它当上界）**：`section_groups` 判的是"该节里有没有这个串"，
# 故同一串在节内**出现多处**时，删掉其中一处不会报红——本文件里 `随动迁移`、
# `Spring Cloud OpenFeign 官方文档` 即属这种（每条 bullet 各有一份）。要拦住"单处删除"须
# 改用 `bullet_tokens` 逐条钉；本文件取"按节核 + 判定标准的具体反例逐个钉"的折中：
# **反例句与条文句一律入 tokens**（只钉 `**判定标准（任一命中即违规）**` 这个标题，
# 反例被抽走仍会全绿——那正是「轴名齐全、判据被抽走」的形态）。

[[guards.check_validation_entry_guard]]
file = "specs/stack/spring.adoc"
groups = [
    [
        "条文与级别",
        [
            "方法参数校验统一用 `@Validated`（L2）",
            "**不把 `@Valid` 用作方法参数校验的入口**",
        ],
        "条文：须有该条并写明参数校验入口统一用 `@Validated`、**不把 `@Valid` 用作参数入口**——只写「建议用 `@Validated`」时，参数上直接用 `@Valid` 会重新成立（该处需要分组校验时它就表达不了）",
    ],
    [
        "分工（@Valid 只作字段级联）",
        [
            "`@Valid` 无分组参数",
            "**对象内部字段的级联校验**",
        ],
        "分工：须写明 `@Valid` 无分组参数、只承担对象内部字段的级联校验——缺则该禁令会被读成「`@Valid` 一律不许用」，把嵌套校验这一正当用法一并禁掉",
    ],
    [
        "判定标准（逐条可核对）",
        [
            "**判定标准（任一命中即违规）**",
            "方法参数上以 `@Valid` 作校验入口",
            "**类级/方法级校验入口**",
        ],
        "判定标准：须给出可逐条核对的形态（参数位用 `@Valid` / 类级与方法级校验用 `@Valid` / 两种入口并存而未划边界）——缺则本条自身不可判定，只剩一句口号",
    ],
    [
        "影响面（引用方自身规范为准）",
        [
            "引用方项目自身规范另有约定时以其为准",
        ],
        "影响面：本条严于「参数上直接用 `@Valid`」这一常见做法，须写明与引用方自身规范的冲突次序——缺则等于静默推翻引用方既有约定",
    ],
    [
        "存量边界",
        [
            "随动迁移",
        ],
        "存量边界：须指向「规范变更的存量处理」（随动迁移、不发动全库改造），否则等于要求立刻批量改既有校验注解",
    ],
    [
        "依据名",
        [
            "Spring Framework 官方文档",
            "Jakarta Bean Validation 官方规范",
        ],
        "依据行：须保留标准/官方文档名（防依据被整段删除后无从追溯）",
    ],
]
kind = "section_groups"
message = "参数校验入口防线被破坏：{file} 的「参数校验」节缺失要点 {missing}——{desc}"
section = "参数校验"

[[guards.check_http_contract_guard]]
file = "specs/stack/spring.adoc"
groups = [
    [
        "适用范围（声明式客户端为前提）",
        [
            "**适用范围**",
            "使用声明式 HTTP 客户端",
            "未使用者不适用",
        ],
        "适用范围：契约接口那几条以项目使用声明式 HTTP 客户端为前提，须写明未使用者不适用——缺则没用声明式客户端的 Spring 项目会把契约条当成通用必做（误伤面）",
    ],
    [
        "控制器显式声明 HTTP 方法",
        [
            "控制器方法须显式声明 HTTP 方法（L2）",
            "**指明 HTTP 方法**的注解映射",
            "**判定标准（任一命中即违规）**",
            "① 新增或改动的路由用不限定 HTTP 方法的映射",
            "以「调用方反正只发一种方法」为由不限定",
        ],
        "条文与判定标准：不限定方法的映射会对全部 HTTP 方法开放、把读写语义混在一起；须点名「指明 HTTP 方法」并给出**可逐条核对的反例**（不限定方法的映射 / 以「调用方反正只发一种方法」为由）——只钉判定标准的标题时，反例被抽走仍全绿",
    ],
    [
        "契约共用同一份接口",
        [
            "声明式客户端与提供方共用同一份契约接口（L2）",
            "**客户端继承该契约、提供方实现该契约**",
            "客户端与提供方各自声明方法签名、不共用同一契约类型",
            "以「两侧写的就是一回事」为由不抽契约",
        ],
        "契约共用：须写明只定义一份契约、客户端继承而提供方实现，并给出可核对反例（两侧各写一份签名 / 以「两侧写的就是一回事」为由不抽契约）——缺则同一份契约出现两个来源，改一侧必漏另一侧",
    ],
    [
        "契约前缀只定义一次",
        [
            "契约的路径前缀只定义一次（L1）",
            "**契约方法上只写相对路径**",
            "契约方法的路由里出现与前缀重复的路径段",
            "前缀只写在契约方法上、而不写在客户端声明与提供方映射处",
        ],
        "前缀单点：须写明前缀在客户端声明与提供方映射处各一处、**契约方法上只写相对路径**，并给出可核对反例（方法路由里重复前缀 / 前缀只写在方法上）——缺则同一事实出现两个来源，改前缀必漏方法上那一份",
    ],
    [
        "参数以请求体承载、不逐个散参",
        [
            "内部调用接口的参数以请求体承载，不逐个散参（L2）",
            "`@SpringQueryMap`",
            "**逐个声明**",
            "该组参数本可由同一个参数对象承载",
            "同一契约里两种承载方式并存",
        ],
        "参数承载：须写明参数以请求体承载该接口自己的参数对象、确需查询参数时用整对象映射（点名 `@SpringQueryMap`）、**不得把参数清单逐个声明**，并给出可核对反例（该组参数本可由同一对象承载 / 两种承载方式并存而无边界）——缺则参数清单散落在方法签名里、键名只能靠字面约定",
    ],
    [
        "依据名与取舍定性",
        [
            "RFC 9110",
            "Spring Cloud OpenFeign 官方文档",
            "**「路由须显式声明 HTTP 方法」是本集合的判据化取值**",
        ],
        "依据行：须保留官方文档/标准名，并把「路由须显式声明 HTTP 方法」如实标为本集合的判据化取值——缺则读者会把它读成协议或框架的强制要求",
    ],
    [
        "存量边界",
        [
            "随动迁移",
        ],
        "存量边界：须指向「规范变更的存量处理」（随动迁移、不发动全库改造），否则等于要求立刻批量改既有路由与契约",
    ],
]
kind = "section_groups"
message = "HTTP 接口契约防线被破坏：{file} 的「HTTP 接口（控制器与声明式客户端）」节缺失要点 {missing}——{desc}"
section = "HTTP 接口（控制器与声明式客户端）"

# 加载门：调度器的 Spring 技术栈条须给出识别特征（缺则"写/改参数校验注解、HTTP 方法映射、
# 声明式客户端契约"这些场景不会触发加载本文件——写规则与登记是同一个动作）。两道各钉
# **自己那一条**的识别特征（同一行、不同 token，互不替代）。
[[guards.check_validation_entry_guard]]
anchor = ["Spring 项目"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "参数校验入口防线被破坏：{file} 的 Spring 技术栈登记缺失 {missing}——缺该识别特征时，写校验注解不会触发加载该条"
tokens = ["要写/改**参数校验注解**"]

[[guards.check_http_contract_guard]]
anchor = ["Spring 项目"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "HTTP 接口契约防线被破坏：{file} 的 Spring 技术栈登记缺失 {missing}——缺该识别特征时，写 HTTP 方法映射与声明式客户端契约不会触发加载该节"
tokens = ["**HTTP 方法映射**", "**声明式客户端契约**"]

# 『配置项绑定』防线（PR #202：禁用 `@Value`，配置项统一 `@ConfigurationProperties`）。
# 该条对应用户提出的要求：外部配置**只允许**绑定到 `@ConfigurationProperties` 类、
# **禁止使用 `@Value`**；存量随动迁移、code review 不对存量报。判据按**本条 bullet** 核
# （`bullet_tokens`）：「配置」节里相邻条目含 `@ConfigurationProperties`、`@Configuration`、
# 「判定标准」「随动迁移」等同样字样，整节核会把本条锚点被抽走的形态兜住。
# 加载门另钉：调度器 Spring 条须给出「配置项绑定注解」识别特征（缺则写/改 `@Value`
# 不会触发加载该条）。
[[guards.check_value_binding_guard]]
bullet = "配置项统一用 `@ConfigurationProperties` 绑定（L1）"
file = "specs/stack/spring.adoc"
kind = "bullet_tokens"
message = "配置项绑定防线被破坏：{file} 的「配置项统一用 `@ConfigurationProperties` 绑定（L1）」条**本条自己的正文**缺失 {missing}——该条对应用户提出的要求（外部配置只允许 `@ConfigurationProperties`、禁止 `@Value`），不得删除、不得降级、不得把 `@Value` 放回允许面"
section = "配置"
tokens = [
    # 条文与禁止面（防被降级成「@Value 仅限少量简单配置」那类弹性口径——判据不可核对即失效）
    "禁止使用 `@Value`",
    "业务代码与配置类中的字段注入、构造参数与方法参数",
    # 边界（SpEL 不属外部配置绑定，缺则该禁令会被读成「`#{...}` 也禁」）
    "SpEL 取值（`#{...}`）不受本条约束",
    # 判定标准（逐条可核对）
    "**判定标准（任一命中即违规）**",
    "新增或改动的代码中出现 `@Value` 注解",
    "为绕开本条把配置项塞进 `@Configuration` 类的字段",
    # 存量边界（随动迁移 + review 静默，缺则等于要求立刻批量改存量）
    "不属违规、按原样保留",
    "code review 也不对存量 `@Value` 作问题提示",
    # 依据行（标准名 + 本集合取舍）
    "Spring Boot 官方文档「Externalized Configuration」",
    "The Twelve-Factor App",
]

[[guards.check_value_binding_guard]]
anchor = ["Spring 项目"]
file = "AGENTS_COMMON.adoc"
kind = "line_tokens"
message = "配置项绑定防线被破坏：{file} 的 Spring 技术栈登记缺失 {missing}——缺该识别特征时，写/改 `@Value`/`@ConfigurationProperties` 不会触发加载该条"
tokens = ["**配置项绑定注解**（`@Value`/`@ConfigurationProperties`）"]
