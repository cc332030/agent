        "须写明本条**只管配置文本里字符串的书写形态**、读进程序后如何使用是另一条（回指 `script.adoc`「安全」与 `security.adoc`「输出编码/转义」）——缺则收不到范围边界，本条会被当成『配置值安全』的总条",
