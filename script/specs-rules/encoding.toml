        "须逐类列出**必须加引号的取值形态**（数字开头 / 布尔与空值字样 / 特殊符号起头 / 含 YAML 有语义的字符 / 会被推断成日期），且含语义字符那一类须写明**不写引号会怎样**（值被截断、或被解析成新的键/注释）——只写一句『该加就加』则读者判不出自己这一处算不算，本条无法执行",
    ],
    [
        "双引号优先于单引号（转义差异）",
