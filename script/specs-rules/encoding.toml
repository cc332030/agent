# 配置文件字符串引号防线——用户口径：一个配置值由数字/英文/特殊符号组成、且**明确是字符串**时，
# 必须加双引号，避免被 YAML 的隐式类型推断转义掉（`"1.10"` 被读成浮点 1.1、`"yes"` 被读成布尔等）。
# 落点在「文件编码与换行符」通用层：本条管的是**配置文本里字符串怎么书写**（与编码/行尾同类），
# 与"怎么跑流水线"无关；对**任何**用 YAML 一类有隐式类型推断格式的项目成立（通用性过准入判定）。
#
# `~cut-end` / `~cut-start` 是**截断标记**（见 `rules_engine._step_section_bullets`）：本条的
# 『必须用双引号』与紧随其后的『判定标准』同处一条 bullet、且两处都出现『双引号』，按整条
# bullet 核时后者会把前者兜住（本仓库实测：把『必须用双引号』抽成『建议用双引号』仍全绿）。
# 故该 bullet 按**判定标准之前/之后**分成两组核，让两段各有专属核对对象。

[[guards.check_yaml_string_quote_guard]]
file = "specs/general/encoding.adoc"
kind = "section_bullets"
section = "配置文件的字符串取值须加引号"
label = "配置文件的字符串取值须加引号"
message = "YAML 字符串引号防线被破坏：{file} 的「配置文件的字符串取值须加引号」缺失要点 {missing}——{desc}"
groups = [
    [
        "规则本体与级别",
        [
            "明确是字符串的值一律加双引号",
            "（L1，用户口径）",
            "必须用双引号",
            "**判定标准~cut-end",
        ],
        "须写明**语义为字符串的标量一律加双引号**并标 L1（用户明确提出的硬性要求）；缺『一律』或掉了 L1 则本条退化成『建议』。核对只取该条 bullet 的前半段（到判定标准之前）——判定标准的措辞里同样出现『双引号』，按整条 bullet 核时抽走『必须用双引号』仍会被后半句兜住",
    ],
    [
        "取值＝被双引号包着、不依赖解析器推断（机制句）",
        [
            "明确是字符串的值一律加双引号",
            "取值＝该标量被双引号包着",
            "不依赖解析器如何推断",
            "随解析器与 YAML 版本而变",
            "**判定标准~cut-end",
        ],
        "须写明取值形态是**文本里被双引号包着**、且**不依赖解析器推断**（推断出的类型随解析器与 YAML 版本而变）——缺这句则『我这边解析出来正好对』会把裸值合理化掉，正是本条要拦的形态",
    ],
    [
        "判定标准（任一命中即违规）",
        [
            "明确是字符串的值一律加双引号",
            "以裸值书写",
            "为规避转义而改写成别的等价裸形态",
            "**判定标准~cut-start",
        ],
        "判定标准须可逐条核对，且须包含『不得把 `1.10` 改写成 `1.1` 顶替加引号』（那是改取值、不是改格式）——缺则本条会被『换个等价裸写法』绕开。核对只取判定标准这一句起（同一条 bullet，与上一组按同一标记分段）",
    ],
    [
        "须加引号的取值形态逐类（本条的可核对面）",
        [
            "须加引号的取值形态（可逐条核对）",
            "以数字开头的字符串",
            "恰为布尔/空值字样",
            "以特殊符号起头",
            "含 YAML 有特殊含义字符",
            "不写引号时该值会被截断或被解析成新的键/注释",
            "会被推断成日期",
